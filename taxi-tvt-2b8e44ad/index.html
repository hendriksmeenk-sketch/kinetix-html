hten"],"ok":1,"why":"RVV 23: stilstaan bij een bushalte mag niet, maar het geldt niet voor onmiddellijk in- en uitstappen (lid 2).","wrong":["Er is een uitzondering voor in- en uitstappen.","","Wachten is geen onmiddellijk in-/uitstappen."],"bron":"RVV 1990 art. 23 lid 1e en lid 2"},{"id":"s1-t2-l03","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Hoe ver van een kruispunt mag je niet parkeren?","opts":["Minder dan 5 meter","Minder dan 10 meter","Minder dan 15 meter"],"ok":0,"why":"RVV 24 lid 1a: niet parkeren bij een kruispunt op minder dan vijf meter.","wrong":["","Fout getal.","Fout getal."],"bron":"RVV 1990 art. 24 lid 1a"},{"id":"s1-t2-l04","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Mag je stilstaan op een oversteekplaats of binnen 5 meter ervan?","opts":["Ja, kort voor in- en uitstappen","Nee","Alleen 's nachts"],"ok":1,"why":"RVV 23 lid 1c: niet stilstaan op een oversteekplaats of binnen vijf meter. De in-/uitstapuitzondering geldt alleen voor de bushalte.","wrong":["De uitzondering van lid 2 geldt alleen voor de bushalte (onderdeel e).","","Geen tijdsuitzondering."],"bron":"RVV 1990 art. 23 lid 1c"},{"id":"s1-t2-l05","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Gelijkwaardig kruispunt. Een tram komt van links. Wie gaat eerst?","opts":["Jij, want de tram komt van links","De tram","Wie het snelst rijdt"],"ok":1,"why":"RVV 15 lid 2b: bestuurders verlenen voorrang aan de tram.","wrong":["De tram is een uitzondering op 'rechts gaat voor'.","",""],"bron":"RVV 1990 art. 15 lid 2b"},{"id":"s1-t2-l06","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Je komt van een zandweg (onverhard) op een asfaltweg. Een auto nadert van links. Wie gaat voor?","opts":["Jij, want je komt van rechts","De auto op de verharde weg","Niemand heeft voorrang"],"ok":1,"why":"RVV 15 lid 2a: wie van een onverharde weg komt, verleent voorrang aan verkeer op een verharde weg.","wrong":["Onverhard naar verhard is een uitzondering op 'rechts gaat voor'.","",""],"bron":"RVV 1990 art. 15 lid 2a"},{"id":"s1-t2-l07","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Je slaat linksaf. Een tegenligger slaat op hetzelfde kruispunt rechtsaf. Wie gaat eerst?","opts":["Jij","De tegenligger die rechtsaf slaat","Wie het eerst richting aangaf"],"ok":1,"why":"RVV 18 lid 2: wie linksaf slaat, laat tegemoetkomers die op hetzelfde kruispunt rechtsaf slaan voorgaan.","wrong":["Linksaf moet wachten.","","Richting aangeven geeft geen voorrang."],"bron":"RVV 1990 art. 18 lid 2"},{"id":"s1-t2-l08","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Het verkeerslicht staat op groen, maar er staat ook een haaientandenbord (voorrang verlenen). Wat geldt?","opts":["Het bord","Het verkeerslicht","Rechts gaat voor"],"ok":1,"why":"RVV 64: verkeerslichten gaan boven verkeerstekens die de voorrang regelen.","wrong":["Het bord is lager in rang.","","Regels zijn het laagst."],"bron":"RVV 1990 art. 64"},{"id":"s1-t2-l09","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Een verkeersbord zegt iets anders dan een algemene verkeersregel. Wat geldt?","opts":["Het verkeersbord","De verkeersregel","Wat het veiligst voelt"],"ok":0,"why":"RVV 63: verkeerstekens gaan boven verkeersregels als ze niet samen kunnen.","wrong":["","Regels zijn lager dan tekens.","Je volgt de rangorde."],"bron":"RVV 1990 art. 63"},{"id":"s1-t2-l10","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Je rijdt weg van een parkeerplaats langs de weg. Wie gaat voor?","opts":["Jij, want je gaf richting aan","Het overige verkeer","Wie van rechts komt"],"ok":1,"why":"RVV 54: bij een bijzondere manoeuvre (zoals wegrijden) laat je het overige verkeer voorgaan.","wrong":["Richting aangeven geeft geen voorrang.","","Bij een bijzondere manoeuvre geldt 'rechts gaat voor' niet."],"bron":"RVV 1990 art. 54"},{"id":"s1-t2-l11","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Binnen de bebouwde kom. Een bus bij de halte zet zijn richtingaanwijzer aan om weg te rijden. Wat doe je?","opts":["Snel langsrijden","Hem de gelegenheid geven weg te rijden","Toeteren"],"ok":1,"why":"RVV 56: binnen de kom geef je een bus die richting aangeeft de gelegenheid om van de halte weg te rijden.","wrong":["Juist niet.","","Toeteren alleen bij dreigend gevaar."],"bron":"RVV 1990 art. 56"},{"id":"s1-t2-l12","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"'s Nachts buiten de kom met groot licht. Er komt een tegenligger. Wat doe je?","opts":["Groot licht aan laten","Dimlicht","Mistlicht aan"],"ok":1,"why":"RVV 32 lid 2b: groot licht mag niet bij het tegenkomen van een andere weggebruiker.","wrong":["Verboden bij een tegenligger.","","Mistlicht is alleen voor slecht zicht door mist, sneeuw of regen (RVV 34)."],"bron":"RVV 1990 art. 32 lid 2"},{"id":"s1-t2-l13","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Wanneer mag je toeteren of met je lichten knipperen?","opts":["Om een passagier te laten weten dat je er bent","Alleen om dreigend gevaar af te wenden","Om een langzame auto op te jagen"],"ok":1,"why":"RVV 28: geluids- en knippersignalen alleen ter afwending van dreigend gevaar.","wrong":["Dat is geen dreigend gevaar.","","Dat is geen dreigend gevaar en ook onbeleefd."],"bron":"RVV 1990 art. 28"},{"id":"s1-t2-l14","tak":2,"niveau":"lopen","et":"ET 2.1","type":"mc","q":"Je hebt al meer dan 5 jaar je rijbewijs. Wat is de wettelijke alcoholgrens in je bloed?","opts":["0,2 promille","0,5 promille","0,8 promille"],"ok":1,"why":"WVW 8 lid 2: bloed 0,5 mg/ml (0,5 promille) of adem 220 µg/l.","wrong":["0,2 geldt voor beginnende bestuurders (lid 3).","","0,8 is een grens voor invorderen bij beginners (WVW 164)."],"bron":"WVW 1994 art. 8 lid 2"},{"id":"s1-t2-l15","tak":2,"niveau":"lopen","et":"ET 2.1","type":"mc","q":"Wat is de alcoholgrens voor een beginnende bestuurder (rijbewijs korter dan 5 jaar, gehaald na je 18e)?","opts":["0,2 promille bloed / 88 µg/l adem","0,5 promille bloed / 220 µg/l adem","0,0 promille"],"ok":0,"why":"WVW 8 lid 3: beginners 0,2 mg/ml bloed of 88 µg/l adem.","wrong":["","Dat is de grens voor ervaren bestuurders.","Geen nulgrens in de wet."],"bron":"WVW 1994 art. 8 lid 3"},{"id":"s1-t2-l16","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Het verkeer staat vast. Mag je het kruispunt oprijden als je er niet af kunt?","opts":["Ja, als je groen hebt","Nee, je mag een kruispunt niet blokkeren","Alleen met passagiers"],"ok":1,"why":"RVV 14: bestuurders mogen een kruispunt niet blokkeren.","wrong":["Groen geeft geen recht om te blokkeren.","","Geen uitzondering."],"bron":"RVV 1990 art. 14"},{"id":"s1-t2-l17","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Wanneer mag je een overweg (spoorwegovergang) op?","opts":["Als de bomen nog open zijn","Als je direct kunt doorrijden en de overweg helemaal kunt vrijmaken","Als er geen trein te zien is, ook als je moet stoppen op het spoor"],"ok":1,"why":"RVV 15a lid 1: alleen als je direct door kunt gaan en de overweg geheel kunt vrijmaken.","wrong":["Open bomen alleen is niet genoeg.","","Nooit stoppen op het spoor."],"bron":"RVV 1990 art. 15a"},{"id":"s1-t2-r01","tak":2,"niveau":"rennen","et":"ET 2.2","type":"multi","q":"In welke situaties mag je RECHTS inhalen? Kies ALLE juiste.","opts":["In een file","Op of vlak voor een rotonde","Een tram","Een bestuurder die links voorsorteert en richting links aangeeft","Rechts van een blokmarkering (verkeer links ervan)","Op een tweestrooksweg buiten de kom als links iemand langzaam rijdt zonder file"],"ok":[0,1,2,3,4],"why":"FRUIT+: File (RVV 13), Rotonde (48), blokmarkering bij in-/uitvoegen (11 lid 4), Tram (11 lid 5), + links voorsorteerder (11 lid 2).","wrong":["","","","","","Zonder file is rechts inhalen hier niet toegestaan: inhalen gebeurt links (RVV 11 lid 1)."],"bron":"RVV 1990 art. 11, 13, 48"},{"id":"s1-t2-r02","tak":2,"niveau":"rennen","et":"ET 2.2","type":"order","q":"Zet in de juiste rangorde, van HOOG naar LAAG.","opts":["Aanwijzingen van een verkeersregelaar","Verkeerslichten","Verkeerstekens die de voorrang regelen","Verkeersregels"],"ok":[0,1,2,3],"why":"RVV 84: aanwijzingen boven tekens en regels. RVV 64: lichten boven voorrangstekens. RVV 63: tekens boven regels.","bron":"RVV 1990 art. 84, 64, 63"},{"id":"s1-t2-r03","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Langs de weg staat een bord 50. Op het elektronische signaleringsbord boven je rijstrook staat 70. Wat is je maximum?","opts":["70, elektronisch gaat voor","50, de laagste aangegeven snelheid geldt","60, het gemiddelde"],"ok":1,"why":"RVV 63b lid 2: als borden én elektronische signaleringsborden een maximum geven, geldt de laagste.","wrong":["Elektronisch gaat niet automatisch voor.","","Middelen bestaat niet."],"bron":"RVV 1990 art. 63b lid 2"},{"id":"s1-t2-r04","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Je rijdt een erf in. Een (fout geplaatst) bord geeft 30 km/u aan. Wat is je maximum?","opts":["30 km/u, het bord gaat boven de regel","15 km/u, bij een hogere aangegeven snelheid dan artikel 45 geldt de laagste","Stapvoets zonder getal"],"ok":1,"why":"RVV 63b lid 1c: geeft een bord een hogere snelheid dan de 15 km/u van artikel 45, dan geldt de laagste.","wrong":["Normaal gaan borden boven regels (RVV 63), maar 63b maakt hier een uitzondering.","","De wet noemt een getal: 15."],"bron":"RVV 1990 art. 63b lid 1c en art. 45"},{"id":"s1-t2-r05","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Wegwerkzaamheden. Gele (tijdelijke) strepen op het wegdek wijzen een andere rijstrook aan dan de witte strepen. Wat volg je?","opts":["De witte strepen","De gele, tijdelijke strepen","Wat je navigatie zegt"],"ok":1,"why":"RVV 63a: tijdelijke verkeerstekens op het wegdek gaan boven de andere tekens op het wegdek.","wrong":["Wit is hier lager in rang.","","De navigatie is geen verkeersteken."],"bron":"RVV 1990 art. 63a"},{"id":"s1-t2-r06","tak":2,"niveau":"rennen","et":"ET 2.1","type":"mc","q":"Krijger kreeg op zijn 23e, in maart 2023, zijn eerste rijbewijs. Zaterdag 17 okt 2026, 23:15, blaast hij 150 µg/l. Wat klopt?","opts":["In orde: onder de 220 µg/l","Overtreding: hij is nog geen 5 jaar bestuurder, dus geldt 88 µg/l","In orde: de beginnersgrens geldt alleen de eerste 2 jaar"],"ok":1,"why":"WVW 8 lid 3: tot 5 jaar na de eerste afgifte (gehaald na je 18e) geldt 88 µg/l adem / 0,2 promille bloed. Maart 2023 + 5 jaar = maart 2028.","wrong":["220 geldt pas na 5 jaar.","","Het is 5 jaar, niet 2."],"bron":"WVW 1994 art. 8 lid 3"},{"id":"s1-t2-r07","tak":2,"niveau":"rennen","et":"ET 2.1","type":"mc","q":"Krijger rijdt 132 km/u op een weg waar 80 geldt en wordt staande gehouden. Wat kan de politie?","opts":["Alleen een boete geven","Zijn rijbewijs invorderen (50 km/u of meer te hard)","Niets, onder 50 km/u te hard"],"ok":1,"why":"WVW 164 lid 2d: bij 50 km/u of meer te hard (en staandehouding) wordt het rijbewijs gevorderd. 132 − 80 = 52.","wrong":["Invorderen is hier verplicht.","","Het is 52 km/u te hard: boven de grens."],"bron":"WVW 1994 art. 164 lid 2d"},{"id":"s1-t2-r08","tak":2,"niveau":"rennen","et":"ET 2.1","type":"num","q":"De politie legt een bestuurder onder invloed een rijverbod op. Hoeveel uur mag dat maximaal duren? Typ het getal.","ok":24,"why":"WVW 162 lid 1: een rijverbod voor ten hoogste vierentwintig uur.","bron":"WVW 1994 art. 162 lid 1","unit":"uur"},{"id":"s1-t2-r09","tak":2,"niveau":"rennen","et":"ET 2.1","type":"num","q":"Met een taxi van de zaak is een misdrijf gepleegd; de bestuurder is onbekend. De politie vraagt de eigenaar wie reed. De termijn is minimaal hoeveel uur? Typ het getal.","ok":48,"why":"WVW 165: de eigenaar/houder moet naam en adres van de bestuurder geven binnen een termijn van ten minste 48 uur.","bron":"WVW 1994 art. 165 lid 1","unit":"uur"},{"id":"s1-t2-r10","tak":2,"niveau":"rennen","et":"ET 2.1","type":"num","q":"Na een aanrijding met schade reed iemand door. Binnen hoeveel uur moet hij zich vrijwillig melden om vervolging voor doorrijden uit te sluiten? Typ het getal.","ok":12,"why":"WVW 184: vervolging is uitgesloten bij vrijwillige melding binnen twaalf uur, vóór aanhouding of verhoor, met identiteit van persoon en auto.","bron":"WVW 1994 art. 184","unit":"uur"},{"id":"s1-t2-r11","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Krijger rijdt schoolkinderen voor de gemeente, met een schriftelijk contract met vaste tarieven voor het hele jaar. Moet hij zelf de gordel dragen?","opts":["Nee, taxichauffeurs zijn tijdens betaald vervoer altijd vrijgesteld","Ja, bij zo'n contract (Wp2000 81 lid 2) geldt de vrijstelling voor de bestuurder niet","Alleen buiten de bebouwde kom"],"ok":1,"why":"RVV 59 lid 6: de bestuurder is tijdens betaald personenvervoer vrijgesteld van de gordelplicht, maar NIET bij een overeenkomst als in Wp2000 81 lid 2 (contract met vaste tarieven) en niet in een rolstoeltaxi.","wrong":["De vrijstelling heeft uitzonderingen: contract en rolstoeltaxi.","","De regel maakt geen onderscheid binnen/buiten de kom."],"bron":"RVV 1990 art. 59 lid 6 · Wp2000 art. 81 lid 2"},{"id":"s1-t2-r12","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Taxi zonder kinderzitje. Een moeder met een kind van 2 jaar (0,90 m) stapt in. Wat zegt RVV 59 voor de taxi?","opts":["Een kind onder 3 jaar mag nooit mee zonder kinderzitje","Het kind zit niet voorin; achterin met de gordel","Op schoot bij de moeder voorin"],"ok":1,"why":"RVV 59 lid 5: lid 2 (de regel 'onder 3 jaar niet mee' voor auto's zonder gordel/zitje) geldt niet in taxi's. In een taxi zonder zitje zit een kind < 1,35 m niet voorin.","wrong":["Dat is lid 2, en dat geldt niet tijdens taxivervoer.","","Voorin mag niet, en op schoot is geen gordel."],"bron":"RVV 1990 art. 59 lid 2 en 5"},{"id":"s1-t2-r13","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Een ouder heeft een eigen naar achteren gericht babyzitje en wil het voorin zetten. De voorairbag staat aan. Wat zeg je?","opts":["Dat mag","Dat mag alleen als de airbag uit staat","Dat mag alleen achterin, ook als de airbag uit is"],"ok":1,"why":"RVV 59 lid 3: geen naar achteren gericht kinderzitje op een plaats met voorairbag, tenzij de airbag is uitgeschakeld.","wrong":["Met airbag aan is het verboden.","","Met airbag uit mag het wel voorin."],"bron":"RVV 1990 art. 59 lid 3"},{"id":"s1-t2-r14","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"File op de A2. Je passagier moet dringend plassen en wil op de vluchtstrook uitstappen. Wat doe je?","opts":["Op de vluchtstrook stoppen, het is maar kort","Niet doen: de vluchtstrook is alleen voor noodgevallen; naar de eerstvolgende parkeerplaats of afrit","Op de rijbaan stoppen, want je staat toch stil"],"ok":1,"why":"RVV 43: de vluchtstrook alleen in noodgevallen; stilstaan op de rijbaan van een autosnelweg is verboden.","wrong":["Dringend plassen is geen noodgeval in de zin van de wet.","","Stilstaan op de rijbaan van een autosnelweg is verboden (lid 2)."],"bron":"RVV 1990 art. 43 lid 3"},{"id":"s1-t2-r15","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Wanneer mag je je mistachterlicht aandoen?","opts":["Bij mist of sneeuwval met zicht minder dan 50 meter","Bij zware regen met zicht minder dan 100 meter","Altijd in het donker buiten de kom"],"ok":0,"why":"RVV 34 lid 2: mistachterlicht alleen bij mist of sneeuwval die het zicht beperkt tot minder dan 50 meter. Regen hoort daar niet bij.","wrong":["","Regen staat niet in lid 2, en 100 m is het verkeerde getal.","Dat is geen reden."],"bron":"RVV 1990 art. 34 lid 2"},{"id":"s1-t2-r16","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Langs een gele onderbroken streep. Je laat een passagier uitstappen en wacht daarna 10 minuten op je volgende klant. Wat klopt?","opts":["Allebei mag","Uitstappen mag (stilstaan); 10 minuten wachten is parkeren en dat is hier verboden","Allebei verboden"],"ok":1,"why":"Parkeren = stilstaan langer dan nodig voor onmiddellijk in- of uitstappen of laden/lossen (RVV 1). Langs een gele onderbroken streep mag je niet parkeren (RVV 24 lid 1e).","wrong":["Wachten is parkeren.","","Kort uitstappen is stilstaan en dat mag bij een onderbroken gele streep. (Bij een DOORGETROKKEN gele streep mag ook stilstaan niet, RVV 23.)"],"bron":"RVV 1990 art. 1 (parkeren) en art. 24 lid 1e"},{"id":"s1-t2-r17","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Welke voertuigen mogen op een autosnelweg?","opts":["Motorvoertuigen die ten minste 60 km/u mogen én kunnen rijden","Alle motorvoertuigen","Motorvoertuigen die ten minste 50 km/u kunnen rijden"],"ok":0,"why":"RVV 42: autosnelweg minimaal 60 km/u mogen én kunnen; autoweg minimaal 50 km/u.","wrong":["","Er is een minimumsnelheid.","50 km/u geldt voor de autoweg."],"bron":"RVV 1990 art. 42"},{"id":"s1-t2-r18","tak":2,"niveau":"rennen","et":"ET 2.1","type":"mc","q":"'s Nachts raak je een geparkeerde auto. De eigenaar is er niet. Je wilt verder met je passagier. Wat is juist?","opts":["Doorrijden, er was niemand bij","Zorgen dat je identiteit en die van je taxi vastgesteld kunnen worden, bijvoorbeeld door de politie te bellen en te melden","Morgen langskomen, als de eigenaar thuis is"],"ok":1,"why":"WVW 7: bij schade aan een ander mag je de plaats niet verlaten, tenzij je behoorlijk de gelegenheid hebt geboden om je identiteit en die van je auto vast te stellen. Melden bij de politie is de veilige weg (vgl. art. 184).","wrong":["Dat is doorrijden na een ongeval (WVW 7).","","Weggaan zonder gelegenheid tot identificatie is in strijd met WVW 7."],"bron":"WVW 1994 art. 7 lid 2"},{"id":"s1-t3-k01","tak":3,"niveau":"kruipen","et":"ET 2.5","type":"mc","q":"Er geldt een cao. Je werkt 7 uur. Wat is de minimale pauze?","opts":["15 minuten","30 minuten","45 minuten"],"ok":0,"why":"ATW 5:4 lid 3: met cao minimaal 15 minuten pauze bij meer dan 5,5 uur arbeid.","wrong":["","30 minuten geldt zónder cao (lid 2).","45 minuten geldt zónder cao bij meer dan 10 uur."],"bron":"ATW art. 5:4 lid 3","hint":"De koekoek roept 'VIJFTIEN!'.","simpel":"Met cao, hoe lang pauze bij 7 uur werk?","kern":[ -k09","tak":3,"niveau":"kruipen","et":"ET 2.6","type":"mc","q":"Welke drie instanties controleren arbeids- en rusttijden en verkeer?","opts":["Politie, ILT en Nederlandse Arbeidsinspectie","RDW, CBR en Kiwa","Gemeente, KNV en SFM"],"ok":0,"why":"Het CBR noemt: politie, ILT en de Nederlandse Arbeidsinspectie (NLA).","wrong":["","RDW, CBR en Kiwa zijn geen controlerende instanties uit deze toetsterm.","KNV is een brancheorganisatie; SFM is een fonds."],"bron":"CBR exameneisen TVT 2.6","hint":"Blauw uniform + inspectie + arbeid.","simpel":"Wie komt controleren?","kern":["controleren"]},{"id":"s1-t3-k10","tak":3,"niveau":"kruipen","et":"ET 2.7","type":"mc","q":"Waarom zijn arbeids- en rusttijden belangrijk? Kies het beste antwoord.","opts":["Voor je gezondheid, de verkeersveiligheid en je welzijn","Alleen om boetes te voorkomen","Alleen voor het salaris"],"ok":0,"why":"Het CBR noemt de gevolgen voor gezondheid, (verkeers)veiligheid en welzijn.","wrong":["","Boetes zijn niet de kern.","Salaris staat er niet bij."],"bron":"CBR exameneisen TVT 2.7","hint":"Drie W's: wel-zijn, ge-zondheid, veilig.","simpel":"Waarom rust nemen?","kern":["belangrijk"]},{"id":"s1-t3-k11","tak":3,"niveau":"kruipen","et":"ET 2.5","type":"mc","q":"Welke situatie vraagt het TVT-examen bij arbeids- en rusttijden?","opts":["Zonder collectieve regeling (cao)","Met collectieve regeling (cao)","Allebei door elkaar"],"ok":1,"why":"Het CBR vraagt alleen de situatie MET collectieve regeling. De situatie zonder cao moet je wel kennen.","wrong":["Die moet je kennen, maar die wordt niet gevraagd.","","Alleen 'met cao' wordt gevraagd."],"bron":"CBR exameneisen TVT 2.5","hint":"Examen = met cao.","simpel":"Met of zonder cao op het examen?","kern":["examen"]},{"id":"s1-t3-k12","tak":3,"niveau":"kruipen","et":"ET 2.6","type":"mc","q":"Welk fonds noemt het CBR bij de taxisector?","opts":["Sociaal Fonds Mobiliteit (SFM)","Pensioenfonds Taxi","Fonds Verkeersveiligheid"],"ok":0,"why":"Toetsterm 2.6 noemt het Sociaal Fonds Mobiliteit (SFM).","wrong":["","Niet in de exameneisen.","Niet in de exameneisen."],"bron":"CBR exameneisen TVT 2.6","hint":"S-F-M.","simpel":"Hoe heet het fonds?","kern":["fonds"]},{"id":"s1-t3-l01","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Cao. Hoe vaak mag de dagrust van 10 uur worden ingekort tot 8 uur?","opts":["1× per 7×24 uur","2× per 14×24 uur","Zo vaak als nodig"],"ok":1,"why":"ATB-V 2.5:1 lid 6a: tweemaal in elke 14×24 uur inkorten tot ten minste 8 uur.","wrong":["Dat is de algemene ATW-regel (11 → 8), niet die voor taxi.","","Er is een grens."],"bron":"ATB-V art. 2.5:1 lid 6a"},{"id":"s1-t3-l02","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Cao. Hoeveel weekrust heb je per 14×24 uur, en hoe mag je die splitsen?","opts":["72 uur, in delen van ten minste 24 uur","36 uur, niet splitsen","72 uur, in delen van ten minste 32 uur"],"ok":0,"why":"ATB-V 2.5:1 lid 6b: 72 uur per 14×24 uur, te splitsen in perioden van ten minste 24 uur.","wrong":["","36 uur per 7×24 is de taxiregel zonder cao (lid 4b).","32 uur staat in de algemene ATW (5:5), niet in de taxiregel."],"bron":"ATB-V art. 2.5:1 lid 6b"},{"id":"s1-t3-l03","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Cao. Wat is de maximale arbeidstijd?","opts":["Gemiddeld 48 uur per week over 26 weken","Gemiddeld 48 uur per week over 16 weken","Gemiddeld 40 uur per week over 4 weken"],"ok":0,"why":"ATB-V 2.5:7 lid 6: met cao gemiddeld ten hoogste 48 uur per week in elke periode van 26 weken.","wrong":["","16 weken geldt zonder cao (lid 4c).","Dat is de regel voor jongeren (ATW 5:7 lid 1)."],"bron":"ATB-V art. 2.5:7 lid 6"},{"id":"s1-t3-l04","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Zonder cao (alleen kennen, niet examen). Wat zijn de grenzen voor arbeidstijd van een taxichauffeur?","opts":["12 uur per dienst, 60 uur per week, gemiddeld 48 per week over 16 weken","10 uur per dienst, 50 per week","9 uur per dienst, 45 per week"],"ok":0,"why":"ATB-V 2.5:7 lid 4: max 60 uur per week, 12 uur per dienst en gemiddeld 48 uur per week per 16 weken.","wrong":["","Niet de taxiregel.","Dat zijn de jongerengrenzen (ATW 5:7 lid 1)."],"bron":"ATB-V art. 2.5:7 lid 4"},{"id":"s1-t3-l05","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Zonder cao (kennen). Hoeveel pauze bij meer dan 5,5 uur en bij meer dan 10 uur werk?","opts":["15 en 30 minuten","30 minuten (2×15 mag) en 45 minuten (3×15 mag)","45 en 60 minuten"],"ok":1,"why":"ATW 5:4 lid 2: > 5,5 uur: 30 min (splitsen in 15); > 10 uur: 45 min (splitsen in 15).","wrong":["15 minuten is het cao-minimum.","","Te veel."],"bron":"ATW art. 5:4 lid 2"},{"id":"s1-t3-l06","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Wat is de grens voor nachtdiensten van een taxichauffeur?","opts":["52× per 16 weken én 140× per 52 weken, óf max 38 uur tussen 00–06 per 2 weken","52× per 52 weken","43× per 16 weken óf 20 uur per 2 weken"],"ok":0,"why":"ATB-V 2.5:4 lid 3 (taxivervoer): 52 per 16 weken en 140 per 52 weken, of 38 uur tussen 00.00–06.00 per 2 weken.","wrong":["","Dat was een Gemini-fout.","Dat is de regel voor ander vervoer dan taxi (lid 2)."],"bron":"ATB-V art. 2.5:4 lid 3"},{"id":"s1-t3-l07","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Mag de werkgever afwijken van de nachtdienstgrens voor taxi?","opts":["Ja, als hij dat zelf beslist","Alleen bij cao én als de werknemer ermee instemt","Nooit"],"ok":1,"why":"ATB-V 2.5:4 lid 4: afwijken alleen bij collectieve regeling en nadat de werknemer heeft ingestemd.","wrong":["Alleen beslissen mag niet.","","Afwijken kan wel, onder die twee voorwaarden."],"bron":"ATB-V art. 2.5:4 lid 4"},{"id":"s1-t3-l08","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Voor taxivervoer: wanneer telt het als 'zondag' voor de Arbeidstijdenwet?","opts":["Zondag 00:00 – 24:00","Zondag 06:00 – 24:00","Zaterdag 18:00 – zondag 18:00"],"ok":1,"why":"ATB-V 2.5:2: voor taxivervoer is zondag de periode van zondag 06.00 tot 24.00 uur.","wrong":["Niet voor taxi.","","Bestaat niet."],"bron":"ATB-V art. 2.5:2"},{"id":"s1-t3-l09","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Zonder cao (kennen). Wat is de wekelijkse rust van een taxichauffeur?","opts":["36 uur per 7×24 uur","72 uur per 14×24 uur","24 uur per 7×24 uur"],"ok":0,"why":"ATB-V 2.5:1 lid 4b: 36 uur onafgebroken per 7×24 uur.","wrong":["","Dat is de regel mét cao.","Te weinig."],"bron":"ATB-V art. 2.5:1 lid 4b"},{"id":"s1-t3-l10","tak":3,"niveau":"lopen","et":"ET 2.6","type":"mc","q":"Wie organiseert het werk zo dat de rusttijden gehaald worden, en voert een deugdelijke registratie?","opts":["De werkgever","Alleen de chauffeur","De ILT"],"ok":0,"why":"De wet zegt: 'De werkgever organiseert de werkzaamheden zodanig…' (ATB-V 2.5:1 lid 6) en de werkgever voert een deugdelijke registratie (ATW 4:3).","wrong":["","De chauffeur heeft ook plichten (bv. melden bij 2 werkgevers), maar organiseren is de werkgever.","De ILT controleert alleen."],"bron":"ATB-V art. 2.5:1 lid 6 · ATW art. 4:3"},{"id":"s1-t3-l11","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Wat is een 'dienst' volgens de ATW?","opts":["Een periode van werk tussen twee rusttijden van ten minste 8 uur","Elke rit","Een werkdag van 00:00 tot 24:00"],"ok":0,"why":"ATW 1:7c: een dienst ligt tussen twee opeenvolgende onafgebroken rusttijden van ten minste 8 uur.","wrong":["","Een rit is geen dienst.","Een dienst hangt niet aan de kalenderdag."],"bron":"ATW art. 1:7 onderdeel c"},{"id":"s1-t3-l12","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Zonder afwijking bij cao: hoeveel zondagen per 52 weken heb je minstens vrij?","opts":["4","13","26"],"ok":1,"why":"ATW 5:6 lid 3: ten minste 13 vrije zondagen per 52 weken. Bij cao kan worden afgeweken (lid 4).","wrong":["Te weinig.","","Te veel."],"bron":"ATW art. 5:6 lid 3"},{"id":"s1-t3-l13","tak":3,"niveau":"lopen","et":"ET 2.3","type":"mc","q":"Aan wie wordt een taxivergunning verleend?","opts":["Aan iedereen met een rijbewijs B","Aan een vervoerder die voldoet aan eisen van betrouwbaarheid en vakbekwaamheid","Alleen aan bedrijven met meer dan 10 taxi's"],"ok":1,"why":"Wp2000 76 lid 4: alleen aan een vervoerder die voldoet aan eisen van betrouwbaarheid en vakbekwaamheid.","wrong":["Een rijbewijs is niet genoeg.","","Geen grens op aantal taxi's."],"bron":"Wp2000 art. 76 lid 4"},{"id":"s1-t3-r01","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Cao. In de laatste 14 dagen had Krijger op maandag en woensdag al maar 8 uur rust. Vrijdag stopt hij om 23:30, zaterdag begint hij om 07:30. Mag dat?","opts":["Ja, 8 uur is genoeg","Nee, dat zou de derde inkorting tot 8 uur in 14×24 uur zijn","Ja, want het is weekend"],"ok":1,"why":"ATB-V 2.5:1 lid 6a: inkorten tot 8 uur mag maar 2× per 14×24 uur. Dit is de 3e keer.","wrong":["Alleen 2× per 14×24 uur.","","Weekend maakt niet uit."],"bron":"ATB-V art. 2.5:1 lid 6a"},{"id":"s1-t3-r02","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Cao. Dienst van 06:00 tot 11:45 (5 uur 45 minuten werk). Wat is de wettelijke minimale pauze?","opts":["Geen pauze nodig, dat is pas vanaf 6 uur","15 minuten","30 minuten"],"ok":1,"why":"ATW 5:4 lid 3: bij meer dan 5,5 uur arbeid minstens 15 minuten (met cao). 5u45 is meer dan 5,5 uur.","wrong":["De 6-uursregel komt uit ATB-V 2.5:6 lid 3 en geldt voor vervoer onder EU-verordening 561/2006, niet voor taxi.","","30 minuten geldt zonder cao."],"bron":"ATW art. 5:4 lid 3 · ATB-V 2.5:6"},{"id":"s1-t3-r03","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Cao. Dienst van 07:00 tot 12:30, precies 5,5 uur werk. Wat zegt de wet over pauze?","opts":["Minimaal 15 minuten","Geen wettelijke minimumpauze: de grens is MEER dan 5,5 uur","Minimaal 30 minuten"],"ok":1,"why":"ATW 5:4 lid 3 zegt 'meer dan 5,5 uren'. Precies 5,5 uur valt er niet onder.","wrong":["Dat geldt pas bij méér dan 5,5 uur.","","Dat is zonder cao, en ook pas boven 5,5 uur."],"bron":"ATW art. 5:4 lid 3"},{"id":"s1-t3-r04","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Cao. Krijger werkt 8 uur en neemt twee keer 10 minuten rust. Voldoet hij aan de pauzeregel?","opts":["Ja, samen is het 20 minuten","Nee, een pauze is minstens 15 minuten aan één stuk","Ja, als hij in de auto blijft"],"ok":1,"why":"Een pauze is ten minste 15 achtereenvolgende minuten (ATW 1:7e). 2×10 telt niet als pauze.","wrong":["Optellen van stukjes onder 15 minuten mag niet.","","De plek maakt het niet beter; het blijft 10 minuten."],"bron":"ATW art. 1:7e en 5:4 lid 3"},{"id":"s1-t3-r05","tak":3,"niveau":"rennen","et":"ET 2.5","type":"multi","q":"Welke diensten zijn een NACHTDIENST? Kies ALLE juiste.","opts":["22:00 – 01:30","22:00 – 01:00","04:30 – 12:00","05:15 – 13:00"],"ok":[0,2],"why":"Nachtdienst = MEER dan 1 uur arbeid tussen 00:00 en 06:00. 22–01:30 = 1,5 u ✔. 22–01:00 = precies 1 u ✘. 04:30–12 = 1,5 u ✔. 05:15–13 = 45 min ✘.","wrong":["","Precies 1 uur is niet 'meer dan een uur'.","","Maar 45 minuten tussen 00 en 06."],"bron":"ATW art. 1:7 onderdeel d"},{"id":"s1-t3-r06","tak":3,"niveau":"rennen","et":"ET 2.5","type":"multi","q":"Cao. Welke verdeling van de 72 uur rust in 14×24 uur is toegestaan? Kies ALLE juiste.","opts":["24 + 48 uur","36 + 36 uur","20 + 52 uur","72 uur aan één stuk"],"ok":[0,1,3],"why":"Splitsen mag in perioden van ten minste 24 uur. 20 uur is te kort.","wrong":["","","Een deel van 20 uur is korter dan 24 uur.",""],"bron":"ATB-V art. 2.5:1 lid 6b"},{"id":"s1-t3-r07","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Dienst van zaterdag 22:00 tot zondag 05:30. Telt dit voor de taxi als werken op zondag?","opts":["Ja, alles na zaterdag 24:00 is zondag","Nee, voor taxi begint de zondag om 06:00","Ja, maar alleen het deel na 03:00"],"ok":1,"why":"ATB-V 2.5:2: voor taxivervoer loopt de zondag van 06.00 tot 24.00 uur. Deze dienst stopt om 05:30.","wrong":["Voor taxi geldt een aparte zondagdefinitie.","","Bestaat niet."],"bron":"ATB-V art. 2.5:2"},{"id":"s1-t3-r08","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"De cao wijkt af van de 13 vrije zondagen. Krijger zou op 42 zondagen per 52 weken werken. Wat is nodig?","opts":["Niets, de cao regelt het","Zijn instemming (bij 40 of meer zondagen)","Een ontheffing van de ILT"],"ok":1,"why":"ATW 5:6 lid 4: werken op 40 of meer zondagen per 52 weken alleen als de werknemer daarmee instemt.","wrong":["Bij 40+ zondagen is instemming nodig.","","Geen ILT-ontheffing in deze regel."],"bron":"ATW art. 5:6 lid 4"},{"id":"s1-t3-r09","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Volledige cao. In 26 weken werkt Krijger 13 weken 60 uur en 13 weken 36 uur. Mag dat volgens het ATB-V?","opts":["Ja: gemiddeld precies 48 uur per week over 26 weken","Nee: 60 uur in een week is meer dan 48","Nee: het gemiddelde moet over 16 weken"],"ok":0,"why":"Met cao geldt ATB-V 2.5:7 lid 6: gemiddeld max 48 u/week per 26 weken. (13×60 + 13×36) / 26 = 48.","wrong":["Het gaat om het gemiddelde, niet één week.","","16 weken is de regel zonder cao (lid 4c)."],"bron":"ATB-V art. 2.5:7 lid 4 en 6"},{"id":"s1-t3-r10","tak":3,"niveau":"rennen","et":"ET 2.5","type":"num","q":"Alternatief voor de nachtdienst-telling: hoeveel uur werk tussen 00:00 en 06:00 mag een taxichauffeur maximaal hebben per 2 weken? Typ het getal.","ok":38,"why":"ATB-V 2.5:4 lid 3b: ten hoogste 38 uur per 2 weken tussen 00.00 en 06.00 uur.","bron":"ATB-V art. 2.5:4 lid 3b","unit":"uur"},{"id":"s1-t3-r11","tak":3,"niveau":"rennen","et":"ET 2.5","type":"num","q":"Hoeveel nachtdiensten mag een taxichauffeur maximaal draaien in elke 52 weken? Typ het getal.","ok":140,"why":"ATB-V 2.5:4 lid 3a: 52 per 16 weken én 140 per 52 weken.","bron":"ATB-V art. 2.5:4 lid 3a","unit":"nachtdiensten"},{"id":"s1-t3-r12","tak":3,"niveau":"rennen","et":"ET 2.7","type":"multi","q":"Krijger werkt bij A (ma–vr) en B (za). Welke uitspraken kloppen? Kies ALLE juiste.","opts":["Krijger geeft uit eigen beweging tijdig zijn uren door aan A én B","Iedere werkgever organiseert het werk zo dat er geen strijd met de wet "id":"s1-t4-k04","tak":4,"niveau":"kruipen","et":"ET 11.3","type":"mc","q":"Je navigatie valt uit tijdens een rit. Wat is je doel?","opts":["De rit stoppen","De passagier zo goed mogelijk bedienen: borden volgen, kaart, centrale of passagier vragen","Willekeurig rijden tot het weer werkt"],"ok":1,"why":"CBR 11.3: als de navigatie uitvalt, maak je een keuze om de passagier zo goed mogelijk te bedienen.","wrong":["Stoppen helpt de passagier niet.","","Dat bedient de passagier niet."],"bron":"CBR exameneisen TVT 11.3","hint":"Borden praten: 'Volg mij!'","simpel":"Navigatie kapot: wat nu?","kern":["navigatie valt uit"]},{"id":"s1-t4-k05","tak":4,"niveau":"kruipen","et":"ET 11.2","type":"mc","q":"Wie regelt sinds 2013 de bewegwijzering in Nederland?","opts":["De ANWB","De Nationale Bewegwijzeringsdienst (NBd)","Het CBR"],"ok":1,"why":"Op 1 april 2013 nam de NBd de rol van de ANWB over (CBR, wijzigingen 11.2).","wrong":["Dat was vóór 2013.","","Het CBR doet examens."],"bron":"CBR exameneisen TVT 11.2","hint":"N-B-d.","simpel":"Wie maakt de wegwijzers?","kern":["bewegwijzering"]},{"id":"s1-t4-k06","tak":4,"niveau":"kruipen","et":"ET 4.2","type":"mc","q":"Zaterdagnacht 03:00, centrum. De cafés gaan dicht, er lopen veel mensen op straat. Wat doe je?","opts":["Hard het centrum uit rijden","Langzamer rijden: mensen onder invloed kunnen onverwacht bewegen","Op een veilige plek wachten tot het rustig is, omdat je moe bent"],"ok":1,"why":"CBR-voorbeeldvraag: rij langzamer, want mensen onder invloed maken onverwachte bewegingen.","wrong":["Hard rijden vergroot het gevaar.","","Wachten lost het verkeersrisico niet op; je hebt een klant."],"bron":"CBR voorbeeldvraag TVT (geparafraseerd)","hint":"Onder invloed = onvoorspelbaar.","simpel":"Veel dronken mensen op straat: hoe rij je?","kern":["03:00","cafés"]},{"id":"s1-t4-k07","tak":4,"niveau":"kruipen","et":"ET 4.1","type":"mc","q":"Midden in je dienst word je erg slaperig. Wat doe je?","opts":["Raam open en doorrijden","Op een veilig  ouderen, kinderen, fietsers, snorfietsers en bromfietsers.","wrong":["Staan er wel in.","Staan er wel in.",""],"bron":"CBR exameneisen TVT 4.2"},{"id":"s1-t4-l12","tak":4,"niveau":"lopen","et":"ET 3.2","type":"mc","q":"Rijklaarcontrole: een gordel achterin is kapot. Wat doe je?","opts":["Niets, passagiers kunnen ook zonder gordel","Melden en laten herstellen; die plaats niet gebruiken, want je vervoert niet meer passagiers dan er gordels zijn","Een passagier op die plek laten zitten als hij het goed vindt"],"ok":1,"why":"CBR 3.2: voertuigcontrole gaat over veiligheid, verantwoordelijkheid en aansprakelijkheid. RVV 59 lid 1: niet meer passagiers dan er gordels zijn.","wrong":["Passagiers moeten de gordel gebruiken.","","Toestemming van de passagier verandert de regel niet."],"bron":"CBR ET 3.2 · RVV 1990 art. 59 lid 1"},{"id":"s1-t4-l13","tak":4,"niveau":"lopen","et":"ET 4.4","type":"mc","q":"Waarom is comfortabel rijden belangrijk?","opts":["Voor het comfort van de passagier, de veiligheid en het beeld van de taxibranche","Alleen om fooi te krijgen","Omdat de taxameter dan langzamer loopt"],"ok":0,"why":"CBR 4.4: relatie tussen comfortabel en veilig rijden, comfort van passagiers en beeldvorming van de branche.","wrong":["","Fooi is niet de reden.","Klopt niet."],"bron":"CBR exameneisen TVT 4.4"},{"id":"s1-t4-l14","tak":4,"niveau":"lopen","et":"ET 11.3","type":"mc","q":"Het adres van de klant staat niet in je navigatie. Wat doe je?","opts":["De klant laten uitstappen","Zelf een oplossing zoeken: klant om een herkenningspunt vragen, kaart, centrale bellen","Naar een willekeurig adres in de buurt rijden"],"ok":1,"why":"CBR 11.3: hoe te handelen als een adres niet in de navigatie staat; je bedient de passagier zo goed mogelijk.","wrong":["Dat bedient de klant niet.","","Willekeurig rijden is geen goede dienst."],"bron":"CBR exameneisen TVT 11.3"},{"id":"s1-t4-l15","tak":4,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Je rijdt op een autoweg (bord met een auto). Wat 28: Utrecht – Amersfoort – Zwolle – Assen – Groningen. Arnhem ligt aan A12/A50, Leeuwarden aan A32 (en vlakbij de A31).","wrong":["","","","","Ligt niet aan de A28.","Ligt niet aan de A28."],"bron":"CBR ET 11.2 · topografie NL"},{"id":"s1-t4-r04","tak":4,"niveau":"rennen","et":"ET 11.2","type":"mc","q":"Welke A-weg gaat over de Afsluitdijk?","opts":["A6","A7","A31"],"ok":1,"why":"De A7 (Zaandam – Afsluitdijk – Groningen).","wrong":["A6: Almere – Lelystad – Emmeloord – Joure.","","De A31 loopt in Friesland, niet over de dijk."],"bron":"CBR ET 11.2 · topografie NL"},{"id":"s1-t4-r05","tak":4,"niveau":"rennen","et":"ET 11.2","type":"mc","q":"Je rijdt van Eindhoven via Tilburg en Breda naar Middelburg. Welke A-weg?","opts":["A58","A16","A67"],"ok":0,"why":"De A58 (Eindhoven – Tilburg – Breda – Bergen op Zoom – Middelburg – Vlissingen).","wrong":["","A16 loopt Rotterdam – Breda – België.","A67 loopt van België via Eindhoven naar Venlo."],"bron":"CBR ET 11.2 · topografie NL"},{"id":"s1-t4-r06","tak":4,"niveau":"rennen","et":"ET 11.2","type":"mc","q":"Je rijdt op een N-weg (geel nummer) met het autowegbord (G3). Hoe hard mag je zonder snelheidsbord?","opts":["80, want het is een N-weg","100, want het bord maakt het een autoweg","130"],"ok":1,"why":"Het nummer zegt niets over de regels. Een autoweg is een weg met bord G3 (RVV 1); daar geldt 100 km/u (RVV 21).","wrong":["De letter N bepaalt de snelheid niet.","","130 alleen op een autosnelweg (G1)."],"bron":"RVV 1990 art. 1 en 21 · CROW ASVV"},{"id":"s1-t4-r07","tak":4,"niveau":"rennen","et":"ET 7.2","type":"mc","q":"Je navigatie kiest de snelste route (4 km langer). De passagier vraagt nadrukkelijk de kortste route. Wat doe je?","opts":["Snelste route, de chauffeur beslist","De gevraagde route rijden: de vervoerder rijdt de gunstigste weg, tenzij de reiziger of centrale nadrukkelijk een andere route vraagt","Discussie: uitleggen dat de snelste beter is en zo rijden"],"ok":1,"why":"KNV art. 7 lid 2: gunstigste weg (snelste o armeren","Noodzakelijke hulp verlenen"],"ok":[0,1,2,3,4],"why":"P-A-M-A-N.","bron":"CBR exameneisen TVT 5.1 (PAMAN)"},{"id":"s1-t5-l02","tak":5,"niveau":"lopen","et":"ET 5.2","type":"multi","q":"Wat hoort in een goede melding aan de hulpdiensten? Kies ALLE juiste.","opts":["Tijdstip","Omvang van de schade","Eventuele gewonden en hoeveel","De plaats","Je mening over wie schuld heeft"],"ok":[0,1,2,3],"why":"CBR 5.2: welke hulpdienst, tijdstip, omvang schade, gewonden + aantal, juiste nummers en de plaats.","wrong":["","","","","Schuld is niet nodig voor de melding."],"bron":"CBR exameneisen TVT 5.2"},{"id":"s1-t5-l03","tak":5,"niveau":"lopen","et":"ET 5.2","type":"mc","q":"Iemand heeft je taxi beschadigd en is weg. Er is geen spoed. Welk nummer bel je?","opts":["112","0900-8844","Het nummer van de ILT"],"ok":1,"why":"0900-8844 is de politie zonder spoed. 112 alleen bij spoed.","wrong":["Geen spoed: niet 112.","","De ILT is geen hulpdienst."],"bron":"politie.nl · CBR ET 5.2"},{"id":"s1-t5-l04","tak":5,"niveau":"lopen","et":"ET 5.2","type":"mc","q":"Wat staat er altijd op een hectometerbord?","opts":["Wegaanduiding (A of N + nummer) en de hectometrering","Alleen een kilometergetal","De naam van de dichtstbijzijnde stad"],"ok":0,"why":"CROW: altijd wegaanduiding + hectometrering; soms Li/Re (rijbaan) en een letter.","wrong":["","Er staat ook het wegnummer op.","Staat er niet op."],"bron":"CROW Richtlijn bebakening en markering 2024 (hectometerborden)"},{"id":"s1-t5-l05","tak":5,"niveau":"lopen","et":"ET 5.3","type":"mc","q":"De verkeersinfo meldt een stremming verderop op je route. Wat doe je?","opts":["Gewoon doorrijden","Een andere route kiezen en de passagier informeren","De rit annuleren"],"ok":1,"why":"CBR 5.3: alternatieve route kiezen; bij vertraging passagier (en eventueel centrale) informeren.","wrong":["Dan sta je straks vast.","","Niet nodig."],"bron":"CBR exameneisen TVT 5.3"},{"id":"s1-t5-l06","tak":5,"niveau":"lopen","et":"ET 5.3","type":"mc","q":"Kleine aanrijding op de snelweg, niemand gewond, beide auto's rijden nog. Hoe voorkom je een stremming?","opts":["Auto's laten staan tot de politie komt","De auto's zo snel mogelijk naar de vluchtstrook of een veilige plek zetten","Op de rijbaan het schadeformulier invullen"],"ok":1,"why":"CBR 5.3: bij een ongeval stremmingen voorkomen. Kan de auto nog rijden en is niemand gewond? Dan naar de vluchtstrook of veilige plek.","wrong":["Dan ontstaat juist een stremming.","","Gevaarlijk en het veroorzaakt een stremming."],"bron":"CBR exameneisen TVT 5.3 · Rijkswaterstaat (Incident Management)"},{"id":"s1-t5-l07","tak":5,"niveau":"lopen","et":"ET 5.1","type":"mc","q":"Na een aanrijding met alleen blikschade, wat doe je met de andere bestuurder?","opts":["Alleen telefoonnummers uitwisselen","Samen het Europees schadeformulier invullen en je gegevens laten vaststellen","Niets, de verzekering regelt het"],"ok":1,"why":"Het Europees schadeformulier legt de schade vast (CBR 1.1). Je mag niet weg zonder je identiteit te laten vaststellen (WVW 7).","wrong":["Te weinig.","","Je moet wel gegevens vastleggen."],"bron":"CBR ET 1.1 en 5.1 · WVW 1994 art. 7"},{"id":"s1-t5-l08","tak":5,"niveau":"lopen","et":"ET 6.1","type":"mc","q":"Na een ongeval kan je taxi niet verder. Je passagier moet naar het ziekenhuis voor een afspraak. Wat doe je?","opts":["De passagier zelf een bus laten zoeken","De centrale informeren zodat zij vervangend vervoer kan plannen","Wachten tot je auto gemaakt is"],"ok":1,"why":"CBR 6.1: het bedrijf goed informeren voor planning en vervangend vervoer.","wrong":["Slechte service.","","Duurt te lang."],"bron":"CBR exameneisen TVT 6.1 en 5.3"},{"id":"s1-t5-l09","tak":5,"niveau":"lopen","et":"ET 5.1","type":"mc","q":"Pech op de snelweg met twee passagiers. Wat is juist voor 'Andermans veiligheid'?","opts":["Passagiers in de auto laten zitten met de gordel om","Passagiers aan de veilige kant laten uitstappen en achter de vangrail laten wachten","Passagiers laten helpen duwen"],"ok":1,"why":"Na je eigen veiligheid (P) zorg je voor de veiligheid van anderen (A): veilig uitstappen en achter de vangrail.","wrong":["In de auto blijven op de snelweg is gevaarlijk bij een aanrijding.","","Gevaarlijk."],"bron":"CBR exameneisen TVT 5.1 (PAMAN)"},{"id":"s1-t5-r01","tak":5,"niveau":"rennen","et":"ET 5.2","type":"mc","q":"Do 22 okt 2026, 17:40. Aanrijding op de A12, rechter rijbaan richting Utrecht, bij hectometerpaal 45,3. Eén persoon is gewond. Welke melding is het BEST?","opts":["112: 'Ongeluk op de snelweg bij Utrecht, kom snel.'","112: 'A12, hectometerpaal 45,3 Re, rijrichting Utrecht, 17:40, één gewonde, twee auto's beschadigd.'","0900-8844: 'A12 richting Utrecht, één gewonde.'"],"ok":1,"why":"CBR 5.2: juist nummer (112 bij gewonden), wegnummer, hectometerpaal, rijrichting, tijdstip, gewonden + aantal, omvang schade.","wrong":["Te vaag: geen hectometerpaal, geen gewonden.","","Verkeerd nummer: bij gewonden bel je 112."],"bron":"CBR exameneisen TVT 5.2"},{"id":"s1-t5-r02","tak":5,"niveau":"rennen","et":"ET 5.2","type":"multi","q":"Welke gegevens horen bij de PLAATS van een melding BUITEN de bebouwde kom? Kies ALLE juiste.","opts":["Wegnummer","Hectometerpaal","Rijrichting","Straatnaam en huisnummer","De kleur van de andere auto"],"ok":[0,1,2],"why":"CBR 5.2: buiten de kom wegnummer, hectometerpaal en rijrichting.","wrong":["","","","Dat is binnen de kom.","Geen plaatsgegeven."],"bron":"CBR exameneisen TVT 5.2"},{"id":"s1-t5-r03","tak":5,"niveau":"rennen","et":"ET 5.3","type":"mc","q":"Stremming op de N-weg. Je navigatie stuurt je om via een woonwijk langs een basisschool, om 08:20. Een iets langere route gaat via een hoofdweg. Wat is het beste?","opts":["De woonwijk: korter is altijd beter","De hoofdweg: minder risico met kwetsbare verkeersdeelnemers (kinderen); passagier informeren over de extra tijd","Wachten in de file tot het oplost"],"ok":1,"why":"CBR 5.3: alternatieve route kiezen. CBR 4.2: kinderen en fietsers zijn kwetsbaar. Informeer de passagier.","wrong":["Korter is niet altijd veiliger.","","Je laat de passagier onnodig wachten."],"bron":"CBR exameneisen TVT 5.3 en 4.2"},{"id":"s1-t5-r04","tak":5,"niveau":"rennen","et":"ET 5.1","type":"mc","q":"Welke volgorde is FOUT? Kies het antwoord dat NIET klopt met PAMAN.","opts":["Hesje aan → passagier achter de vangrail → markeren → 112 → hulp","Hesje aan → 112 → passagier achter de vangrail → markeren → hulp","Eigen veiligheid → andermans veiligheid → markeren → alarmeren → hulp"],"ok":1,"why":"In PAMAN komt Alarmeren pas na Andermans veiligheid en Markeren.","wrong":["Dit is de goede volgorde.","","Dit is de goede volgorde."],"bron":"CBR exameneisen TVT 5.1 (PAMAN)"},{"id":"s1-t5-r05","tak":5,"niveau":"rennen","et":"ET 2.1","type":"mc","q":"Je bent betrokken bij een ongeval. Een fietser ligt gewond op de grond. Wat verbiedt WVW art. 7 in elk geval?","opts":["Je auto verplaatsen","De gewonde in hulpeloze toestand achterlaten","De centrale bellen"],"ok":1,"why":"WVW 7 lid 1c: verboden de plaats te verlaten als daardoor een gewonde in hulpeloze toestand achterblijft.","wrong":["Verplaatsen kan nodig zijn om stremming of gevaar te voorkomen.","","Mag gewoon."],"bron":"WVW 1994 art. 7 lid 1c"},{"id":"s1-t5-r06","tak":5,"niveau":"rennen","et":"ET 5.3","type":"multi","q":"Welke handelingen noemt het CBR bij verstoringen en stremmingen? Kies ALLE juiste.","opts":["Zo vroeg mogelijk signaleren met verkeersinformatie","Bij een ongeval stremmingen voorkomen","Alternatieve route kiezen","Bij vertraging de passagier informeren","De taxameter stilzetten zodat de rit goedkoper wordt"],"ok":[0,1,2,3],"why":"CBR 5.3 noemt deze vier (en eventueel de centrale informeren).","wrong":["","","","","Staat niet in de exameneisen."],"bron":"CBR exameneisen TVT 5.3"},{"id":"s1-t5-r07","tak":5,"niveau":"rennen","et":"ET 2.1","type":"mc","q":"Krijger reed na een aanrijding met schade in paniek door. Om 23:00 gebeurde het. Tot welk tijdstip kan hij zich vrijwillig melden zodat vervolging voor doorrijden is uitgesloten?","opts":["Volgende dag 11:00 (binnen 12 uur, vóór aanhouding/verhoor)","Volgende dag 23:00 (24 uur)","Binnen 48 uur"],"ok":0,"why":"WVW 184: binnen twaalf uur na het ongeval, vóór aanhouding of verhoor, met identiteit van persoon en auto.","wrong":["","Te laat.","Te laat; 48 uur is de termijn uit WVW 165."],"bron":"WVW 1994 art. 184"},{"id":"s1-t5-r08","tak":5,"niveau":"rennen","et":"ET 5.1","type":"mc","q":"Na een aanrijding op de autosnelweg wil je passagier uitstappen en op de rijbaan foto's maken. Wat doe je?","opts":["Laten doen, het is zijn schade","Niet toestaan: de rijbaan is gevaarlijk; iedereen achter de vangrail (P en A van PAMAN)","Alleen als je de alarmlichten aan hebt"],"ok":1,"why":"PAMAN: persoonlijke en andermans veiligheid eerst. Op de rijbaan van een autosnelweg ben je in groot gevaar.","wrong":["Veiligheid gaat voor.","","Alarmlichten maken de rijbaan niet veilig."],"bron":"RVV 1990 art. 43 lid 2–3 · CBR ET 5.1"},{"id":"s1-t6-k01","tak":6,"niveau":"kruipen","et":"ET 7.1","type":"mc","q":"Hoe spreek je een passagier aan?","opts":["Met 'je' en 'jij'","Met 'U', 'meneer' of 'mevrouw'","Met 'maat' of 'chef'"],"ok":1,"why":"CBR 7.1: net en beleefd; de passagier aanspreken met U, meneer, mevrouw.","wrong":["Te informeel.","","Onbeleefd."],"bron":"CBR exameneisen TVT 7.1","hint":"Goedemorgen meneer.","simpel":"Hoe zeg je het netjes?","kern":["aanspreken"]},{"id":"s1-t6-k02","tak":6,"niveau":"kruipen","et":"ET 6.1","type":"mc","q":"Welk niveau Nederlands moet je als taxichauffeur goed beheersen?","opts":["A1","B1","C2"],"ok":1,"why":"CBR 6.1 en 7.1: Nederlands op B1-niveau.","wrong":["Te laag.","","Niet vereist."],"bron":"CBR exameneisen TVT 6.1","hint":"B van Begrijpelijk.","simpel":"Welk taalniveau?","kern":["Nederlands"]},{"id":"s1-t6-k03","tak":6,"niveau":"kruipen","et":"ET 6.2","type":"mc","q":"Hoe bel je tijdens de rit met de centrale?","opts":["Handsfree, kort en zakelijk, en let op dat de passagier meeluistert","Met de telefoon aan je oor, dat is sneller","Uitgebreid, ook over privézaken"],"ok":0,"why":"CBR 6.2: zakelijk, net, kort en helder, rekening houden met meeluisteren, handsfree.","wrong":["Vasthouden is verboden (RVV 61a).","","Alleen zakelijk."],"bron":"CBR exameneisen TVT 6.2","hint":"Vlinder aan de ruit.","simpel":"Bellen in de taxi: hoe?","kern":["handsfree"]},{"id":"s1-t6-k04","tak":6,"niveau":"kruipen","et":"ET 6.1","type":"mc","q":"Waarover informeer je de passagier vooraf in elk geval?","opts":["Kosten en tijd","Je privéleven","Het weer"],"ok":0,"why":"CBR 6.1: passagiers juist informeren over kosten en tijd e.d.","wrong":["","Niet relevant.","Niet de kern."],"bron":"CBR exameneisen TVT 6.1","hint":"Prijs en duur.","simpel":"Wat vertel je vooraf?","kern":["vooraf"]},{"id":"s1-t6-k05","tak":6,"niveau":"kruipen","et":"ET 6.1","type":"mc","q":"Een passagier begint een discussie over politiek en wordt boos. Wat doe je?","opts":["Je mening hard verdedigen","Geen discussie aangaan; vriendelijk en neutraal blijven","Hem laten uitstappen"],"ok":1,"why":"CBR 6.1: geen discussie met de passagier.","wrong":["Dat is discussie.","","Te snel; eerst de-escaleren."],"bron":"CBR exameneisen TVT 6.1","hint":"Geen discussie.","simpel":"Passagier wil ruzie over politiek?","kern":["discussie"]},{"id":"s1-t6-k06","tak":6,"niveau":"kruipen","et":"ET 7.1","type":"mc","q":"Wanneer moet je taxi aan de buitenkant schoon zijn?","opts":["Bij aanvang van de dienst","Eén keer per week","Alleen als het geregend heeft"],"ok":0,"why":"CBR 7.1: auto schoon binnenzijde, en buitenzijde bij aanvang dienst.","wrong":["","Te weinig.","Niet de regel."],"bron":"CBR exameneisen TVT 7.1","hint":"Begin van de dienst.","simpel":"Wanneer moet de auto buiten schoon zijn?","kern":["buitenkant"]},{"id":"s1-t6-k07","tak":6,"niveau":"kruipen","et":"ET 7.3","type":"mc","q":"Wat controleer je bij het instappen?","opts":["De juiste kant (veilig, stoepzijde) en het juiste adres","Alleen of de passagier kan betalen","Of de passagier dezelfde taal spreekt"],"ok":0,"why":"CBR 7.3: instapprocedure: juiste kant, juiste adres.","wrong":["Niet de instapprocedure.","","Geen voorwaarde."],"bron":"CBR exameneisen TVT 7.3","hint":"Stoepkant + adres.","simpel":"Waar let je op bij instappen?","kern":["instappen"]},{"id":"s1-t6-k08","tak":6,"niveau":"kruipen","et":"ET 7.1","type":"mc","q":"Mag je als chauffeur roken of vapen in de taxi tijdens je dienst?","opts":["Ja, als het raam open is","Nee, dat past niet bij de beroepshouding; passagiers mogen ook geen rookwaar gebruiken","Ja, als er geen passagier is maar wel in de dienst"],"ok":1,"why":"CBR 7.1 noemt gedrag bij roken, e-sigaret en vapen bij de beroepshouding. KNV 5.2d: de reiziger onthoudt zich van rookwaar.","wrong":["Een open raam maakt het niet professioneel.","","De geur blijft hangen voor de volgende passagier."],"bron":"CBR ET 7.1 · KNV art. 5 lid 2d","hint":"Schone auto, schone lucht.","simpel":"Roken in de taxi?","kern":["roken","vapen"]},{"id":"s1-t6-k09","tak":6,"niveau":"kruipen","et":"ET 7.3","type":"mc","q":"Een blinde passagier heeft een geleidehond. Wat doe je?","opts":["Weigeren, honden mogen niet mee","De hond altijd meenemen","Alleen meenemen als hij in de kofferbak gaat"],"ok":1,"why":"KNV art. 9 lid 3: hulphonden, zoals blindengeleidehonden, worden onder alle omstandigheden meegenomen.","wrong":["Hulphonden mogen altijd mee.","","Een hulphond blijft bij zijn baas."],"bron":"KNV Algemene Voorwaarden art. 9 lid 3","hint":"Hulphond = altijd mee.","simpel":"Mag de blindengeleidehond mee?","kern":["geleidehond"]},{"id":"s1-t6-k10","tak":6,"niveau":"kruipen","et":"ET 7.4","type":"mc","q":"Waarom is een tevreden passagier bij contractvervoer extra belangrijk?","opts":["Voor de voortzetting van het contract","Omdat hij dan meer fooi geeft","Het maakt niet uit"],"ok":0,"why":"CBR 7.4: bij contractvervoer: voortzetting van het contract.","wrong":["","Niet de reden uit de exameneisen.","Het maakt wel uit."],"bron":"CBR exameneisen TVT 7.4","hint":"Contract = blijven rijden.","simpel":"Waarom moet de klant tevreden zijn?","kern":["contractvervoer"]},{"id":"s1-t6-l01","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Een passagier met hulphond stapt in, maar jij bent allergisch voor honden. Wat moet je doen?","opts":["Weigeren en wegrijden","Binnen 15 minuten zorgen voor vervangend vervoer","De passagier zelf een andere taxi laten bellen"],"ok":1,"why":"KNV 9.3: is de bestuurder allergisch, dan zorgt hij binnen 15 minuten voor vervangend vervoer.","wrong":["Weigeren zonder oplossing mag niet.","","Jij regelt het."],"bron":"KNV Algemene Voorwaarden art. 9 lid 3"},{"id":"s1-t6-l02","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"De rit met taxameter is klaar. Wat doe je met de meterstand?","opts":["Meteen op nul zetten","Zo lang laten staan dat de reiziger de stand kan zien","Alleen op verzoek laten zien"],"ok":1,"why":"KNV 7.4: de stand blijft zo lang staan dat de reiziger zich op de hoogte kan stellen.","wrong":["Te snel.","","Hij moet zichtbaar blijven."],"bron":"KNV Algemene Voorwaarden art. 7 lid 4"},{"id":"s1-t6-l03","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Een oudere passagier heeft een zware koffer. Wat is je plicht?","opts":["Niets, bagage is zijn zaak","Behulpzaam zijn bij in- en uitstappen en bij in- en uitladen van de bagage","Alleen helpen tegen extra betaling"],"ok":1,"why":"KNV 7.3: de vervoerder helpt bij in- en uitstappen en in- en uitladen van handbagage, tenzij dat (verkeers)technisch onmogelijk is.","wrong":["Helpen hoort erbij.","","Niet volgens de voorwaarden."],"bron":"KNV Algemene Voorwaarden art. 7 lid 3"},{"id":"s1-t6-l04","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Een passagier wil een blikje bier drinken in je taxi. Mag dat?","opts":["Ja, altijd","Alleen met uitdrukkelijke toestemming van de vervoerder","Nee, nooit, het is wettelijk verboden"],"ok":1,"why":"KNV 5.2b: geen alcohol in de auto, tenzij met uitdrukkelijke toestemming van de vervoerder.","wrong":["Niet zonder toestemming.","","Het staat in de algemene voorwaarden, met een toestemmingsuitzondering."],"bron":"KNV Algemene Voorwaarden art. 5 lid 2b"},{"id":"s1-t6-l05","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Een passagier wil zijn gordel niet om. Wat zeggen de KNV-voorwaarden?","opts":["De reiziger doet de gordel om vóór de rit; een boete daarvoor kan op hem verhaald worden","De chauffeur betaalt altijd de boete","Gordel is vrijwillig in een taxi"],"ok":0,"why":"KNV 5.1b: de reiziger doet de gordel om voorafgaand aan de rit; een boete kan op hem verhaald worden.","wrong":["","Niet volgens art. 5.","Passagiers gebruiken de gordel (RVV 59 lid 1)."],"bron":"KNV Algemene Voorwaarden art. 5 lid 1b"},{"id":"s1-t6-l06","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Halverwege wil de passagier naar een ander adres. Mag dat?","opts":["Nee, de bestemming staat vast","Ja, de reiziger mag tussentijds de eindbestemming wijzigen","Alleen als hij eerst de rit tot nu toe afrekent"],"ok":1,"why":"KNV 5.5: de reiziger mag tussentijds de eindbestemming wijzigen.","wrong":["Het mag wel.","","Geen eis uit de voorwaarden."],"bron":"KNV Algemene Voorwaarden art. 5 lid 5"},{"id":"s1-t6-l07","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Welke handbagage mag de vervoerder weigeren? Kies het beste antwoord.","opts":["Een rolkoffer","Vuurwapens, explosieven, munitie, verdovende middelen, sterk ruikende of licht ontvlambare stoffen","Een boodschappentas"],"ok":1,"why":"KNV 8.2 noemt o.a. vuur-, slag- en steekwapens, ontplofbare stoffen, gassen, licht ontvlambare of sterk ruikende stoffen, verdovende middelen, munitie.","wrong":["Gewone bagage.","","Gewone bagage."],"bron":"KNV Algemene Voorwaarden art. 8 lid 2"},{"id":"s1-t6-l08","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Je vindt na de rit een telefoon op de achterbank. Wat doe je?","opts":["Houden als niemand belt","Afgeven bij de vervoerder (het taxibedrijf), die het bewaart voor de eigenaar","In de brievenbus van het politiebureau gooien zonder melding"],"ok":1,"why":"KNV art. 10: de vervoerder mag gevonden voorwerpen in bewaring nemen en geeft ze aan de rechthebbende terug.","wrong":["Dat is verduistering.","","Zonder melding kan de eigenaar het niet terugvinden."],"bron":"KNV Algemene Voorwaarden art. 10"},{"id":"s1-t6-l09","tak":6,"niveau":"lopen","et":"ET 7.3","type":"mc","q":"Je rijdt een leerling van het speciaal onderwijs die snel onrustig wordt. Wat helpt het meest?","opts":["Harde muziek aan","Rustig, duidelijk en voorspelbaar handelen, en je houden aan de afspraken met de opdrachtgever","Hem negeren"],"ok":1,"why":"CBR 7.3: rekening houden met leerlingen van speciaal onderwijs en met eisen en afspraken van de opdrachtgever.","wrong":["Dat maakt onrust erger.","","Negeren is geen goede omgang."],"bron":"CBR exameneisen TVT 7.3"},{"id":"s1-t6-l10","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"Hoe mag een reiziger betalen volgens de KNV-voorwaarden?","opts":["Alleen contant","Contant of met een algemeen erkende elektronische betaling, tenzij anders afgesproken","Alleen met een app van het bedrijf"],"ok":1,"why":"KNV 6.2: contant met een in NL algemeen geaccepteerd betaalmiddel, inclusief erkende elektronische betalingen.","wrong":["Elektronisch mag ook.","","Te beperkt."],"bron":"KNV Algemene Voorwaarden art. 6 lid 2"},{"id":"s1-t6-l11","tak":6,"niveau":"lopen","et":"ET 7.2","type":"mc","q":"De passagier opent zelf het portier aan de straatkant. Wat zeggen de voorwaarden?","opts":["Dat mag nooit","Hij opent het zo dat er geen hinder of gevaar voor het verkeer ontstaat","De chauffeur is altijd aansprakelijk"],"ok":1,"why":"KNV 5.6: kiest de reiziger zelf het portier te openen, dan zo dat geen hinder of gevaar ontstaat.","wrong":["Hij mag het wel.","","Niet wat art. 5.6 zegt."],"bron":"KNV Algemene Voorwaarden art. 5 lid 6"},{"id":"s1-t6-l12","tak":6,"niveau":"lopen","et":"ET 7.3","type":"m oonbare schade is.","wrong":["Geen vaste volle prijs.","","Bij aantoonbare schade wel."],"bron":"KNV Algemene Voorwaarden art. 4 lid 4"},{"id":"s1-t6-r04","tak":6,"niveau":"rennen","et":"ET 7.2","type":"mc","q":"Een passagier wil € 23 betalen met een zak vol muntjes van 10 cent. Wat zeggen de voorwaarden?","opts":["Je moet ze altijd aannemen","Je hoeft een hoeveelheid munten niet aan te nemen als het tellen onevenredig veel oponthoud geeft","Munten zijn nooit toegestaan"],"ok":1,"why":"KNV 6.3: de vervoerder hoeft een hoeveelheid munten niet aan te nemen bij onevenredig oponthoud.","wrong":["Niet als het tellen te lang duurt.","","Contant geld is toegestaan."],"bron":"KNV Algemene Voorwaarden art. 6 lid 3"},{"id":"s1-t6-r05","tak":6,"niveau":"rennen","et":"ET 7.2","type":"num","q":"Een paraplu (niet kostbaar) ligt al lang in het depot van het taxibedrijf. Na hoeveel maanden mag de vervoerder hem verkopen? Typ het getal.","ok":3,"why":"KNV 10.2: niet-kostbare gevonden voorwerpen na drie maanden (of eerder als ze niet te bewaren zijn). De rechthebbende kan zich binnen één jaar melden voor het voorwerp of de opbrengst (10.3).","bron":"KNV Algemene Voorwaarden art. 10 lid 2 en 3","unit":"maanden"},{"id":"s1-t6-r06","tak":6,"niveau":"rennen","et":"ET 7.2","type":"multi","q":"Wat klopt over de aansprakelijkheid van de vervoerder volgens KNV art. 12? Kies ALLE juiste.","opts":["Bij letsel of dood van de reiziger is de vergoeding wettelijk beperkt tot € 1.000.000 per reiziger","Voor verlies of schade aan handbagage geldt max € 1.500 per reiziger","Bij vertraging is de vervoerder aansprakelijk tot max € 1.000","De vervoerder is nooit aansprakelijk"],"ok":[0,1,2],"why":"KNV 12: letsel/dood max € 1.000.000 per reiziger (€ 15 mln per gebeurtenis); handbagage max € 1.500; vertraging max € 1.000.","wrong":["","","","De vervoerder is wel aansprakelijk, met grenzen."],"bron":"KNV Algemene Voorwaarden art. 12"},{"id":"s1-t6-r07","tak":6,"niveau":"rennen","et":"ET 6.2","type":"multi" 025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r03","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Twee collega's delen een rit van 9 km / 18 min (maximumtarief). Wat betaalt ieder?","ok":21.1,"unit":"€","why":"Totaal € 42,20 ÷ 2 = € 21,10.","kort":"Truc: 9 × 3,17 = 10 × 3,17 − 3,17 = 28,53.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r04","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Door een afsluiting rijd je om: 13,5 km en 26 min i.p.v. 10 km en 20 min (maximumtarief). Hoeveel duurder wordt de rit?","ok":14.22,"unit":"€","why":"Extra = 3,5 × 3,17 + 6 × 0,52 = 11,095 + 3,12 = € 14,22. (Start telt niet mee in het verschil.)","kort":"Truc: reken alleen het verschil: Δkm × 3,17 + Δmin × 0,52.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r05","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Een passagier betaalde € 60,00 bij maximumtarief; de rit duurde 20 minuten. Hoeveel km was de rit? (2 decimalen)","ok":14.29,"unit":"km","why":"60 − 4,31 − 20 × 0,52 (10,40) = 45,29; ÷ 3,17 = 14,29 km.","kort":"Truc: haal eerst start en tijd eraf, dan delen door 3,17 (≈ ÷ 3 en iets minder).","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r06","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Maximumtarief, rit van 6 km. Meter staat op € 30,00. Hoeveel minuten duurde de rit? (2 decimalen)","ok":12.83,"unit":"min","why":"30 − 4,31 − 19,02 = 6,67; ÷ 0,52 = 12,83 min.","kort":"Truc: ÷ 0,52 ≈ × 2 en iets minder (×1,923).","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r07","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Een chauffeur vraagt € 45,00 voor 9 km / 15 min. Hoeveel ligt dat BOVEN het maximumtarief 2026? (Overcharge in euro)","ok":4.36,"unit":"€","why":"Max = 4,31 + 28,53 + 7,80 = € 40,64. 45,00 − € 40,64 = € 4,36 te veel → niet toegestaan op de opstapmarkt.","kort":"Truc: 9 × 3,17 = 31,70 − 3,17.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r08","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Eigen tarief: € 3,95 start, € 2,75/km, € 0,45/min. Rit 11 km / 20 min. Hoeveel goedkoper dan het maximumtarief?","ok":6.38,"unit":"€","why":"Eigen: 3,95 + 30,25 + 9,00 = € 43,20. Max: 4,31 + 34,87 + 10,40 = € 49,58. Verschil € 6,38.","kort":"Truc: verschil per onderdeel: 0,36 + 11 × 0,42 + 20 × 0,07 = 0,36 + 4,62 + 1,40.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r09","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Vooraf vaste prijs € 70,00 afgesproken voor een nachtrit van 24 km (32 min). Hoeveel bespaart de passagier t.o.v. de meter op maximumtarief?","ok":27.03,"unit":"€","why":"Meter: 4,31 + 76,08 + 16,64 = € 97,03. − 70,00 = € 27,03.","kort":"Truc: 24 × 3,17 = 2 × 12 × 3,17 = 2 × 38,04. Vaste prijs mag als die vooraf is afgesproken (art. 1 lid 3).","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r10","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Vaste prijs € 25,00 afgesproken voor 5 km / 12 min. Hoeveel goedkoper is de vaste prijs dan de meter op maximumtarief?","ok":1.4,"unit":"€","why":"Meter: 4,31 + 15,85 + 6,24 = € 26,40. € 26,40 − 25,00 = € 1,40.","kort":"Truc: 5 × 3,17 = 31,70 ÷ 2.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r11","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Busje met 6 personen. Afgesproken wachttijd 20 min (€ 59,41/u), daarna 15 km / 25 min op maximumtarief busje. Totaal?","ok":103.32,"unit":"€","why":"Wacht 59,41 ÷ 3 = 19,8033. Rit 8,77 + 60,00 + 14,75 = 83,52. Totaal € 103,32.","kort":"Truc: 20 min = ÷ 3. 25 × 0,59 = 25 × 0,60 − 0,25 = 14,75.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r12","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Vier vrienden delen een rit 16,4 km / 27 min (personenauto, maximumtarief). Wat betaalt ieder?","ok":17.58,"unit":"€","why":"Totaal 4,31 + 51,988 + 14,04 = 70,338 → ÷ 4 = € 17,58.","kort":"Truc: ÷ 4 = 2× halveren.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r13","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Gedeelde rit: passagier A stapt uit na 4 km / 10 min (meterstand dan), B rijdt door tot 11 km / 25 min totaal. Afspraak: A betaalt meterstand bij uitstappen, B de rest. Wat betaalt B?","ok":29.99,"unit":"€","why":"Totaal € 52,18, A: € 22,19. B = € 29,99 (= 7 × 3,17 + 15 × 0,52).","kort":"Truc: rest = alleen het extra stuk: Δkm × 3,17 + Δmin × 0,52.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r14","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Budget passagier: € 100,00. Rit duurt naar verwachting 40 min (maximumtarief). Hoeveel km kun je maximaal rijden? (2 decimalen)","ok":23.62,"unit":"km","why":"100 − 4,31 − 20,80 = 74,89; ÷ 3,17 = 23,62 km.","kort":"Truc: tijd eraf, dan ÷ 3,17.","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}},{"id":"rk-r15","tak":4,"niveau":"rennen","et":"ET 4 Ritprijs (TVP)","type":"num","reken":true,"q":"Je bedrijf geeft 10% korting op het maximumtarief. Rit 7,3 km / 13 min. Wat betaalt de passagier?","ok":30.79,"unit":"€","why":"Max: 4,31 + 23,141 + 6,76 = 34,211; × 0,9 = € 30,79.","kort":"Truc: 10% korting = bedrag − (komma één plek naar links).","bron":"Regeling maximumtarief en bekendmaking tarieven taxivervoer art. 1, 1a (Stcrt. 2025, 41618, tarieven 2026)","inputs":{}}]},{"id":"set-02","naam":"Set 2 – multi-AI vraagbank (DeepSeek + Gemini, kruisgecontroleerd + feitencheck)","datum":"2026-10-18","vragen":[{"id":"s2-t1-k02","tak":1,"niveau":"kruipen","et":"ET 1.3","type":"mc","q":"Tijdens de rit valt de BCT uit en start niet meer op. Wat moet Krijger doen?","opts":["Niets registreren, want het is overmacht.","Handmatig en deugdelijk ritten, arbeids- en rusttijden registreren tot de BCT gerepareerd is; reparatie bij een erkend inbouwstation.","Verder rijden met de chauffeurskaart van een collega.","Alleen de centrale bellen en verder niets vastleggen."],"ok":1,"why":"Bij een storing moet de chauffeur handmatig en deugdelijk blijven registreren. De reparatie gebeurt bij een erkend inbouwstation. Je mag nooit de kaart van een collega gebruiken.","wrong":["Bij een storing moet hij handmatig blijven registreren; overmacht is geen reden om niets te doen.","","Je mag nooit de kaart van een collega gebruiken.","Alleen de centrale bellen is niet genoeg; hij moet zelf ritten en tijden registreren."],"bron":"CBR ET 1 / ILT","hint":"De BCT is stuk, maar Krijger moet zijn ritten en tijden tóch vastleggen.","simpel":"De BCT gaat kapot tijdens de rit en start niet meer. Wat moet Krijger doen?","kern":["BCT","valt uit","start niet"]},{"id":"s2-t1-k03","tak":1,"niveau":"kruipen","et":"ET 1.3","type":"mc","q":"Hoe vaak moet Krijger zijn eigen chauffeurskaart minstens downloaden?","opts":["Elke dag","Elke week","Minstens elke 5 weken","Elk jaar"],"ok":2,"why":"De chauffeurskaart moet minstens elke 5 weken worden gedownload. Dagelijks of wekelijks is vaker dan verplicht, en jaarlijks is te laat.","wrong":["Elke dag is vaker dan verplicht; minimaal elke 5 weken is genoeg.","Elke week is vaker dan verplicht; minimaal elke 5 weken is genoeg.","","Elk jaar is te laat; minimaal elke 5 weken is verplicht."],"bron":"ILT BCT/CDT","hint":"Het getal in de ezelsbrug is vijf weken.","simpel":"Hoe vaak moet Krijger de gegevens van zijn chauffeurskaart downloaden? Kies het goede antwoord.","kern":["chauffeurskaart","downloaden","minstens"]},{"id":"s2-t1-k04","tak":1,"niveau":"kruipen","et":"ET 1.3","type":"mc","q":"Krijger heeft zijn eigen chauffeurskaart in de BCT gestoken. Mag hij bij een storing de chauffeurskaart van een collega gebruiken?","opts":["Ja, als de collega toestemming geeft.","Ja, maar alleen bij een storing.","Nee, hij moet altijd met zijn eigen chauffeurskaart rijden.","Alleen buiten de dienst."],"ok":2,"why":"De BCT/CDT moet altijd met de eigen chauffeurskaart worden gebruikt. Een kaart van een collega mag niet, ook niet bij storing. Anders zijn de ritten niet aan de juiste chauffeur toe te wijzen.","wrong":["Hij mag nooit de kaart van een collega gebruiken, ook niet met toestemming.","Ook bij een storing moet hij zijn eigen chauffeurskaart gebruiken.","","Alleen buiten de dienst klopt niet; hij moet altijd zijn eigen kaart gebruiken."],"bron":"CBR ET 1 / ILT","hint":"De BCT/CDT herkent wie er rijdt; dat moet altijd Krijger zelf zijn.","simpel":"Krijger gebruikt zijn eigen chauffeurskaart. Mag hij bij een storing de kaart van een collega gebruiken?","kern":["BCT","chauffeurskaart","collega"]},{"id":"s2-t1-k05","tak":1,"niveau":"kruipen","et":"ET 1.3","type":"mc","q":"Wat geldt voor het gebruik van BCT en CDT op één werkdag?","opts":["Krijger mag BCT en CDT tegelijk gebruiken.","Krijger kiest per dag óf BCT óf CDT, niet beide tegelijk.","Krijger hoeft niets te registreren.","Krijger mag alleen papieren lijsten gebruiken."],"ok":1,"why":"Per dag wordt óf BCT óf CDT gebruikt, niet beide tegelijk. Vanaf 1 januari 2028 is alleen CDT nog toegestaan. Papieren lijsten zijn alleen een noodoplossing bij storing.","wrong":["Hij mag niet beide tegelijk gebruiken; per dag kiest hij één systeem.","","Hij moet wel registreren, met BCT of CDT.","Papieren lijsten zijn alleen een noodoplossing bij storing, niet standaard."],"bron":"CBR ET 1 / ILT","hint":"Eén systeem per dag; na 2028 blijft er maar één over.","simpel":"Mag Krijger op één werkdag BCT en CDT allebei gebruiken?","kern":["BCT","CDT","werkdag"]},{"id":"s2-t1-k06","tak":1,"niveau":"kruipen","et":"ET 1.3","type":"mc","q":"Hoe lang moet de ondernemer de gegevens van BCT/CDT bewaren?","opts":["1 jaar","2 jaar","5 jaar","10 jaar"],"ok":1,"why":"De ondernemer bewaart de BCT/CDT-gegevens 2 jaar. Eén jaar is te kort, vijf en tien jaar zijn langer dan verplicht.","wrong":["Eén jaar is te kort; de ondernemer moet 2 jaar bewaren.","","Vijf jaar is langer dan verplicht; 2 jaar is voldoende.","Tien jaar is langer dan verplicht; 2 jaar is voldoende."],"bron":"ILT BCT/CDT","hint":"Denk aan het vaste getal van de bewaartermijn: twee.","simpel":"Hoe lang moet het bedrijf de BCT/CDT-gegevens bewaren?","kern":["ondernemer","gegevens","bewaren"]},{"id":"s2-t1-k10","tak":1,"niveau":"kruipen","et":"ET 1.1","type":"mc","q":"Een passagier stapt in bij Krijger op de standplaats. De klant wil vóór de rit weten wat de maximale tarieven zijn. Welk document of middel in de taxi toont dit aan de klant?","opts":["De taxi-informatiekaart (tariefkaart), die van binnen en buiten goed leesbaar is.","Het APK-keuringsrapport in het dashboardkastje.","Het kentekenbewijs van het voertuig.","Het keuringsbewijs van de taxameter."],"ok":0,"why":"De taxi-informatiekaart (tariefkaart) moet zowel van binnen als buiten duidelijk leesbaar zijn voor de passagier. Hierop staan de tarieven van het taxibedrijf vermeld. Het keuringsbewijs van de taxameter toont alleen dat de meter geijkt is, niet wat de rit kost.","wrong":["","Het APK-keuringsrapport toont geen tarieven.","Het kentekenbewijs toont geen tarieven.","Het keuringsbewijs van de taxameter toont alleen dat de meter geijkt is, niet de tarieven."],"bron":"CBR ET 1 / Regeling personenvervoer 2000","hint":"Kijk naar de kaart die de klant informatie geeft over de tarieven.","simpel":"Een passagier wil weten wat de rit kost. Welk document toont de tarieven in de taxi?","kern":["tarieven","document","taxi"]},{"id":"s2-t1-k13","tak":1,"niveau":"kruipen","et":"ET 1.1","type":"mc","q":"Krijger rijdt in een straattaxi met een taxameter. Hoe wordt aangetoond dat de taxameter goedgekeurd is en juist is geijkt?","opts":["Door een geldige APK-sticker op de voorruit.","Door een keuringsbewijs (of geldig merkteken/stempel) bij de taxameter.","Door een inschrijving in het handelsregister van de Kamer van Koophandel.","Door een uitdraai van de ritgegevens uit de CDT."],"ok":1,"why":"Een wettelijk verplichte taxameter heeft een keuringsbewijs of keurmerk nodig van een erkend inbouwstation/ijkinstantie. De APK gaat over de algemene veiligheid van het voertuig, niet over de ijking van de meter. CDT-uitdraaien vervangen de keuring van de meter niet.","wrong":["De APK-sticker toont de algemene veiligheid van het voertuig, niet de ijking van de taxameter.","","Een inschrijving bij de Kamer van Koophandel zegt niets over de goedkeuring van de taxameter.","Een CDT-uitdraai vervangt de keuring van de taxameter niet."],"bron":"CBR ET 1 / Metrologiewet","hint":"De taxameter heeft zijn eigen specifieke keuringsbewijs of keurstempel.","simpel":"Krijger rijdt in een taxi. Hoe bewijs je dat de taxameter is goedgekeurd en goed is ingesteld?","kern":["taxameter","goedgekeurd","geijkt"]},{"id":"s2-t1-l01","tak":1,"niveau":"lopen","et":"ET 1.2","type":"mc","q":"Tijdens de rijklaarcontrole legt Krijger zijn documenten klaar. Welk document hoort bij Krijger zelf en niet bij de taxi?","opts":["kentekenbewijs","APK-rapport","groene kaart","chauffeurskaart"],"ok":3,"why":"Krijger moet zijn rijbewijs B, identiteitsbewijs en chauffeurskaart bij zich hebben. Kentekenbewijs, APK-rapport en groene kaart horen bij het voertuig. Daarom is de chauffeurskaart het enige persoonlijke document in dit rijtje.","wrong":["Het kentekenbewijs hoort bij het voertuig, niet bij de chauffeur.","Het APK-rapport hoort bij het voertuig, niet bij de chauffeur.","De groene kaart hoort bij het voertuig, niet bij de chauffeur.",""],"bron":"CBR ET 1"},{"id":"s2-t1-l06","tak":1,"niveau":"lopen","et":"ET 1.2","type":"mc","q":"Krijger pakt de chauffeurskaart van een collega en rijdt daarmee. Wat is het gevolg?","opts":["Er gebeurt niets, zolang er maar een kaart in de computer zit","De kaart van de collega wordt automatisch geblokkeerd","De registratie is onjuist en Krijger riskeert een maatregel","De werkgever krijgt alleen een waarschuwing"],"ok":2,"why":"Rijden met de kaart van een collega zorgt voor een onjuiste registratie. Krijger riskeert daardoor een maatregel. Hij mag nooit andermans kaart gebruiken.","wrong":["Er gebeurt wel iets: de registratie is onjuist.","De kaart wordt niet automatisch geblokkeerd; de registratie is fout.","","Het kan meer zijn dan een waarschuwing; Krijger riskeert een maatregel."],"bron":"CBR ET 1"},{"id":"s2-t1-l08","tak":1,"niveau":"lopen","et":"ET 1.3","type":"mc","q":"Krijger gebruikt dagelijks zijn eigen chauffeurskaart in de taxi. Om de hoeveel tijd moet de chauffeurskaart wettelijk uiterlijk worden uitgelezen (gedownload)?","opts":["Minimaal elke week.","Minimaal elke 2 weken.","Minimaal elke 5 weken.","Minimaal elke 12 weken."],"ok":2,"why":"De chauffeurskaart moet minimaal eenmaal per 5 weken worden uitgelezen en gedownload. Wachten tot 12 weken is een overtreding, en elke week is niet wettelijk verplicht.","wrong":["Elke week uitlezen is niet wettelijk verplicht.","Elke 2 weken is niet wettelijk verplicht.","","12 weken is te laat; de wettelijke termijn is 5 weken."],"bron":"Bp2000 / CBR ET 1.3"},{"id":"s2-t1-l09","tak":1,"niveau":"lopen","et":"ET 1.1","type":"mc","q":"Krijger controleert voor de rit de taxi-informatiekaart (tariefkaart). Waar moet deze kaart aanwezig zijn en hoe moet deze zichtbaar zijn?","opts":["Zowel van binnen als van buiten de taxi duidelijk leesbaar voor de reiziger.","In het dashboardkastje, zodat de chauffeur deze op verzoek van de passagier kan pakken.","Uitsluitend op de achterruit geplakt, gericht op voorbijgangers.","Alleen digitaal op de BCT/CDT; een papieren of fysieke kaart is niet meer toegestaan."],"ok":0,"why":"De taxi-informatiekaart moet voor de passagier duidelijk leesbaar zijn, zowel van buitenaf als vanuit het voertuig. Opbergen in het dashboardkastje of uitsluitend digitaal tonen voldoet niet aan de wettelijke eis.","wrong":["","Opbergen in het dashboardkastje voldoet niet; de kaart moet zichtbaar zijn.","Alleen op de achterruit is niet voldoende; de kaart moet ook van binnen leesbaar zijn.","Alleen digitaal tonen is niet toegestaan; een papieren of fysieke kaart is verplicht."],"bron":"Wp2000 / CBR ET 1.1"},{"id":"s2-t1-r02","tak":1,"niveau":"rennen","et":"ET 1.3","type":"mc","q":"Het is dinsdag 3 november 2026, 06:50. Krijger start zijn dienst. In de taxi zitten een BCT en een CDT. Wat moet hij doen?","opts":["Beide systemen tegelijk gebruiken.","Alleen de BCT gebruiken, want CDT is pas in 2028 verplicht.","Die dag óf de BCT óf de CDT gebruiken, niet beide tegelijk.","Eén systeem per week gebruiken, dan is het goed."],"ok":2,"why":"Vóór 1 januari 2028 mag Krijger per dag kiezen tussen BCT of CDT; hij mag ze niet tegelijk gebruiken. Eén systeem per week is niet correct, want de keuze is per dag. Bron: vaste feiten BCT/CDT.","wrong":["Hij mag ze niet tegelijk gebruiken.","Alleen de BCT gebruiken is niet verplicht; hij mag ook de CDT kiezen.","","De keuze is per dag, niet per week."],"bron":"CBR ET 1"},{"id":"s2-t1-r05","tak":1,"niveau":"rennen","et":"ET 1.1","type":"mc","q":"Vrijdag 13 november 2026, 16:45. Krijger pakt de groene kaart uit het dashboardkastje. Wat is de groene kaart?","opts":["De milieusticker","Het kentekenbewijs","Het keuringsbewijs van de taxameter","De verzekeringskaart"],"ok":3,"why":"De groene kaart is de verzekeringskaart. De andere documenten hebben een andere functie. Bron: CBR ET 1.","wrong":["De milieusticker is niet de groene kaart.","Het kentekenbewijs is niet de groene kaart.","Het keuringsbewijs van de taxameter is niet de groene kaart.",""],"bron":"CBR ET 1"},{"id":"s2-t1-r06","tak":1,"niveau":"rennen","et":"ET 1.3","type":"mc","q":"Dinsdagmiddag om 14:10 valt de Boordcomputer Taxi (BCT) in de taxi van Krijger uit. Het scherm blijft zwart en herstart niet. Wat moet Krijger doen volgens de regels voor apparatuur en administratie?","opts":["Krijger mag zonder registratie doorrijden mits hij de storing binnen 48 uur meldt bij de Inspectie Leefomgeving en Transport (ILT).","Krijger registreert zijn ritten, arbeids- en rusttijden deugdelijk handmatig en laat de BCT zo snel mogelijk repareren bij een erkend inbouwstation.","Krijger vervangt de BCT direct zelf door een reserve-exemplaar en herstart het voertuig.","Krijger registreert alleen zijn pauzes op papier en hoeft de BCT pas bij de eerstvolgende APK te laten herstellen."],"ok":1,"why":"Bij een storing van de BCT of CDT moet de chauffeur de gegevens deugdelijk handmatig bijhouden. De reparatie moet worden uitgevoerd door een erkend inbouwstation. Onbevoegd herstellen of niet registreren is een overtreding.","wrong":["Doorrijden zonder registratie is een overtreding; hij moet handmatig registreren.","","Zelf de BCT vervangen is niet toegestaan; reparatie moet via een erkend inbouwstation.","Alleen pauzes registreren is onvoldoende; hij moet alle ritten en tijden handmatig bijhouden, en reparatie niet uitstellen tot APK."],"bron":"CBR ET 1 / ILT-regelgeving BCT/CDT"},{"id":
