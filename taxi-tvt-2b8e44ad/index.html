rn":["geparkeerde auto","blikschade","document"]},{"id":"s2-t5-k03","tak":5,"niveau":"kruipen","et":"ET 5.3","type":"mc","q":"Krijger hoort via de radio dat er een ongeluk op zijn route is. De weg is dicht. Wat is de beste actie?","opts":["Hij rijdt door tot de afzetting en wacht daar.","Hij zegt niets tegen de passagier en rijdt om.","Hij kiest een andere route en informeert de passagier en de centrale.","Hij zet de passagier uit de auto."],"ok":2,"why":"Bij een stremming kies je een andere route. Je informeert de passagier en de centrale, zodat zij weten van de vertraging. Niets zeggen of iemand uitzetten is niet klantvriendelijk en niet professioneel.","wrong":["Doorrijden naar de afzetting kost tijd en is niet nodig.","Niets zeggen is niet professioneel.","","Een passagier uitzetten is niet klantvriendelijk."],"bron":"CBR ET 5","hint":"Denk aan: andere route, passagier en centrale informeren.","simpel":"Krijger hoort op de radio dat er een ongeluk is. De weg is dicht. Wat is de beste actie?","kern":["radio","ongeluk","weg dicht"]},{"id":"s2-t5-k04","tak":5,"niveau":"kruipen","et":"ET 5.1","type":"mc","q":"Krijger is als eerste bij een ongeval. Welke volgorde is volgens PAMAN juist?","opts":["Markeren, alarmeren, noodzakelijke hulp, persoonlijke veiligheid, andermans veiligheid","Alarmeren, markeren, noodzakelijke hulp, andermans veiligheid, persoonlijke veiligheid","Noodzakelijke hulp, alarmeren, markeren, andermans veiligheid, persoonlijke veiligheid","Persoonlijke veiligheid, andermans veiligheid, markeren, alarmeren, noodzakelijke hulp"],"ok":3,"why":"PAMAN is de juiste volgorde: Persoonlijke veiligheid, Andermans veiligheid, Markeren, Alarmeren, Noodzakelijke hulp. Je begint dus niet met alarmeren of markeren.","wrong":["De volgorde begint niet met persoonlijke veiligheid.","De volgorde begint niet met alarmeren.","De volgorde begint niet met noodzakelijke hulp.",""],"bron":"CBR ET 5","hint":"De letters van PAMAN wijzen de volgorde aan.","simpel":"Krijger is als eerste bij een ongeval. Wat is de juiste volgorde volgens PAMAN?","kern":["ongeval","volgorde","PAMAN"]},{"id":"s2-t5-k06","tak":5,"niveau":"kruipen","et":"ET 5.2","type":"mc","q":"Krijger en de andere bestuurder hebben het Europees schadeformulier ingevuld. Wat moet er daarna gebeuren?","opts":["Alleen de politie ondertekent het formulier.","Krijger stuurt het alleen naar zijn verzekeraar en de ander tekent niet.","Beide bestuurders ondertekenen het formulier en krijgen elk een kopie.","Het formulier wordt weggegooid, want er is geen schade."],"ok":2,"why":"Beide bestuurders ondertekenen het Europees schadeformulier en krijgen elk een kopie. Zo heeft elke verzekeraar dezelfde informatie. Alleen je eigen verzekeraar informeren zonder handtekening van de ander is niet juist.","wrong":["De politie ondertekent het schadeformulier niet.","Beide bestuurders moeten ondertekenen en een kopie krijgen.","","Er is wel schade, dus het formulier moet niet weg."],"bron":"CBR ET 5","hint":"Twee handtekeningen, twee kopieën.","simpel":"Krijger en de andere bestuurder hebben het schadeformulier ingevuld. Wat doen ze daarna?","kern":["schadeformulier","ingevuld","daarna"]},{"id":"s2-t5-k07","tak":5,"niveau":"kruipen","et":"ET 5.1","type":"mc","q":"Krijger krijgt pech op de autosnelweg in een flauwe bocht. Wat is de allereerste handeling volgens de PAMAN-volgorde direct nadat de auto veilig stilstaat?","opts":["Hij markeert de plek met de gevarendriehoek op de juiste afstand.","Hij controleert eerst zijn eigen persoonlijke veiligheid voordat hij uitstapt.","Hij belt direct 112 om de hulpdiensten te alarmeren.","Hij helpt de passagier direct uit de gevarenzone te komen."],"ok":1,"why":"PAMAN begint met de P van Persoonlijke veiligheid; je zorgt eerst dat je zelf veilig bent voordat je actie onderneemt. De afleider over de gevarendriehoek of alarmeren komt pas later in de volgorde aan bod.","wrong":["Dit komt later in PAMAN, niet als eerste.","","Alarmeren komt later, eerst persoonlijke veiligheid.","Eerst zelf veilig zijn, dan pas anderen helpen."],"bron":"CBR ET 5","hint":"Denk aan de letter P van PAMAN: wie moet er als eerste veilig zijn?","simpel":"Krijger heeft pech op de snelweg. De auto staat veilig stil. Wat doet hij eerst volgens PAMAN?","kern":["pech","PAMAN","eerste"]},{"id":"s2-t5-k08","tak":5,"niveau":"kruipen","et":"ET 5.1","type":"mc","q":"Krijger verleent hulp bij een ongeval op de snelweg. Wat is de juiste volgorde van de stappen die direct na de persoonlijke en andermans veiligheid komen?","opts":["Alarmeren, markeren, noodzakelijke hulp","Markeren, alarmeren, noodzakelijke hulp","Noodzakelijke hulp, markeren, alarmeren","Markeren, noodzakelijke hulp, alarmeren"],"ok":1,"why":"Na de persoonlijke veiligheid en andermans veiligheid markeer je de plek, alarmeer je de hulpdiensten (112) en verleen je pas daarna noodzakelijke hulp. De andere volgorden slaan stappen over of zetten hulp te vroeg in.","wrong":["Eerst markeren, daarna alarmeren. Alarmeren komt te vroeg.","","Eerst markeren en alarmeren, daarna pas hulp verlenen. Hulp komt te vroeg.","Alarmeren moet vóór noodzakelijke hulp. Hulp komt te vroeg."],"bron":"CBR ET 5","hint":"Eerst de weg veilig maken voor anderen, dan bellen, dan pas handelen.","simpel":"Krijger helpt bij een ongeluk op de snelweg. Wat moet hij eerst doen na zijn eigen veiligheid en die van anderen?","kern":["ongeval","snelweg","stappen"]},{"id":"s2-t5-k09","tak":5,"niveau":"kruipen","et":"ET 5.3","type":"mc","q":"Krijger krijgt te maken met een ernstige file-stremming op de A-weg. Wat is zijn eerste professionele taak ten aanzien van de klant in de taxi?","opts":["De passagier direct informeren over de vertraging en de situatie","De rit onmiddellijk beëindigen op de vluchtstrook","Niet praten en afwachten tot de weg weer open is","De meter uitschakelen en de passagier laten uitstappen in de berm"],"ok":0,"why":"Bij een stremming of vertraging informeer je tijdig de passagier en eventueel de centrale over de situatie. De passagier op de vluchtstrook laten uitstappen is levensgevaarlijk en onprofessioneel.","wrong":["","Je mag niet stoppen op de vluchtstrook. De rit beëindigen is onprofessioneel en gevaarlijk.","De passagier moet geïnformeerd worden. Niets zeggen is fout.","Uitstappen in de berm is levensgevaarlijk. Je mag de passagier niet laten uitstappen."],"bron":"CBR ET 5","hint":"Communicatie met de klant staat voorop bij onvoorziene vertraging.","simpel":"Krijger staat in een lange file op de snelweg. Wat moet hij eerst doen voor zijn klant?","kern":["file-stremming","klant","taak"]},{"id":"s2-t5-k11","tak":5,"niveau":"kruipen","et":"ET 5.2","type":"mc","q":"Krijger rijdt op een provinciale weg buiten de bebouwde kom en krijgt een aanrijding zonder gewonden. Welke gegevens vermeldt hij minimaal bij de melding aan de centrale of instanties?","opts":["Alleen het tijdstip en het merk van de auto","Tijdstip, schade, gewonden (of geen), wegnummer, hectometerpaal en rijrichting","Alleen de naam van de passagier","De geschatte reparatiekosten voor de taxameter"],"ok":1,"why":"Een volledige melding bevat altijd het tijdstip, de aard van de schade, of er gewonden zijn en de exacte locatie. Buiten de bebouwde kom zijn dat wegnummer, hectometerpaal en rijrichting. Schattingen van reparatiekosten horen niet bij de eerste melding.","wrong":["Een melding heeft meer gegevens nodig: schade, gewonden en locatie. Alleen tijdstip en merk is onvolledig.","","De naam van de passagier is niet genoeg. Je meldt tijdstip, schade, gewonden en locatie.","Reparatiekosten horen niet bij de melding. Je meldt tijdstip, schade, gewonden en locatie."],"bron":"CBR ET 5.2","hint":"Tijd, schade, gewonden en de exacte plek op de weg.","simpel":"Krijger rijdt buiten de stad en krijgt een ongeluk zonder gewonden. Welke informatie geeft hij door aan de centrale?","kern":["aanrijding","melding","gegevens"]},{"id":"s2-t5-k12","tak":5,"niveau":"kruipen","et":"ET 5.1","type":"mc","q":"Wat is het primaire doel van Incident Management (IM) door Rijkswaterstaat op de snelweg na een ongeval met een taxi?","opts":["Het zo snel mogelijk vrijmaken van de weg om nieuwe files en ongevallen te voorkomen","Het uitschrijven van boetes aan de betrokken chauffeurs","Het direct wegslepen van de auto naar de fabriek van de fabrikant","Het controleren van de taxipas en de chauffeurskaart"],"ok":0,"why":"Incident Management is erop gericht om incidenten op de snelweg snel af te handelen en de weg weer veilig vrij te geven. Handhaving en boetes zijn taken van de politie, niet primair van het IM.","wrong":["","Boetes uitschrijven is een taak van de politie, niet van Incident Management.","De auto wordt niet naar de fabriek gesleept. Incident Management maakt de weg vrij.","Taxipas en chauffeurskaart controleren is geen taak van Incident Management. Het doel is de weg vrijmaken."],"bron":"CBR ET 5","hint":"De doorstroming en veiligheid op de snelweg snel herstellen.","simpel":"Wat is het belangrijkste doel van Incident Management (IM) op de snelweg na een ongeluk?","kern":["Incident Management","snelweg","ongeval"]},{"id":"s2-t5-l02","tak":5,"niveau":"lopen","et":"ET 5.2","type":"mc","q":"Op welke wegen is de procedure Incident Management Rijkswaterstaat van toepassing?","opts":["Alle wegen binnen de bebouwde kom","Rijkswegen (autosnelwegen) in beheer bij Rijkswaterstaat","Provinciale wegen","Alleen op wegen met een maximumsnelheid van 80 km/u"],"ok":1,"why":"Incident Management Rijkswaterstaat geldt op rijkswegen (zoals autosnelwegen) die Rijkswaterstaat beheert. Op gemeentelijke of provinciale wegen geldt deze procedure niet.","wrong":["Incident Management Rijkswaterstaat geldt niet op alle wegen in de bebouwde kom.","","Provinciale wegen vallen niet onder Rijkswaterstaat.","Niet de maximumsnelheid is belangrijk, maar wie de weg beheert."],"bron":"CBR ET 5.2"},{"id":"s2-t5-l04","tak":5,"niveau":"lopen","et":"ET 5.2","type":"mc","q":"Wat is de juiste werkwijze bij het invullen van het Europees Schadeformulier?","opts":["Je vult het alleen in als er gewonden zijn","Je vult het samen met de andere partij in en noteert de feiten en schade","Je vult het alleen in als de politie aanwezig is","Je tekent alleen als je de schuld erkent"],"ok":1,"why":"Het Europees Schadeformulier vul je samen met de andere partij in. Je noteert alleen feiten zoals schade en omstandigheden, geen schuldvraag. Schuld bepalen de verzekeraars.","wrong":["Het formulier is ook voor materiële schade, niet alleen bij gewonden.","","De politie hoeft er niet bij te zijn.","Je tekent ook zonder schuld te erkennen; de verzekeraars bepalen de schuld."],"bron":"CBR ET 5.4"},{"id":"s2-t5-l06","tak":5,"niveau":"lopen","et":"ET 5.1","type":"mc","q":"In de PAMAN-reeks valt het in veiligheid brengen van passagiers onder welk onderdeel?","opts":["De gevarendriehoek plaatsen","112 bellen","Eerste hulp verlenen","Passagiers achter de vangrail brengen"],"ok":3,"why":"Andermans veiligheid betekent dat je passagiers in veiligheid brengt, bijvoorbeeld achter de vangrail. De gevarendriehoek plaatsen hoort bij Markeren, 112 bellen bij Alarmeren en eerste hulp bij Noodzakelijke hulp.","wrong":["De gevarendriehoek plaatsen hoort bij Markeren.","112 bellen hoort bij Alarmeren.","Eerste hulp verlenen hoort bij Noodzakelijke hulp.",""],"bron":"CBR ET 5.1"},{"id":"s2-t5-l12","tak":5,"niveau":"lopen","et":"ET 5.2","type":"mc","q":"Krijger moet bij een melding aan de alarmcentrale (Alarmeren) informatie geven over de slachtoffers. Wat is hierbij essentieel voor de hulpdiensten?","opts":["De nationaliteit en de leeftijd van alle betrokken passagiers.","Het aantal gewonden en een korte beschrijving van hun toestand of letsel.","Of de slachtoffers een geldige zorgverzekering hebben voor het ambulancevervoer.","De namen van de werkgevers van de mensen die in de auto's zaten."],"ok":1,"why":"Voor de inzet van de juiste hulp (aantal ambulances, traumahelikopter) moet de centrale weten hoeveel gewonden er zijn en wat hun toestand is. Persoonlijke gegevens zoals werkgever of verzekering zijn op dat moment niet relevant.","wrong":["Nationaliteit en leeftijd zijn niet belangrijk voor de hulpdiensten. Het aantal gewonden en hun toestand is essentieel.","","De verzekering is niet relevant voor de inzet van hulpdiensten. Het gaat om aantal gewonden en letsel.","Werkgevers zijn niet belangrijk voor de hulpdiensten. Het aantal gewonden en hun toestand is essentieel."],"bron":"CBR ET 5.2"},{"id":"s2-t5-r02","tak":5,"niveau":"rennen","et":"ET 5.1","type":"mc","q":"Na het veiligstellen van je eigen positie bij een ongeval: wat is de tweede stap van PAMAN?","opts":["Markeren","Andermans veiligheid","Alarmeren","Noodzakelijke hulp"],"ok":1,"why":"De tweede stap is Andermans veiligheid: je brengt bijvoorbeeld de passagier in veiligheid. Markeren is stap 3, Alarmeren stap 4 en Noodzakelijke hulp stap 5.","wrong":["Markeren is stap 3, niet stap 2.","","Alarmeren is stap 4, niet stap 2.","Noodzakelijke hulp is stap 5, niet stap 2."],"bron":"PAMAN / CBR ET 5.2"},{"id":"s2-t5-r03","tak":5,"niveau":"rennen","et":"ET 5.2","type":"mc","q":"Krijger rijdt op de A12 en ziet een ongeval. Hij moet de plaats melden. Welke melding is correct voor buiten de bebouwde kom?","opts":["Alleen de A12 en hectometerpaal 45,2","Alleen Utrecht en de A12","Alleen hectometerpaal 45,2 en richting Utrecht","A12, hectometerpaal 45,2 en richting Utrecht"],"ok":3,"why":"Buiten de bebouwde kom meld je als plaats: wegnummer, hectometerpaal en rijrichting. Straatnaam en huisnummer gebruik je binnen de bebouwde kom; een melding zonder wegnummer of zonder rijrichting is onvolledig.","wrong":["Alleen wegnummer en hectometerpaal is onvolledig; de rijrichting ontbreekt.","Alleen plaats en wegnummer is onvolledig; hectometerpaal en rijrichting ontbreken.","Alleen hectometerpaal en rijrichting is onvolledig; het wegnummer ontbreekt.",""],"bron":"CBR ET 5.2"},{"id":"s2-t5-r06","tak":5,"niveau":"rennen","et":"ET 5.2","type":"mc","q":"Wat hoort NIET in een melding van een ongeval?","opts":["Weersomstandigheden","Tijdstip","Schade","Aantal gewonden"],"ok":0,"why":"Een melding bevat onder andere tijdstip, schade, gewonden en plaats; weersomstandigheden zijn geen verplicht onderdeel. Zo blijft de melding kort en bruikbaar voor de hulpdiensten.","wrong":["","Tijdstip hoort wel in een melding.","Schade hoort wel in een melding.","Aantal gewonden hoort wel in een melding."],"bron":"CBR ET 5.2"},{"id":"s2-t5-r08","tak":5,"niveau":"rennen","et":"ET 5.1","type":"mc","q":"Krijger is betrokken bij een aanrijding op de autosnelweg A12. Er is alleen blikschade. Wat moet hij doen volgens de regels van Incident Management?","opts":["De voertuigen laten staan op de rijbaan tot de politie er is voor het onderzoek.","Meteen het Europees schadeformulier invullen terwijl de taxi op de rijstrook staat.","De taxi zo snel mogelijk verplaatsen naar de vluchtstrook of een veilige parkeerplaats.","De weg afzetten met de taxi zodat andere automobilisten niet langs het ongeval kunnen."],"ok":2,"why":"Incident Management is bedoeld om de weg zo snel mogelijk vrij te maken voor de veiligheid en doorstroming. Bij alleen blikschade moeten voertuigen naar de vluchtstrook of een parkeerplaats worden verplaatst. Stil blijven staan op de rijbaan is levensgevaarlijk.","wrong":["Voertuigen op de rijbaan laten staan is gevaarlijk. Bij blikschade moet je de weg vrijmaken.","Meteen het Europees schadeformulier invullen terwijl de taxi op de rijstrook staat is gevaarlijk. Eerst de auto naar een veilige plek verplaatsen.","","De weg afzetten is niet jouw taak en gevaarlijk. Je moet de auto naar een veilige plek verplaatsen."],"bron":"CBR ET 5.2"},{"id":"s2-t5-r10","tak":5,"niveau":"rennen","et":"ET 1.1","type":"mc","q":"Krijger vult na een ongeval het Europees schadeformulier in. De andere bestuurder zegt dat het de schuld van Krijger is. Wat moet Krijger doen bij het ondertekenen?","opts":["Alleen tekenen als hij toegeeft dat het zijn eigen schuld is.","De voorkant samen invullen en tekenen; dit is geen schuldbekentenis.","Weigeren te tekenen en wachten tot de verzekeraar ter plaatse komt.","Alleen de achterkant van het formulier tekenen en de voorkant leeg laten."],"ok":1,"why":"Het ondertekenen van de voorzijde van het schadeformulier betekent alleen dat beide partijen het eens zijn over de feiten (zoals de plek van de deuk). Het is geen erkenning van schuld; de verzekeraars bepalen later wie schuldig is. De achterkant vult iedere chauffeur later thuis zelf in.","wrong":["Ondertekenen is geen schuldbekentenis. Je tekent voor de feiten, niet voor schuld.","","Je moet de voorkant samen invullen en tekenen. De verzekeraar komt niet ter plaatse.","De voorkant moet samen ingevuld en ondertekend worden. De achterkant vul je later zelf in."],"bron":"CBR ET 1.1 en 5.3"},{"id":"s2-t5-r11","tak":5,"niveau":"rennen","et":"ET 5.3","type":"mc","q":"Krijger rijdt een contractrit voor een zorginstelling. Door een plotselinge wegafsluiting (stremming) kan hij niet verder. Wat is de juiste volgorde van handelen?","opts":["Eerst de passagier informeren, dan de centrale inlichten en een andere route zoeken.","Meteen omkeren en de passagier terugbrengen naar het startadres.","Wachten tot de weg weer open gaat, ook al duurt dit langer dan een uur.","De passagier laten uitstappen zodat deze zelf te voet verder kan gaan."],"ok":0,"why":"Bij een stremming moet Krijger de passagier geruststellen en informeren over de vertraging. Daarna meldt hij dit aan de centrale zodat zij weten waarom de rit langer duurt. Vervolgens zoekt hij een alternatieve route om de passagier alsnog op de bestemming te krijgen.","wrong":["","Met terugbrengen los je de stremming niet op. Je moet informeren en een andere route zoeken.","Lang wachten is niet professioneel. Je moet een andere route zoeken en de passagier informeren.","De passagier laten uitstappen is onveilig en onprofessioneel. Je moet een andere route zoeken."],"bron":"CBR ET 5.4"},{"id":"s2-t5-r12","tak":5,"niveau":"rennen","et":"ET 5.1","type":"mc","q":"Krijger ziet een gewonde passagier na een aanrijding. Hij volgt de PAMAN-regel. Wanneer verleent hij de noodzakelijke hulp (N)?","opts":["Meteen als hij de auto heeft stilgezet, nog voordat hij 112 belt.","Pas nadat hij zichzelf heeft beveiligd, de situatie heeft gemarkeerd en gealarmeerd.","Alleen als de politie hem daarvoor officieel toestemming geeft.","Nadat hij de schadeformulieren met de tegenpartij volledig heeft ingevuld."],"ok":1,"why":"In de PAMAN-volgorde is de N (Noodzakelijke hulp) de laatste stap. Krijger moet eerst zorgen voor veiligheid (P en A), de plek markeren (M) en de hulpdiensten alarmeren (A). Pas daarna kan hij zich veilig concentreren op het verlenen van eerste hulp aan slachtoffers.","wrong":["Hij moet eerst zichzelf beveiligen en 112 bellen voordat hij hulp verleent.","","Hij heeft geen toestemming van de politie nodig om noodhulp te verlenen.","Schadeformulieren invullen is geen voorwaarde voor het verlenen van eerste hulp."],"bron":"CBR ET 5.1"},{"id":"s2-t5-r13","tak":5,"niveau":"rennen","et":"ET 5.2","type":"mc","q":"Krijger heeft een ongeval binnen de bebouwde kom in een stad die hij niet goed kent. Hoe bepaalt hij de juiste locatie voor de melding aan 112?","opts":["Hij zoekt naar het dichtstbijzijnde wegnummer op een hectometerpaal.","Hij kijkt naar de straatnaam en het huisnummer of een zijstraat in de buurt.","Hij geeft alleen de naam van de stad en de kleur van de taxi door.","Hij wacht tot er een buurtbewoner langskomt die de weg wel weet."],"ok":1,"why":"Binnen de bebouwde kom zijn straatnamen en huisnummers de standaard voor locatiebepaling. Als er geen huisnummer zichtbaar is, helpt de naam van een zijstraat of een bekend gebouw de hulpdiensten. Hectometerpaaltjes staan meestal alleen langs provinciale wegen en rijkswegen, niet in woonstraten.","wrong":["Hectometerpaaltjes staan meestal niet in woonstraten binnen de bebouwde kom.","","Alleen de stad en de kleur van de taxi noemen is niet precies genoeg.","Hij moet zelf actief de locatie bepalen en niet wachten op voorbijgangers."],"bron":"CBR ET 5.2"},{"id":"s2-t6-k01","tak":6,"niveau":"kruipen","et":"ET 6.1","type":"mc","q":"Een passagier stapt in en vraagt: 'Wat kost de rit naar het station en hoe lang duurt het?' Wat moet Krijger doen?","opts":["Een duidelijke schatting geven van de kosten en de verwachte reistijd vóór vertrek.","Zeggen dat alleen de meter de prijs bepaalt en geen schatting geven.","Zeggen dat hij het niet weet, omdat hij alleen rijdt.","De passagier vragen zelf op de tariefkaart te kijken."],"ok":0,"why":"De chauffeur moet de passagier vooraf informeren over kosten en tijd. Dit hoort bij de communicatie-eisen (CBR ET 6.1). De meter bepaalt de exacte prijs, maar een inschatting geven blijft verplicht.","wrong":["","Alleen zeggen dat de meter de prijs bepaalt, is onvoldoende; een schatting geven is verplicht.","Zeggen dat hij het niet weet, past niet bij de informatieplicht van de chauffeur.","De passagier naar de tariefkaart verwijzen is niet voldoende; de chauffeur moet zelf informeren."],"bron":"CBR ET 6.1","hint":"Kosten en tijd benoem je vóór de rit, niet pas erna.","simpel":"Een passagier vraagt hoeveel de rit kost en hoe lang hij duurt. Wat moet Krijger doen?","kern":["passagier","kosten","tijd"]},{"id":"s2-t6-k02","tak":6,"niveau":"kruipen","et":"ET 8.1","type":"mc","q":"Een passagier zegt tegen Krijger: 'Je moet een andere route nemen, die is korter.' Krijger weet dat die route is afgesloten door werkzaamheden. Wat doet hij?","opts":["Hij rijdt de route van de passagier om discussie te voorkomen.","Hij legt rustig uit dat de route is afgesloten en kiest de beste alternatieve route, zonder discussie.","Hij zegt: 'U hebt ongelijk, ik weet het beter.'","Hij stopt en vraagt de passagier uit te stappen."],"ok":1,"why":"De chauffeur gaat geen discussie aan, maar legt rustig uit waarom hij een andere route kiest. Dit staat in CBR ET 6.2. Toegeven aan een verkeerde route is niet professioneel.","wrong":["Toegeven aan een verkeerde route is niet professioneel.","","Zeggen dat de passagier ongelijk heeft, is onbeleefd en lokt discussie uit.","Stoppen en de passagier laten uitstappen is niet passend bij een routeverschil."],"bron":"CBR ET 6.2","hint":"Geen discussie, wel uitleg.","simpel":"Een passagier wil een andere route. Krijger weet dat die route is afgesloten. Wat doet hij?","kern":["passagier","route","afgesloten"]},{"id":"s2-t6-k03","tak":6,"niveau":"kruipen","et":"ET 6.2","type":"mc","q":"Tijdens een rit gaat de telefoon van Krijger over. Het is een privégesprek. Achterin zit een passagier. Wat is de beste actie?","opts":["De telefoon vasthouden en opnemen, want het is belangrijk.","De telefoon helemaal negeren en laten overgaan.","Handsfree opnemen, het gesprek kort en zakelijk houden en geen privézaken bespreken.","Langs de weg stoppen en later terugbellen."],"ok":2,"why":"Bellen in de taxi mag alleen handsfree; de passagier luistert mee, dus privézaken bespreek je niet. Vasthouden is verboden volgens RVV 61a. De oproep negeren is niet altijd nodig als het kort en zakelijk kan.","wrong":["De telefoon vasthouden is verboden (RVV 61a).","De oproep negeren is niet nodig als handsfree bellen kort en zakelijk kan.","","Stoppen en terugbellen is niet nodig; handsfree bellen mag onderweg."],"bron":"RVV 61a","hint":"De passagier luistert mee; handsfree en kort.","simpel":"De telefoon van Krijger gaat. Het is privé. Een passagier zit achterin. Wat doet hij het best?","kern":["telefoon","privégesprek","passagier"]},{"id":"s2-t6-k04","tak":6,"niveau":"kruipen","et":"ET 7.1","type":"mc","q":"Een oudere passagier met een rollator heeft meer tijd nodig om in te stappen. Krijger heeft een strakke planning. Wat is de beste actie?","opts":["De passagier vragen op te schieten vanwege zijn planning.","De passagier zeggen een latere taxi te nemen.","Een andere passagier vragen de rollator in de auto te tillen.","De passagier rustig helpen, extra tijd nemen en met respect en geduld praten."],"ok":3,"why":"Bij oudere of minder mobiele passagiers zijn geduld en respect nodig. De chauffeur helpt rustig en neemt extra tijd (CBR ET 6.4). Haast maken of doorsturen past niet bij een goede beroepshouding.","wrong":["Haast maken past niet bij geduld en respect voor een minder mobiele passagier.","De passagier doorsturen naar een latere taxi is niet respectvol.","De chauffeur moet zelf helpen; een andere passagier belasten is niet goed.",""],"bron":"CBR ET 6.4","hint":"Geduld en respect voor kwetsbare passagiers.","simpel":"Een oudere passagier met een rollator stapt langzaam in. Krijger heeft weinig tijd. Wat doet hij het best?","kern":["oudere passagier","rollator","instappen"]},{"id":"s2-t6-k05","tak":6,"niveau":"kruipen","et":"ET 3.1","type":"mc","q":"Een passagier is het niet eens met een extra bedrag voor wachttijd. Waar is bepaald of deze kosten mogen worden gerekend?","opts":["In de Algemene Voorwaarden Zorgvervoer en Taxi (KNV).","In de persoonlijke regels van Krijger.","In de gemeentelijke wegenverkeerswet.","Nergens; elke chauffeur beslist dat zelf."],"ok":0,"why":"De Algemene Voorwaarden Zorgvervoer en Taxi (KNV) gelden voor taxivervoer en regelen ook wachttijdkosten. Daar kan de passagier nalezen wat is afgesproken. De chauffeur beslist niet zelf.","wrong":["","De chauffeur beslist niet zelf over kosten.","De wegenverkeerswet regelt geen taxitarieven of wachttijd.","De voorwaarden zijn wel vastgelegd in de Algemene Voorwaarden Zorgvervoer en Taxi (KNV)."],"bron":"CBR ET 6.5","hint":"Denk aan de KNV-voorwaarden, niet aan eigen regels.","simpel":"Een passagier is het niet eens met extra kosten voor wachttijd. Waar staat of dat mag?","kern":["wachttijd","kosten","voorwaarden"]},{"id":"s2-t6-k06","tak":6,"niveau":"kruipen","et":"ET 7.1","type":"mc","q":"Krijger haalt een passagier met een visuele beperking op. De passagier wacht op de stoep. Wat doet Krijger eerst?","opts":["Hij stopt met de passagiersdeur aan de verkeerskant, zodat de passagier snel kan instappen.","Hij vraagt de passagier naar de verkeerskant te lopen.","Hij stopt zodat de passagier vanaf de stoepkant kan instappen en controleert daarna adres en bestemming.","Hij controleert het adres telefonisch pas nadat de passagier is ingestapt en de taxi rijdt."],"ok":2,"why":"Passagiers stappen in aan de stoepkant, nooit aan de verkeerskant. Daarna controleert Krijger adres en bestemming.","wrong":["Passagiers stappen in aan de stoepkant, niet aan de verkeerskant.","Passagiers moeten niet naar de verkeerskant lopen; dat is gevaarlijk.","","Hij controleert adres en bestemming vóór vertrek, niet tijdens het rijden."],"bron":"CBR exameneisen TVT","hint":"Stoepkant is veilig; adres check je vóór vertrek.","simpel":"Krijger haalt een passagier op die slecht ziet. De passagier wacht op de stoep. Wat doet Krijger eerst?","kern":["visuele beperking","stoep","eerst"]},{"id":"s2-t6-k12","tak":6,"niveau":"kruipen","et":"ET 4.1","type":"mc","q":"De auto van Krijger staat klaar voor de dagdienst. Aan welke eis moet de buitenkant van de taxi voldoen bij aanvang van de dienst?","opts":["De auto hoeft alleen eens per week gewassen te worden.","De auto moet zowel van binnen als van buiten schoon zijn.","Alleen de ramen moeten schoon zijn voor het zicht.","De schoonmaak is alleen verplicht bij contractvervoer."],"ok":1,"why":"Een verzorgde indruk hoort bij de beroepshouding; de auto moet bij aanvang van de dienst zowel van binnen als van buiten schoon zijn.","wrong":["De auto moet bij aanvang van de dienst schoon zijn, niet alleen eens per week.","","Niet alleen de ramen, maar de hele auto moet schoon zijn.","Schoonmaken is voor alle taxivervoer verplicht, niet alleen voor contractvervoer."],"bron":"CBR ET 7.1","hint":"Auto schoon en netjes.","simpel":"Krijger begint zijn werk. Wat is de eis voor de buitenkant van de taxi?","kern":["buitenkant","taxi","dienst"]},{"id":"s2-t6-k14","tak":6,"niveau":"kruipen","et":"ET 6.1","type":"mc","q":"Welk taalniveau in de Nederlandse taal wordt minimaal van een taxichauffeur verwacht volgens de CBR-exameneisen?","opts":["Taalniveau A1","Taalniveau A2","Taalniveau B1","Taalniveau C1"],"ok":2,"why":"De chauffeur moet in staat zijn om in het Nederlands (niveau B1) duidelijke informatie te verstrekken aan passagiers en de centrale.","wrong":["A1 is te laag; minimaal is B1.","A2 is te laag; minimaal is B1.","","C1 is hoger dan nodig; minimaal is B1."],"bron":"CBR ET 6","hint":"Communicatie op B1-niveau.","simpel":"Welk taalniveau moet een taxichauffeur minimaal hebben?","kern":["taalniveau","taxichauffeur","CBR-exameneisen"]},{"id":"s2-t6-l01","tak":6,"niveau":"lopen","et":"ET 6.1","type":"mc","q":"Een passagier stapt in en vraagt vóór vertrek: 'Wat kost een rit naar het vliegveld?' Krijger weet dat de ritprijs afhangt van de taxameter. Wat doet hij?","opts":["Hij zegt dat hij dat na de rit wel zal zien.","Hij geeft een duidelijke indicatie en legt uit dat de bedragen gebaseerd zijn op de tariefkaart en taxameter.","Hij belooft een exact bedrag en garandeert dat dit niet hoger wordt.","Hij weigert iets te zeggen en wijst op de tariefkaart."],"ok":1,"why":"De chauffeur moet de passagier juist informeren in verband met kosten en tijd, en duidelijkheid verschaffen over de tarieven.","wrong":["De chauffeur moet de passagier vooraf informeren over de kosten.","","De exacte ritprijs is niet te garanderen; de taxameter bepaalt de prijs.","Hij moet uitleg geven, niet alleen wijzen op de tariefkaart."],"bron":"CBR exameneisen TVT"},{"id":"s2-t6-l02","tak":6,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Tijdens de rit wordt een passagier boos en zegt dat Krijger de verkeerde route rijdt. Hij wil erover discussiëren. Wat is de juiste houding?","opts":["Krijger gaat de discussie aan om zijn gelijk te bewijzen.","Krijger biedt direct een korting aan om de passagier stil te krijgen.","Krijger blijft kalm, gaat geen discussie aan en legt kort uit welke route hij rijdt; indien nodig wijst hij op de klachtenprocedure.","Krijger negeert de passagier en rijdt door."],"ok":2,"why":"Volgens de CBR exameneisen is een professionele en neutrale houding vereist, waarbij geldt: geen discussie met de passagier en eventueel verwijzen naar de klachtenprocedure.","wrong":["Een discussie aangaan is niet professioneel en verergert het conflict.","Een korting aanbieden is geen juiste manier om een conflict op te lossen.","","De passagier negeren is niet respectvol en lost niets op."],"bron":"CBR exameneisen TVT"},{"id":"s2-t6-l03","tak":6,"niveau":"lopen","et":"ET 8.1","type":"mc","q":"Een passagier spreekt weinig Nederlands. Krijger wil uitleggen dat de rit iets langer duurt door een omleiding. Hoe doet hij dat op B1-niveau?","opts":["Hij gebruikt korte zinnen, eenvoudige woorden en checkt of de passagier het begrijpt.","Hij spreekt hard en langzaam in zijn eigen dialect.","Hij gebruikt technische termen, zodat de passagier leert.","Hij zegt niets en wijst alleen naar de omleiding."],"ok":0,"why":"Op B1-niveau communiceer je in verstaanbaar en begrijpelijk Nederlands met eenvoudige, korte zinnen en controleer je of de passagier het heeft begrepen.","wrong":["","Dialect is vaak moeilijk te verstaan; gebruik eenvoudig Nederlands.","Technische termen zijn te moeilijk voor B1-niveau.","Alleen wijzen is geen duidelijke uitleg."],"bron":"CBR exameneisen TVT"},{"id":"s2-t6-l05","tak":6,"niveau":"lopen","et":"ET 7.1","type":"mc","q":"Krijger stopt op een drukke straat. Een ouder echtpaar wil aan de kant van het verkeer instappen. Wat doet Krijger?","opts":["Hij laat hen op de stoepkant instappen en controleert eerst of het adres klopt.","Hij laat hen snel aan de verkeerskant instappen, want er is weinig verkeer.","Hij vraagt hen zelf te kiezen aan welke kant ze instappen.","Hij opent het portier aan de verkeerskant en helpt hen erin."],"ok":0,"why":"Passagiers moeten bij voorkeur aan de stoepkant in- en uitstappen, nooit aan de verkeerskant. Voor vertrek controleert de chauffeur of hij de juiste passagier en het juiste adres heeft.","wrong":["","Instappen aan de verkeerskant is onveilig, ook bij weinig verkeer.","De chauffeur bepaalt dat er aan de stoepkant wordt ingestapt.","Het portier aan de verkeerskant openen is gevaarlijk."],"bron":"CBR ET 7"},{"id":"s2-t6-l06","tak":6,"niveau":"lopen","et":"ET 7.1","type":"mc","q":"Een slechtziende mevrouw stapt in en vraagt hulp bij het instappen. Wat is de beste aanpak?","opts":["Hij pakt haar bij de arm en trekt haar zonder iets te zeggen naar binnen.","Hij roept vanaf zijn stoel dat ze moet opschieten.","Hij stelt zichzelf voor, legt rustig uit wat hij doet en biedt hulp aan zonder ongevraagd aan te raken.","Hij doet niets, want een slechtziende reiziger heeft altijd een begeleider."],"ok":2,"why":"Bij passagiers met een beperking is het belangrijk om rustig te communiceren, je voor te stellen en hulp aan te bieden. Ongevraagd aanraken kan de passagier laten schrikken; aannemen dat er altijd een begeleider is, is onjuist.","wrong":["Ongevraagd aanraken en trekken is onveilig en onbeleefd.","Roepen is onbeleefd en geeft geen duidelijke hulp.","","Niet elke slechtziende reiziger heeft een begeleider; bied hulp aan."],"bron":"CBR ET 7"},{"id":"s2-t6-l07","tak":6,"niveau":"lopen","et":"ET 6.1","type":"mc","q":"Een passagier vraagt wat er gebeurt met een voorwerp dat hij in de taxi heeft laten liggen. Waar vindt hij de regels?","opts":["Nergens; de chauffeur bepaalt per rit wat er gebeurt.","In de gemeentelijke verordening van de gemeente waar de rit eindigt.","Alleen op de taxameter, via een sticker.","In de Algemene Voorwaarden Zorgvervoer en Taxi (KNV)."],"ok":3,"why":"De Algemene Voorwaarden Zorgvervoer en Taxi (KNV) zijn van toepassing op taxiritten en bevatten onder meer regels over gevonden voorwerpen. De chauffeur mag niet zelf naar eigen inzicht handelen.","wrong":["De chauffeur mag niet zelf bepalen; er zijn vaste regels.","Gevonden voorwerpen staan niet in de gemeentelijke verordening.","Op de taxameter staat geen regeling voor gevonden voorwerpen.",""],"bron":"CBR ET 6"},{"id":"s2-t6-l08","tak":6,"niveau":"lopen","et":"ET 3.1","type":"mc","q":"Krijger rijdt contractvervoer voor een vaste groep ouderen. Een passagier vraagt tijdens de rit om een forse omweg naar een postkantoor en belooft een extra fooi. Wat is de juiste handelwijze volgens de KNV-voorwaarden en professionele beroepshouding?","opts":["Krijger voert de omweg direct uit omdat de klant koning is en extra betaalt.","Krijger legt uit dat de afgesproken route en bestemming contractueel vastliggen en gaat niet in op de discussie.","Krijger zet de passagier direct uit de taxi vanwege ongeoorloofde contractbreuk.","Krijger belt de centrale om goedkeuring te vragen en rijdt ondertussen alvast naar het postkantoor."],"ok":1,"why":"Bij contractvervoer moet Krijger zich houden aan de contractafspraken over route en bestemming. Hij blijft rustig, vermijdt discussie en gaat niet in op de extra fooi; een eigenmachtige omweg of passagier uitzetten is niet professioneel.","wrong":["Hij moet zich houden aan de contractroute, ook als de klant extra betaalt.","","Een passagier zomaar uitzetten is niet professioneel en past niet bij contractvervoer.","Hij mag niet alvast omrijden voordat hij toestemming heeft; hij moet de afspraken volgen."],"bron":"CBR ET 7.1 / 7.2 / 7.4"},{"id":"s2-t6-l10","tak":6,"niveau":"lopen","et":"ET 6.2","type":"mc","q":"Krijger wordt tijdens een rit naar het ziekenhuis gebeld door de planning voor een nieuwe spoedrit. Hij gebruikt een handsfree carkit. Waar moet Krijger scherp op letten?","opts":["Dat de passagier op de achterbank meeluistert en privacygevoelige of zakelijke informatie hoort.","Dat handsfree bellen in een taxi wettelijk volstrekt verboden is.","Dat hij de radio extra hard zet zodat de passagier niets verstaat.","Dat hij tijdens het bellen de snelheid verhoogt om tijd te winnen."],"ok":0,"why":"Handsfree bellen is toegestaan, maar de chauffeur let op de professionele indruk en het meeluisteren van de passagier. Bron: CBR RVV 61a & ET 6.","wrong":["","Handsfree bellen is wettelijk toegestaan, mits veilig.","De radio harder zetten is onprofessioneel en lost het privacyprobleem niet goed op.","Hij moet zijn snelheid niet verhogen; veiligheid gaat voor."],"bron":"RVV 61a"},{"id":"s2-t6-l11","tak":6,"niveau":"lopen","et":"ET 7.1","type":"mc","q":"Bij het ophalen van een blinde passagier met een geleidehond op een drukke straat, stopt Krijger de taxi. Wat is de correcte handelwijze bij het instappen?","opts":["Krijger blijft in de auto zitten en roept waar de deur is.","Krijger helpt actief, begeleidt de passagier en de hond naar de juiste deur en zorgt voor een veilige instap.","Krijger weigert de hond vanwege hygiënevoorschriften.","Krijger laat de passagier aan de straatkant instappen voor het snelle oversteken."],"ok":1,"why":"De chauffeur ondersteunt de passagier actief en zorgt voor een veilige instap aan de juiste kant; dit valt onder de omgang met passagiers en de instapprocedure. Bron: CBR ET 7.3.","wrong":["Hij moet actief helpen en niet alleen roepen vanaf zijn plek.","","Een geleidehond mag gewoon mee in de taxi; hygiëne is geen reden om te weigeren.","De passagier moet aan de veilige stoepkant instappen, niet aan de straatkant."],"bron":"CBR ET 7.3"},{"id":"s2-t6-l12","tak":6,"niveau":"lopen","et":"ET 7.1","type":"mc","q":"Een passagier stapt in aan de verkeerszijde (straatkant) in plaats van de veilige stoepkant. Wat is de juiste taak van de chauffeur?","opts":["Direct wegrijden om files te voorkomen.","De passagier vriendelijk wijzen op het gevaar en adviseren altijd via de stoepkant in te stappen.","Geen actie ondernemen, de passagier is zelf verantwoordelijk.","De portieren aan de straatkant permanent op slot zetten zodat uitstappen onmogelijk wordt."],"ok":1,"why":"De chauffeur let op de veiligheid en zorgt dat passagiers bij voorkeur aan de stoepkant in- en uitstappen (juiste kant bij instappen). Bron: CBR ET 7.3.","wrong":["Hij moet eerst de veiligheid bespreken en niet direct wegrijden.","","De chauffeur heeft ook een verantwoordelijkheid voor de veiligheid van de passagier.","Portieren permanent op slot zetten is onveilig en geen goede oplossing."],"bron":"CBR ET 7.3"},{"id":"s2-t6-l13","tak":6,"niveau":"lopen","et":"ET 7.1","type":"mc","q":"Wat is volgens de Algemene Voorwaarden Zorgvervoer en Taxi (KNV) en CBR-eindtermen een kernonderdeel van de professionele beroepshouding bij ritten met doelgroepen?","opts":["Geen rekening houden met individuele beperkingen om tijd te besparen.","Correcte aanspraken (U, meneer, mevrouw), geduld, tact en respect tonen.","De passagier aanspreken op de informele 'jij'-vorm om sneller contact te leggen.","Discussies aangaan over de gereden tarieven tijdens de rit."],"ok":1,"why":"Een professionele beroepshouding vereist respectvolle communicatie met U/meneer/mevrouw, geduld en tact, zeker bij doelgroepen. Bron: CBR ET 7.1.","wrong":["Een professionele chauffeur houdt juist rekening met de beperkingen van de passagier.","","De aanspreekvorm is juist U, meneer of mevrouw, niet jij.","Discussies over tarieven horen niet thuis in een respectvolle beroepshouding."],"bron":"CBR ET 7.1"},{"id":"s2-t6-r01","tak":6,"niveau":"rennen","et":"ET 6.2","type":"mc","q":"Maandag 09:35. Krijger rijdt met een passagier. Zijn vriend belt privé. Wat doet Krijger als hij het gesprek aanneemt?","opts":["Hij neemt op via de handsfree-installatie en houdt het gesprek kort en zakelijk, want de passagier luistert mee.","Hij neemt de telefoon in de hand, want hij staat net stil voor een rood licht.","Hij zet het gesprek op de luidspreker en voert een uitgebreid persoonlijk gesprek.","Hij vraagt de passagier om zijn oren dicht te stoppen, zodat hij privé kan praten."],"ok":0,"why":"Handsfree bellen mag, maar houd het kort en zakelijk; de passagier luistert mee. Vasthouden van een telefoon is verboden, ook bij stilstand voor een rood licht. De overige opties zijn onprofessioneel of verboden.","wrong":["","Een telefoon vasthouden is verboden, ook bij stilstand voor rood licht.","Een uitgebreid persoonlijk gesprek is niet zakelijk; de passagier luistert mee.","Dat is onprofessioneel en respectloos naar de passagier."],"bron":"RVV 61a; CBR ET 6"},{"id":"s2-t6-r02","tak":6,"niveau":"rennen","et":"ET 6.1","type":"mc","q":"Een passagier begrijpt Krijgers uitleg over de ritprijs niet. Wat is de beste aanpak?","opts":["Hij gebruikt voortaan alleen vaktaal, zodat hij deskundiger overkomt.","Hij zegt dat hij het later nog wel een keer uitlegt en rijdt gewoon door.","Hij herhaalt de uitleg in korte, eenvoudige zinnen (niveau B1) en controleert of de passagier het begrijpt.","Hij vraagt de passagier om het zelf te lezen op de tariefkaart en stopt met uitleggen."],"ok":2,"why":"Krijger moet Nederlands op B1-niveau spreken: korte zinnen, eenvoudige woorden. Zo begrijpt de passagier de informatie. Vaktaal of doorrijden zonder uitleg helpt niet.","wrong":["Vaktaal is moeilijk voor de passagier.","De passagier krijgt nu geen uitleg.","","De chauffeur moet zelf uitleg geven."],"bron":"CBR ET 6"},{"id":"s2-t6-r05","tak":6,"niveau":"rennen","et":"ET 7.1","type":"mc","q":"Een oudere passagier is slechthorend. Wat is de beste manier van communiceren?","opts":["Hij schreeuwt zo hard mogelijk in het oor van de passagier.","Hij schrijft alles op een briefje, want praten heeft geen zin.","Hij gebruikt alleen gebaren, want dat is internationaler.","Hij spreekt rustig en duidelijk, kijkt de passagier aan en controleert of alles begrepen is."],"ok":3,"why":"Bij slechthorende passagiers helpt rustig, duidelijk spreken en oogcontact. Controleer of de boodschap is overgekomen. Schreeuwen of alleen gebaren is onprofessioneel.","wrong":["Schreeuwen is onprofessioneel en niet nodig.","Praten heeft wel zin als u duidelijk spreekt.","Alleen gebaren is onvoldoende en onprofessioneel.",""],"bron":"CBR ET 7"},{"id":"s2-t6-r06","tak":6,"niveau":"rennen","et":"ET 6.1","type":"mc","q":"Een passagier wil weten wat er gebeurt als hij niet komt opdagen. Waar kan Krijger de passagier op wijzen?","opts":["Op de APK-keuring.","Op de chauffeurskaart.","Op de Algemene Voorwaarden Zorgvervoer en Taxi van de KNV.","Op de BCT-print."],"ok":2,"why":"De Algemene Voorwaarden Zorgvervoer en Taxi van de KNV bevatten regels voor onder andere annulering. APK, chauffeurskaart en BCT-print gaan over het voertuig of de chauffeur, niet over ritvoorwaarden.","wrong":["De APK gaat over de voertuigkeuring, niet over ritvoorwaarden.","De chauffeurskaart is voor de chauffeur, niet voor annulering.","","De BCT-print gaat over rij- en rusttijden, niet over annulering."],"bron":"CBR ET 6; KNV Algemene Voorwaarden"},{"id":"s2-t6-r07","tak":6,"niveau":"rennen","et":"ET 7.1","type":"mc","q":"Krijger rijdt dagelijks dezelfde groep leerlingen voor een school. Waarom is klanttevredenheid hier extra belangrijk?","opts":["Omdat tevreden klanten belangrijk zijn voor het behoud van het contract.","Omdat het verplicht is in de Arbowet.","Omdat de school anders het starttarief niet betaalt.","Omdat de chauffeur dan minder administratie hoeft te doen."],"ok":0,"why":"Bij contractvervoer is klanttevredenheid belangrijk voor het voortzetten van het contract. Als de school ontevreden is, kan het contract worden beëindigd. De andere redenen zijn onjuist.","wrong":["","De Arbowet gaat over arbeidsomstandigheden, niet over klanttevredenheid.","De school betaalt het starttarief gewoon.","Minder administratie is niet de reden; het gaat om het contract."],"bron":"CBR ET 7"},{"id":"s2-t6-r11","tak":6,"niveau":"rennen","et":"ET 7.1","type":"mc","q":"Een passagier met een visuele beperking en een geleidehond wil instappen bij Krijger. Wat schrijft de professionele omgang met doelgroepen voor?","opts":["De hond moet verplicht in de kofferbak van de taxi worden geplaatst.","De hond mag geweigerd worden als er andere passagiers in de auto zitten.","De geleidehond mag en moet mee in de taxi bij de passagier.","De passagier moet zelf betalen voor extra schoonmaakkosten van de hond."],"ok":2,"why":"Assistentie- en geleidehonden mogen niet worden geweigerd bij vervoer van passagiers met een beperking. Weigering is in strijd met de Algemene Voorwaarden en wetgeving.","wrong":["Een geleidehond hoort niet in de kofferbak. De hond blijft bij de passagier.","Een geleidehond mag niet worden geweigerd, ook niet als er andere passagiers zijn.","","De passagier hoeft geen extra schoonmaakkosten te betalen voor een geleidehond."],"bron":"CBR ET 7 / KNV Voorwaarden"},{"id":"s2-t6-r13","tak":6,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Tijdens een rit ontstaat er een meningsverschil met de passagier over de gekozen route. Hoe handelt Krijger conform de richtlijnen?","opts":["Hij gaat direct de discussie aan en verhoogt zijn stem om zijn gelijk te halen.","Hij blijft rustig, vermijdt een nutteloze discussie en legt de situatie helder en neutraal uit in B1-taalniveau.","Hij zet de passagier per direct midden op de snelweg uit de taxi.","Hij negeert de passagier volledig en rijdt expres een langere omweg."],"ok":1,"why":"Krijger vermijdt discussies, blijft professioneel en communiceert helder op B1-niveau. Passagiers direct uit de auto zetten of negeren is onprofessioneel en gevaarlijk.","wrong":["Een professionele chauffeur gaat niet de discussie aan en verhoogt zijn stem niet.","","Een passagier zomaar uitzetten op de snelweg is onprofessioneel en gevaarlijk.","Een passagier negeren en expres omrijden is onprofessioneel en onjuist."],"bron":"CBR ET 6, 7"},{"id":"s2-t7-k01","tak":7,"niveau":"kruipen","et":"ET 8.3","type":"mc","q":"Een passagier is boos omdat de rit door een omleiding langer duurt. Hij begint te schreeuwen. Wat is de beste reactie?","opts":["U schreeuwt terug dat u er niets aan kunt doen.","U blijft kalm, luistert en legt de situatie neutraal uit.","U belt meteen de politie.","U zet de passagier op een willekeurige plek uit de taxi."],"ok":1,"why":"Een professionele chauffeur blijft neutraal en luistert, dat voorkomt dat het conflict escaleert. De politie bellen of iemand willekeurig uit laten stappen is alleen nodig bij echt gevaar. Schreeuwen of wegsturen verergert de situatie.","wrong":["Terugschreeuwen maakt de situatie erger.","","De politie bellen is alleen nodig bij echt gevaar.","Iemand willekeurig uit laten stappen is onveilig en onprofessioneel."],"bron":"CBR ET 8","hint":"Blijf kalm als ijs, luister en blijf neutraal.","simpel":"Een passagier is boos. De rit duurt langer door een omleiding. Hij schreeuwt. Wat doet u het best?","kern":["boos","omleiding","schreeuwen"]},{"id":"s2-t7-k02","tak":7,"niveau":"kruipen","et":"ET 8.3","type":"mc","q":"Een passagier is het niet eens met de ritprijs en wil ter plekke discussiëren. Wat doet u?","opts":["U gaat de discussie aan tot de passagier gelijk krijgt.","U geeft korting om de discussie te stoppen.","U discussieert niet en verwijst naar de tariefkaart en de vervoersvoorwaarden.","U zegt dat hij later maar moet klagen en rijdt door."],"ok":2,"why":"Over de tariefhoogte ga je geen discussie aan; je wijst op de tariefkaart en de Algemene Voorwaarden Zorgvervoer en Taxi. Korting geven of de klacht afschuiven is niet professioneel. De discussie aangaan kan het conflict verergeren.","wrong":["Blijven discussiëren kan het conflict verergeren.","Zomaar korting geven is niet professioneel.","","De klacht afschuiven en doorrijden is niet klantvriendelijk."],"bron":"CBR ET 8","hint":"Geen discussie: tariefkaart en voorwaarden.","simpel":"Een passagier is het niet eens met de ritprijs. Hij wil discussiëren. Wat doet u?","kern":["ritprijs","discussiëren"]},{"id":"s2-t7-k03","tak":7,"niveau":"kruipen","et":"ET 8.3","type":"mc","q":"Tijdens een rit maakt een passagier steeds hardere opmerkingen. Hij balt zijn vuisten en zijn stem wordt luider. Wat is dit?","opts":["Een signaal dat de passagier rustig wordt.","Een signaal dat de situatie kan escaleren.","Een teken dat de passagier zich verveelt.","Een normaal onderdeel van een discussie."],"ok":1,"why":"Vuisten ballen en stemverheffing zijn bekende signalen van opbouwende agressie. Dat is geen ontspanning of verveling. Door dit op tijd te herkennen, kunt u de situatie nog de-escaleren.","wrong":["Vuisten ballen is geen teken van rustig worden.","","Het is geen verveling, maar opbouwende agressie.","Dit is geen normaal onderdeel van een discussie."],"bron":"CBR ET 8.3","hint":"Let op de opgepompte ballon: vuisten en luide stem.","simpel":"Een passagier maakt harde opmerkingen. Hij balt zijn vuisten. Zijn stem wordt luider. Wat betekent dit?","kern":["vuisten","stem luider"]},{"id":"s2-t7-k04","tak":7,"niveau":"kruipen","et":"ET 8.3","type":"mc","q":"U bent alleen met een agressieve passagier in de taxi. U voelt zich onveilig. Wat is de juiste actie?","opts":["U rijdt sneller om zo snel mogelijk van de passagier af te zijn.","U zegt niets en hoopt dat het overgaat.","U confronteert de passagier direct met zijn gedrag.","U stopt op een veilige plek en roept hulp in."],"ok":3,"why":"Bij gevaar is uw eigen veiligheid het belangrijkst: stop op een veilige plek en roep hulp in, bijvoorbeeld 112. Niets zeggen of sneller rijden lost het gevaar niet op. Confronteren kan de agressie versterken.","wrong":["Sneller rijden lost het gevaar niet op.","Niets zeggen is niet veilig; het gevaar blijft.","Confronteren kan de agressie versterken.",""],"bron":"CBR ET 8.3","hint":"Eerst eigen veiligheid: stop veilig, bel hulp.","simpel":"U bent alleen met een agressieve passagier. U voelt zich onveilig. Wat doet u?","kern":["alleen","agressieve passagier","onveilig"]},{"id":"s2-t7-k05","tak":7,"niveau":"kruipen","et":"ET 10.1","type":"mc","q":"Een passagier wil een klacht indienen over uw rijgedrag. Wat is de juiste route voor de passagier?","opts":["Direct naar de Geschillencommissie Zorgvervoer en Taxi.","Eerst de klachtenprocedure van het taxibedrijf, daarna de Geschillencommissie.","Alleen naar de politie.","Alleen naar de Inspectie Leefomgeving en Transport."],"ok":1,"why":"Een klacht hoort eerst bij de eigen klachtenprocedure van het taxibedrijf. Pas daarna kan de passagier naar de Geschillencommissie Zorgvervoer en Taxi stappen. Politie of ILT zijn niet de eerste stappen voor een klacht over rijgedrag.","wrong":["Eerst moet de passagier bij het taxibedrijf klagen, niet direct naar de Geschillencommissie.","","De politie is niet de juiste route voor een klacht over rijgedrag.","De ILT is niet de eerste stap voor een klacht over rijgedrag."],"bron":"CBR ET 10","hint":"Eerst de deur van het bedrijf, daarna de Geschillencommissie.","simpel":"De passagier wil een klacht indienen over hoe u rijdt. Wat moet hij eerst doen?","kern":["klacht","rijgedrag"]},{"id":"s2-t7-k06","tak":7,"niveau":"kruipen","et":"ET 8.3","type":"mc","q":"Op de standplaats ontstaat een conflict met een andere taxichauffeur. Wat is de professionele reactie?","opts":["U schreeuwt harder dan de ander om uw punt te maken.","U zegt niets en roddelt daarna over de chauffeur.","U blijft neutraal, gaat niet in op persoonlijke aanvallen en daagt de ander niet uit.","U pakt de ander fysiek aan om de discussie te beëindigen."],"ok":2,"why":"Neutraal blijven en niet persoonlijk aanvallen of uitdagen is de juiste professionele houding. Schreeuwen, roddelen of fysiek ingrijpen verergert het conflict en kan strafbaar zijn.","wrong":["Schreeuwen maakt het conflict alleen maar groter.","Roddelen is niet professioneel en lost niets op.","","Fysiek ingrijpen is strafbaar en onveilig."],"bron":"CBR ET 8","hint":"Neutraal als ijs: blaas de ballon niet verder op.","simpel":"U heeft een conflict met een andere taxichauffeur op de standplaats. Hoe reageert u professioneel?","kern":["conflict","taxichauffeur","professioneel"]},{"id":"s2-t7-k07","tak":7,"niveau":"kruipen","et":"ET 8.1","type":"mc","q":"Een passagier met een fysieke beperking is boos omdat de rit niet volgens afspraak verloopt. Wat is een voorbeeld van goede communicatie?","opts":["U onderbreekt de passagier om uw uitleg te geven.","U zet de radio harder om de discussie te vermijden.","U zegt dat de passagier zich niet moet aanstellen.","U geeft aandacht, laat de passagier uitpraten en vat samen wat u begrijpt."],"ok":3,"why":"Goede communicatie betekent luisteren, serieus nemen en samenvatten wat de ander zegt. Onderbreken, minimaliseren of de radio harder zetten toont geen respect en verergert het conflict.","wrong":["Onderbreken toont geen respect voor de passagier.","De radio harder zetten is geen goede communicatie, u vermijdt het gesprek.","Zeggen dat iemand zich niet moet aanstellen is respectloos.",""],"bron":"CBR ET 8","hint":"Luisteren, serieus nemen, meedenken.","simpel":"Een passagier met een handicap is boos omdat de rit niet volgens afspraak is. Hoe communiceert u goed?","kern":["communicatie","passagier","boos"]},{"id":"s2-t7-k09","tak":7,"niveau":"kruipen","et":"ET 8.3","type":"mc","q":"Een passagier wordt tijdens een rit agressief en dreigt Krijger fysiek te slaan. Wat moet Krijger als eerste doen volgens de veiligheidsprotocollen?","opts":["Het risico inschatten en direct professionele hulp inroepen","Proberen de passagier fysiek te overmeesteren tijdens het rijden","De deuren op slot doen en doorrijden naar een onbekende plek","Wachten tot het vanzelf overgaat en doorrijden"],"ok":0,"why":"Bij dreigende agressie is het inschatten van het risico en het tijdig inroepen van hulp cruciaal voor de veiligheid. Zelf fysiek ingrijpen is veel te gevaarlijk en wordt afgeraden.","wrong":["","Zelf fysiek ingrijpen is gevaarlijk en wordt afgeraden.","Doorrijden naar een onbekende plek lost het probleem niet op en kan onveilig zijn.","Wachten tot agressie vanzelf overgaat is niet veilig. Je moet direct handelen."],"bron":"CBR ET 8.3 / ET 9","hint":"Schat eerst het gevaar in en schakel hulp in.","simpel":"Een passagier wordt agressief en dreigt te slaan. Wat moet Krijger eerst doen?","kern":["agressief","dreigt","eerste doen"]},{"id":"s2-t7-k12","tak":7,"niveau":"kruipen","et":"ET 8.3","type":"mc","q":"Tijdens een rit ontstaat er een woordenwisseling met een passagier over de gereden route. Krijger wil voorkomen dat dit uitdraait op een conflict. Welke beroepshouding past hierbij?","opts":["Streng je gelijk halen en deur op slot draaien","Oplossingsgericht meedenken en professioneel en neutraal blijven","De passagier negeren","Je eigen mening doordrammen"],"ok":1,"why":"Professionele communicatie kenmerkt zich door oplossingsgericht meedenken en een neutrale, kalme houding om conflicten te voorkomen.","wrong":["Streng je gelijk halen en de deur op slot draaien is niet oplossingsgericht en kan escaleren.","","De passagier negeren is onprofessioneel en lost het conflict niet op.","Je eigen mening doordrammen verergert het conflict."],"bron":"CBR ET 8","hint":"Blijf kalm als ijs en los het neutraal op.","simpel":"Er ontstaat een woordenwisseling over de route. Krijger wil geen conflict. Wat is een goede beroepshouding?","kern":["woordenwisseling","conflict","beroepshouding"]},{"id":"s2-t7-k14","tak":7,"niveau":"kruipen","et":"ET 10.1","type":"mc","q":"Waarom is een correcte en neutrale klachtenbehandeling door een taxibedrijf van groot belang voor de ondernemer?","opts":["Omdat het helpt om herhaling te voorkomen en de bedrijfsreputatie en klanttevredenheid te waarborgen","Omdat de wet verplicht dat elke klacht binnen één uur opgelost moet worden","Omdat anders de auto direct door de politie in beslag wordt genomen","Omdat het de enige manier is om subsidie te krijgen"],"ok":0,"why":"Een goede klachtenafhandeling is essentieel voor de kwaliteit van de dienstverlening, de reputatie van het bedrijf en het behouden van tevreden klanten.","wrong":["","De wet verplicht niet dat elke klacht binnen één uur wordt opgelost.","De auto wordt niet direct in beslag genomen bij een klacht.","Een goede klachtenbehandeling is niet de enige manier om subsidie te krijgen."],"bron":"CBR ET 10","hint":"Denk aan de bedrijfsreputatie en klanttevredenheid.","simpel":"Waarom is een goede klachtenbehandeling belangrijk voor een taxibedrijf?","kern":["klachtenbehandeling","belang","ondernemer"]},{"id":"s2-t7-l01","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Een passagier is boos over de ritprijs en begint te schreeuwen. Wat is de beste eerste reactie van Krijger?","opts":["Hij luistert rustig, neemt de passagier serieus en blijft neutraal.","Hij legt direct uit waarom de prijs klopt en gaat in discussie.","Hij zegt dat de passagier moet stoppen met schreeuwen en anders de taxi moet verlaten.","Hij belt meteen de politie omdat de passagier boos is."],"ok":0,"why":"Goede communicatie begint met luisteren, serieus nemen en neutraal blijven (CBR ET 8.3). Direct in discussie gaan of dreigen maakt het conflict groter. Politie bellen is pas nodig bij gevaar.","wrong":["","Direct in discussie gaan maakt het conflict groter.","Dreigen met uitstappen is niet rustig en verergert de situatie.","Politie bellen is pas nodig als er gevaar is, niet alleen bij boosheid."],"bron":"CBR ET 8.3"},{"id":"s2-t7-l02","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Een passagier wordt tijdens de rit dreigend en zegt dat Krijger moet stoppen met de meter. Wat moet Krijger eerst doen?","opts":["Hij rijdt sneller om zo snel mogelijk van de passagier af te komen.","Hij beoordeelt de situatie: hoe groot is het risico voor zijn eigen veiligheid?","Hij weigert direct en eist dat de passagier uitstapt.","Hij zegt niets en doet alsof hij de dreiging niet hoort."],"ok":1,"why":"Eerst risico inschatten: eigen veiligheid en die van anderen (CBR ET 8.3). Te snel afhandelen of negeren kan gevaarlijk worden. Uitstappen eisen kan escaleren als de situatie onveilig is.","wrong":["Sneller rijden is niet veilig en lost het probleem niet op.","","Direct eisen dat de passagier uitstapt kan de situatie laten escaleren.","De dreiging negeren kan gevaarlijk zijn."],"bron":"CBR ET 8.3"},{"id":"s2-t7-l03","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Een passagier grijpt plotseling het stuur vast. Wat is de beste actie van Krijger?","opts":["Hij duwt de passagier hard terug en rijdt door.","Hij remt hard midden op de weg om de passagier te laten schrikken.","Hij stopt op een veilige plek en roept hulp in, bijvoorbeeld via de centrale of 112.","Hij blijft doorrijden en zegt dat de passagier moet loslaten."],"ok":2,"why":"Bij direct gevaar: veilig stoppen en hulp inroepen (CBR ET 8.3). Doorrijden of schrikreacties maken de situatie onveiliger.","wrong":["Hard duwen en doorrijden is onveilig.","Hard remmen op de weg is gevaarlijk voor anderen.","","Doorrijden terwijl de passagier het stuur vasthoudt is gevaarlijk."],"bron":"CBR ET 8.3"},{"id":"s2-t7-l05","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Een andere automobilist snijdt Krijger af en maakt een boze handbeweging. Wat is de beste reactie van Krijger?","opts":["Hij blijft rustig, houdt afstand en reageert niet op de boze bestuurder.","Hij toetert lang en rijdt vlak achter de auto om te laten zien dat hij boos is.","Hij haalt de auto in en remt even af om de bestuurder te waarschuwen.","Hij stapt bij het volgende verkeerslicht uit om de bestuurder aan te spreken."],"ok":0,"why":"Blijf professioneel en neutraal; reageer niet op provocaties (CBR ET 8.3). Zelf agressief reageren of uitstappen maakt het conflict groter.","wrong":["","Toeteren en bumperkleven is agressief en gevaarlijk.","Inhalen en remmen is provocatie en onveilig.","Uitstappen om de bestuurder aan te spreken verergert het conflict."],"bron":"CBR ET 8.3"},{"id":"s2-t7-l06","tak":7,"niveau":"lopen","et":"ET 6.1","type":"mc","q":"Een passagier begint over politiek en vraagt Krijger naar zijn mening. Wat is de beste beroepshouding?","opts":["Krijger geeft uitgebreid zijn eigen politieke mening om de passagier tevreden te stellen.","Krijger geeft een neutraal antwoord en brengt het gesprek op een ander onderwerp.","Krijger zegt dat hij niet over politiek mag praten en wordt stil.","Krijger gaat de discussie aan om de passagier te overtuigen van zijn standpunt."],"ok":1,"why":"Als chauffeur blijf je neutraal en professioneel; je vermijdt discussies over gevoelige onderwerpen (CBR ET 8.3). Eigen mening geven of discussiëren past niet.","wrong":["Het geven van een eigen mening over politiek is niet professioneel en kan leiden tot discussie.","","Zeggen dat hij niet over politiek mag praten is niet klantvriendelijk; hij kan neutraal blijven zonder te zwijgen.","In discussie gaan over politiek is niet professioneel en kan het gesprek laten escaleren."],"bron":"CBR ET 8.3"},{"id":"s2-t7-l07","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Een passagier wordt tijdens de rit steeds onrustiger: hij praat luider, balt zijn vuisten en wiegt heen en weer. Wat moet Krijger doen?","opts":["Hij zet de radio harder om de passagier te kalmeren.","Hij negeert de signalen en rijdt sneller naar de bestemming.","Hij merkt de signalen op en probeert rustig te de-escaleren.","Hij vraagt de passagier meteen om uit te stappen, ook al is dat op een onveilige plek."],"ok":2,"why":"Vroege signalen van agressie herkennen en rustig reageren voorkomt escalatie (CBR ET 8.3). Negeren of hard ingrijpen kan juist gevaarlijk worden.","wrong":["Radio harder zetten negeert de signalen en kalmeert niet.","Negeren en sneller rijden is gevaarlijk.","","Meteen uitstappen op een onveilige plek is onveilig."],"bron":"CBR ET 8.3"},{"id":"s2-t7-l08","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Krijger krijgt tijdens een rit te maken met een passagier die luidkeels dreigende taal uitslaat en weigert te betalen. Wat is de eerste juiste professionele stap die Krijger moet zetten?","opts":["Direct de auto stilzetten op een veilige plek, de risico's inschatten en indien nodig hulp inroepen.","Meteen meegaan in de discussie om de passagier op diens gedrag te wijzen.","De passagier per direct midden op de snelweg uit de auto zetten om verdere escalatie te voorkomen.","De rit onmiddellijk afbreken en de politie bellen zonder de auto veilig aan de kant te zetten."],"ok":0,"why":"Krijger moet bij agressie rustig blijven, het risico inschatten en op een veilige plek hulp inroepen. Direct uitstappen op de snelweg of meegaan in een discussie vergroot het gevaar en is onprofessioneel volgens de CBR-eindtermen.","wrong":["","Meegaan in de discussie maakt de situatie erger.","Een passagier midden op de snelweg uitzetten is levensgevaarlijk en onprofessioneel.","Je moet eerst veilig aan de kant gaan staan voordat je de politie belt."],"bron":"CBR ET 8, 9->8.3, 10"},{"id":"s2-t7-l10","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Tijdens een rit merkt Krijger dat een passagier steeds geïrriteerder raakt over de vertraging door een file. Welke communicatieve benadering helpt het best om een dreigend conflict te de-escaleren?","opts":["Aandacht tonen, goed luisteren, serieus nemen en neutraal en oplossingsgericht blijven communiceren.","De passagier vertellen dat ze niet zo moeten zeuren omdat de file buiten de schuld van de chauffeur ligt.","Helemaal niets meer zeggen en de muziek extra hard aanzetten om de spanning te negeren.","Direct dreigen met uitzetting uit de taxi als de toon niet meteen verandert."],"ok":0,"why":"Goede communicatie bij dreigende conflicten vereist dat je de passagier aandacht geeft, serieus neemt, goed luistert en neutraal blijft. Meegaan in frustratie of negeren wakkert het conflict juist aan.","wrong":["","Zeggen dat de passagier niet moet zeuren is niet respectvol en verergert de irritatie.","Niets zeggen en muziek hard zetten negeert de passagier en lost niets op.","Dreigen met uitzetting maakt het conflict erger."],"bron":"CBR ET 8, 9->8.3, 10"},{"id":"s2-t7-l14","tak":7,"niveau":"lopen","et":"ET 8.1","type":"mc","q":"Hoe moet Krijger reageren als een passagier op de achterbank onredelijk klaagt over de dienstverlening, maar nog niet agressief is?","opts":["De passagier serieus nemen, actief luisteren en rustig proberen een klantvriendelijke oplossing te vinden.","De klacht direct wegwuiven omdat de passagier zich aanstelle.","De passagier sommeren om onmiddellijk uit te stappen vanwege ordeverstoring.","De rit staken en de meter door laten lopen tot de passagier zijn excuses aanbiedt."],"ok":0,"why":"Passagiers serieus nemen en actief luisteren hoort bij goede communicatie en voorkomt dat een gewone klacht uitspoelt tot een conflict. Wegwuiven of direct straffen is in strijd met de professionele beroepshouding.","wrong":["","Wegwuiven negeert de passagier en kan de klacht laten escaleren.","De passagier meteen uitzetten is een straf en past niet bij een gewone klacht; dit maakt de situatie erger.","De rit stoppen en de meter laten lopen is een straf en kan de situatie verergeren."],"bron":"CBR ET 8, 9->8.3, 10"},{"id":"s2-t7-r01","tak":7,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Dinsdag 3 november, 17:45. Tijdens de rit op de autosnelweg wordt een passagier agressief en dreigt hij Krijger. Wat moet Krijger doen?","opts":["Hij stopt direct op de vluchtstrook en zet de passagier daar uit.","Hij rijdt door naar de bestemming en negeert de passagier.","Hij stopt op een veilige plek, zoals een parkeerplaats, en belt 112 als het dreigend blijft.","Hij rijdt harder om sneller van de passagier af te zijn."],"ok":2,"why":"Eerst eigen veiligheid: stop op een veilige plek, niet op de vluchtstrook tenzij nood. Hulp inroepen als het dreigend is; negeren of harder rijden is onveilig. Bron: CBR ET 8.3/9.","wrong":["Stoppen op de vluchtstrook is onveilig, behalve bij nood.","Negeren is onveilig.","","Harder rijden is onveilig."],"bron":"CBR ET 8.3/9"},{"id":"s2-t7-r02","tak":7,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Woensdag 4 november, 12:30. Na een kleine aanrijding stapt de andere bestuurder uit en begint te schreeuwen en dreigen. Wat is de eerste stap?","opts":["Krijger geeft toe dat hij fout zit om de man te kalmeren.","Krijger blijft kalm, houdt afstand en belt 112 als hij zich bedreigd voelt.","Krijger rijdt weg omdat hij bang is.","Krijger verwijst de man naar de Geschillencommissie Zorgvervoer en Taxi."],"ok":1,"why":"Bij dreiging: eerst risico inschatten en eigen veiligheid, indien nodig 112. Weglopen na een ongeval is strafbaar; schuld toegeven of verwijzen naar een geschillencommissie is hier niet passend. Bron: CBR ET 9; WVW art. 7.","wrong":["Schuld toegeven lost de dreiging niet op.","","Wegrijden na een ongeval is strafbaar.","Verwijzen naar de Geschillencommissie is hier niet passend."],"bron":"CBR ET 9; WVW art. 7"},{"id":"s2-t7-r03","tak":7,"niveau":"rennen","et":"ET 10.1","type":"mc","q":"Donderdag 5 november, 08:20. Een passagier in een rolstoel klaagt luid over de hulp bij het instappen. Krijger voelt zich aangevallen. Wat is de beste houding?","opts":["Hij belt de Geschillencommissie om de klacht direct te melden.","Hij legt uit dat het instapbeleid van het bedrijf is en daar kan hij niets aan doen.","Hij zegt dat de passagier niet moet klagen en rustig moet zijn.","Hij luistert, toont begrip, blijft neutraal en zoekt samen naar een oplossing."],"ok":3,"why":"Goede communicatie bij klachten: aandacht geven, serieus nemen, luisteren, meedenken en neutraal blijven. Klagen verbieden of afschuiven verergert het conflict; de Geschillencommissie komt pas na de klachtenprocedure. Bron: CBR ET 8.3, 10.","wrong":["De Geschillencommissie komt pas na de klachtenprocedure.","Afschuiven op beleid verergert het conflict.","Klagen verbieden is niet klantvriendelijk.",""],"bron":"CBR ET 8.3, 10"},{"id":"s2-t7-r04","tak":7,"niveau":"rennen","et":"ET 10.1","type":"mc","q":"Vrijdag 6 november, 16:05. Een passagier heeft een klacht ingediend bij het taxibedrijf. Hij is het niet eens met de uitkomst. Waar kan hij daarna terecht?","opts":["Bij de Geschillencommissie Zorgvervoer en Taxi.","Bij de Inspectie Leefomgeving en Transport.","Bij het CBR.","Bij de Nationale ombudsman."],"ok":0,"why":"Na de klachtenprocedure van het taxibedrijf is de Geschillencommissie Zorgvervoer en Taxi de volgende stap. ILT, CBR en ombudsman zijn hier niet de juiste route. Bron: CBR ET 10.","wrong":["","De Inspectie Leefomgeving en Transport is hier niet de juiste route.","Het CBR is hier niet de juiste route.","De Nationale ombudsman is hier niet de juiste route."],"bron":"CBR ET 10"},{"id":"s2-t7-r05","tak":7,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Zaterdag 7 november, 10:15. Een fietser steekt zijn middelvinger op en schreeuwt tegen Krijger. Wat is de beste reactie?","opts":["Hij stopt, stapt uit en vraagt wat er aan de hand is.","Hij rijdt door, reageert niet op de provocatie en let op de verkeersveiligheid.","Hij toetert lang en wijst naar de verkeersregels.","Hij noteert het signalement van de fietser en belt de politie."],"ok":1,"why":"Bij provocatie door andere weggebruikers: niet reageren, kalm blijven en veilig blijven rijden. Uitstappen of lang toeteren escaleert; politie bellen kan alleen bij ernstige bedreiging. Bron: CBR ET 8.3.","wrong":["Uitstappen kan de situatie laten escaleren.","","Lang toeteren escaleert.","Politie bellen alleen bij ernstige bedreiging."],"bron":"CBR ET 8.3"},{"id":"s2-t7-r06","tak":7,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Zondag 8 november, 23:40. Een passagier stapt in en is zichtbaar dronken. Hij begint onmiddellijk te schreeuwen en slaat tegen de stoel. Wat moet Krijger doen voordat hij vertrekt?","opts":["Hij neemt de passagier mee en zet hem voorin om hem in de gaten te houden.","Hij vraagt de passagier vriendelijk om rustig te zijn en rijdt dan weg.","Hij weigert de rit, meldt dit bij de centrale en belt 112 als de passagier agressief blijft.","Hij belt eerst de Geschillencommissie om toestemming te vragen de rit te weigeren."],"ok":2,"why":"Eerst risico inschatten: bij een dreigende passagier mag je de rit weigeren en hulp inroepen. Voorin zetten of vriendelijk vragen en toch rijden is onveilig; de Geschillencommissie heeft geen rol vooraf. Bron: CBR ET 8.3/9.","wrong":["Voorin zetten is onveilig.","Vriendelijk vragen en toch rijden is onveilig.","","De Geschillencommissie heeft geen rol vooraf."],"bron":"CBR ET 8.3/9"},{"id":"s2-t7-r08","tak":7,"niveau":"rennen","et":"ET 10.1","type":"mc","q":"Een passagier is diep ongelukkig over de gereden route en de totale ritprijs. De passagier eist direct geld terug van Krijger en dreigt met stappen. Wat is de juiste officiële route voor deze klacht?","opts":["De passagier moet eerst de klachtenprocedure van het taxibedrijf doorlopen en kan daarna eventueel naar de Geschillencommissie Zorgvervoer en Taxi.","De passagier moet direct naar de Nationale Ombudsman stappen voor taxigeschillen.","Krijger moet het geld direct contant uitkeren om verdere escalatie te voorkomen.","De passagier kan uitsluitend direct een civiele procedure starten bij de kantonrechter zonder interne klacht."],"ok":0,"why":"De wettelijke en voorgeschreven route voor taxiklachten is dat een passagier zich eerst wendt tot de interne klachtenprocedure van het taxibedrijf; leidt dit niet tot een oplossing, dan is de Geschillencommissie Zorgvervoer en Taxi de volgende stap.","wrong":["","De Nationale Ombudsman is niet de juiste instantie; de Geschillencommissie Zorgvervoer en Taxi is de aangewezen stap.","Direct geld teruggeven is niet de officiële klachtenprocedure en kan onterecht zijn.","Zonder interne klacht direct naar de kantonrechter stappen is niet de voorgeschreven route."],"bron":"CBR ET 10"},{"id":"s2-t7-r09","tak":7,"niveau":"rennen","et":"ET 8.1","type":"mc","q":"Tijdens een verhit gesprek over de rijstijl blijft Krijger rustig, luistert hij goed en reageert hij neutraal. Welke beroepshouding past hier primair bij volgens de eindtermen voor communicatie?","opts":["Passief reageren en de passagier volledig negeren tot de rit voorbij is.","Professioneel, respectvol en oplossingsgericht communiceren met aandacht voor de passagier.","De discussie fel aangaan om je gelijk te halen op B1-taalniveau.","De rit onmiddellijk beëindigen en hardop de ANWB bellen."],"ok":1,"why":"Een professionele taxichauffeur toont goede communicatie door aandacht te geven, serieus te luisteren, neutraal en respectvol te blijven en oplossingsgericht te handelen om escalatie te voorkomen.","wrong":["Passief negeren is geen professionele communicatie en lost niets op.","","Fel gelijk halen is niet respectvol en kan het gesprek laten escaleren.","De rit meteen stoppen en hardop bellen is onprofessioneel en niet nodig."],"bron":"CBR ET 6 & 8"},{"id":"s2-t7-r11","tak":7,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Hoe dient Krijger te reageren wanneer een passagier tijdens de rit onverwachts verbaal agressief wordt en begint te schelden over de omleiding?","opts":["Direct meeschelden om je overwicht te tonen","Rustig blijven, het risico inschatten, niet in discussie gaan en zo nodig professionele hulp inroepen","De auto midden op de snelweg stilzetten en de passagier eruit sturen","De radio keihard aanzetten om de passagier te overstemmen"],"ok":1,"why":"Bij verbale agressie en dreigende conflicten bewaart de chauffeur de kalmte, vermijdt hij een welles-nietesdiscussie (geen discussie), schat hij het risico in en schakelt hij hulp in wanneer de situatie onveilig wordt.","wrong":["Meeschelden maakt de agressie erger en is onprofessioneel.","","Stoppen midden op de snelweg en iemand uitzetten is gevaarlijk en onprofessioneel.","De radio harder zetten negeert het probleem en lost het conflict niet op."],"bron":"CBR ET 8 & 8.3"}]}]}</script>
<script>
"use strict";
const LS='tvtKrijger2',DAY=864e5,GAPS=[1,3,7,14];
const LV={kruipen:{n:'Kruipen',e:'🐢',d:'Alle hulp: hint, simpeler zin, kernwoorden, geheugenbeeld, uitleg.'},lopen:{n:'Lopen',e:'🚶',d:'De basis: kernfeiten uit alle 7 takken, met uitleg.'},rennen:{n:'Rennen',e:'🏃',d:'Zwaarst: casussen met tijden en data, precieze getallen, meerdere goed, volgorde, invul. Timer aan.'}};
let S=Object.assign({seen:{},box:{},tak:{},et:{},hist:[],examDate:'',recall:true,bankOp:null,lvl:'lopen',takSel:0,size:10},JSON.parse(localStorage.getItem(LS)||'{}'));
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let D=null,QS=[],BY={},T={},TAB='oefen',R=null,TM=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const now=()=>Date.now();
function init(d){D=d;T=d.takken||{};QS=[];(d.sets||[]).forEach(s=>(s.vragen||[]).forEach(q=>{if(!BY[q.id]){q.set=s.id;QS.push(q);BY[q.id]=q}}));nav();go(TAB)}
function load(){fetch('questions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(init).catch(()=>{try{init(JSON.parse($('#qdata').textContent))}catch(e){$('#app').innerHTML='<p>Vragen konden niet laden.</p>'}})}
// ---------- leren van fouten ----------
function rate(o){o=o||{g:0,f:0};return (o.f+1)/(o.g+o.f+2)}
function weight(q){return .4+3*rate(S.tak[q.tak])+2*rate(S.et[q.et])+(S.box[q.id]?1.5:0)}
function wsample(arr,n){arr=arr.slice();const out=[];while(out.length<n&&arr.length){let tot=arr.reduce((s,q)=>s+weight(q),0),r=Math.random()*tot,i=0;for(;i<arr.length;i++){r-=weight(arr[i]);if(r<=0)break}if(i>=arr.length)i=arr.length-1;out.push(arr.splice(i,1)[0])}return out}
function nextGap(l){if(l<4)return now()+GAPS[l]*DAY;if(S.examDate){const e=new Date(S.examDate+'T08:00').getTime()-DAY;if(e>now())return e}return now()+30*DAY}
function due(){return QS.filter(q=>S.box[q.id]&&S.box[q.id].n<=now())}
function inBox(){return QS.filter(q=>S.box[q.id])}
function record(q,ok){const t=S.tak[q.tak]=S.tak[q.tak]||{g:0,f:0},e=S.et[q.et]=S.et[q.et]||{g:0,f:0};ok?(t.g++,e.g++):(t.f++,e.f++);
 const b=S.box[q.id];if(!ok){S.box[q.id]={l:0,n:nextGap(0),k:(b?b.k:0)+1}}else if(b&&b.n<=now()){b.l++;if(b.l>=5)delete S.box[q.id];else b.n=nextGap(b.l)}save()}
// ---------- navigatie ----------
function nav(){const it=[['oefen','🎯','Oefenen'],['leren','📚','Leren'],['reken','🧮','Rekenen'],['examen','⏱️','Examen'],['stats','📈','Voortgang']];$('#nav').innerHTML=it.map(([k,e,n])=>`<button class="${TAB==k?'on':''}" onclick="go('${k}')"><span>${e}</span>${n}</button>`).join('')}
function go(t){stopT();TAB=t;nav();R=null;({oefen:home,leren:leren,reken:rekenHome,examen:examHome,stats:stats})[t]();scrollTo(0,0)}
function stopT(){if(TM){clearInterval(TM);TM=null}}
function pool(l,t){return QS.filter(q=>!q.reken&&q.niveau==l&&(!t||q.tak==t))}
function seenKey(l){return S.seen[l]=S.seen[l]||[]}
function home(){const l=S.lvl,t=S.takSel,p=pool(l,t),sn=seenKey(l),un=p.filter(q=>!sn.includes(q.id)).length,dn=due().length,bx=inBox().length;
 let h=`<h1>TVT · Krijger</h1><div class="mu">${QS.length} vragen · ${dn} fouten nu aan de beurt · ${bx} in foutenbak</div>`;
 if(S.bankOp)h+=`<div class="banner"><b>Bank op → nieuwe set wordt gemaakt</b><div class="sm">Laatst: ${esc(LV[S.bankOp.niveau].n)}${S.bankOp.tak?' · tak '+S.bankOp.tak:''} (${esc(S.bankOp.datum)}). Nieuwe vragen verschijnen hier vanzelf zodra de set is toegevoegd.</div></div>`;
 h+=`<h2>1 · Niveau</h2>`+Object.keys(LV).map(k=>`<button class="card lvl" style="border-left-color:${k==l?'var(--ac)':'#333'};${k==l?'outline:2px solid var(--ac)':''}" onclick="S.lvl='${k}';save();home()"><b>${LV[k].e} ${LV[k].n}</b> <span class="mu">(${pool(k,0).length})</span><div class="mu">${LV[k].d}</div></button>`).join('');
 h+=`<h2>2 · Tak</h2><div>`+[0,1,2,3,4,5,6,7].map(i=>`<span class="chip ${t==i?'on':''}" onclick="S.takSel=${i};save();home()">${i?i+' '+esc(T[i].kort):'Alle 7'}</span>`).join('')+`</div>`;

 R.view=(q.type=='mc'||q.type=='multi')?shuf(q.opts.map((_,i)=>i)):null;R.sel=[];R.ordAns=[];R.done=false;R.recallTxt='';

 h+=`<div class="q">${L=='kruipen'?hl(q.q,q.kern):esc(q.q)}</div>`;
