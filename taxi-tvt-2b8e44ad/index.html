bron":"Wp2000 art. 78 lid 1"},{"id":"s1-t7-l02","tak":7,"niveau":"lopen","et":"ET 10.1","type":"mc","q":"Wat moet de taxivervoerder regelen voor geschillen over een vervoersovereenkomst?","opts":["Een geschillencommissie (al dan niet samen met andere vervoerders)","Een advocaat per klant","Niets"],"ok":0,"why":"Wp2000 77: de vervoerder voorziet in het behandelen van geschillen door instelling van een geschillencommissie.","wrong":["","Niet de regel.","Er is een plicht."],"bron":"Wp2000 art. 77 lid 1"},{"id":"s1-t7-l03","tak":7,"niveau":"lopen","et":"ET 10.1","type":"mc","q":"Neemt de Geschillencommissie een klacht in behandeling die nog niet bij de vervoerder is ingediend?","opts":["Ja, altijd","Nee, de klacht moet eerst aan de vervoerder zijn voorgelegd","Alleen als het over geld gaat"],"ok":1,"why":"KNV 14.6: een geschil wordt alleen behandeld als de klacht eerst aan de vervoerder is voorgelegd.","wrong":["Eerst het bedrijf.","","Geen onderscheid."],"bron":"KNV Algemene Voorwaarden art. 14 lid 6"},{"id":"s1-t7-l04","tak":7,"niveau":"lopen","et":"ET 10.1","type":"mc","q":"Hoe moet een klacht bij de vervoerder worden ingediend?","opts":["Volledig en duidelijk omschreven, binnen bekwame (redelijke) tijd","Alleen mondeling aan de chauffeur","Binnen 24 uur, anders vervalt hij"],"ok":0,"why":"KNV 14.1: volledig en duidelijk, binnen bekwame tijd na het ontdekken van het gebrek.","wrong":["","Niet de regel.","Geen 24-uursregel."],"bron":"KNV Algemene Voorwaarden art. 14 lid 1"},{"id":"s1-t7-l05","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Een automobilist toetert en scheldt omdat jij een passagier laat uitstappen. Wat doe je?","opts":["Uitstappen en verhaal halen","Rustig blijven, niet reageren, veilig je werk afmaken","Terugtoeteren"],"ok":1,"why":"CBR 8.3: omgaan met conflicten met andere weggebruikers: juiste beroepshouding en correcte communicatie.","wrong":["Escaleert.","","Toeteren alleen bij dreigend gevaar (RVV 28)."],"bron":"CBR exameneisen TVT 8.3"},{"id":"s1-t7-l06","tak":7,"niveau":"lopen","et":"ET 8.1","type":"mc","q":"Een passagier is boos dat je 10 minuten te laat bent. Wat is de beste reactie?","opts":["'Dat is niet mijn schuld, er was file.'","Luisteren, excuses aanbieden, uitleggen en een oplossing aanbieden","Niets zeggen en wegrijden"],"ok":1,"why":"CBR 8.1: aandacht geven, serieus nemen, luisteren, oplossingsgericht.","wrong":["Verdedigend; neemt de klacht niet serieus.","","Negeert de passagier."],"bron":"CBR exameneisen TVT 8.1"},{"id":"s1-t7-l07","tak":7,"niveau":"lopen","et":"ET 8.3","type":"mc","q":"Bij aankomst weigert een passagier te betalen en wordt dreigend. Wat doe je?","opts":["Hem vasthouden tot hij betaalt","Geen fysieke confrontatie; veilig blijven, gegevens noteren en hulp inroepen (centrale/politie)","Met hem naar een pinautomaat rijden en daar ruzie maken"],"ok":1,"why":"CBR 8.3: risico's inschatten en hulp inroepen. Je eigen veiligheid gaat voor geld.","wrong":["Gevaarlijk.","","Escaleert."],"bron":"CBR exameneisen TVT 8.3"},{"id":"s1-t7-l08","tak":7,"niveau":"lopen","et":"ET 10.1","type":"mc","q":"Wat voor uitspraak doet de Geschillencommissie Zorgvervoer en Taxi?","opts":["Een vrijblijvend advies","Een bindend advies","Een strafvonnis"],"ok":1,"why":"KNV 14.9: de beslissingen gebeuren bij wege van bindend advies.","wrong":["Het is bindend.","","Het is geen strafrechter."],"bron":"KNV Algemene Voorwaarden art. 14 lid 9"},{"id":"s1-t7-l09","tak":7,"niveau":"lopen","et":"ET 10.1","type":"mc","q":"Kan een gemeente regels maken over klachten over straattaxi's?","opts":["Nee, nooit","Ja, over indiening en behandeling van klachten over taxivervoer op de gemeentelijke openbare weg","Alleen over de prijs"],"ok":1,"why":"Wp2000 82a lid 1c: gemeentelijke regels over indienen en behandelen van klachten.","wrong":["Het kan wel.","","Prijs staat niet in 82a."],"bron":"Wp2000 art. 82a lid 1c"},{"id":"s1-t7-r01","tak":7,"niveau":"rennen","et":"ET 10.1","type":"num","q":"De klacht bij de vervoerder leidt niet tot een oplossing. Binnen hoeveel maanden na het indienen van de klacht moet het geschil bij de Geschillencommissie zijn? Typ het getal.","ok":12,"why":"KNV 14.7: uiterlijk 12 maanden na de datum waarop de klacht bij de vervoerder is ingediend.","bron":"KNV Algemene Voorwaarden art. 14 lid 7","unit":"maanden"},{"id":"s1-t7-r02","tak":7,"niveau":"rennen","et":"ET 10.1","type":"order","q":"Zet de klachtroute in de goede volgorde.","opts":["Passagier dient de klacht volledig en duidelijk in bij de vervoerder","De vervoerder probeert de klacht serieus af te handelen","Geen oplossing: de vervoerder wijst op de Geschillencommissie","Passagier legt het geschil binnen 12 maanden voor","De Geschillencommissie doet een bindend advies"],"ok":[0,1,2,3,4],"why":"KNV 14.1 → 14.2 → 14.3 → 14.7 → 14.9.","bron":"KNV Algemene Voorwaarden art. 14 · CBR ET 10.1"},{"id":"s1-t7-r03","tak":7,"niveau":"rennen","et":"ET 10.1","type":"mc","q":"Een bedrijf (zakelijke opdrachtgever) heeft een geschil met de vervoerder over een factuur. Kan het naar de Geschillencommissie Zorgvervoer en Taxi?","opts":["Ja, iedereen kan dat","Nee, de route is voor opdrachtgevers die NIET handelen in de uitoefening van een beroep of bedrijf","Alleen als het bedrijf lid is van KNV"],"ok":1,"why":"KNV 14.5: geschillen met een opdrachtgever die niet handelt in de uitoefening van beroep of bedrijf (consumenten).","wrong":["Niet voor zakelijke opdrachtgevers.","","Lidmaatschap van het bedrijf-klant speelt geen rol."],"bron":"KNV Algemene Voorwaarden art. 14 lid 5"},{"id":"s1-t7-r04","tak":7,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Een passagier veroorzaakt zoveel hinder dat je redelijkerwijs niet verder kunt rijden. Wat mag je, en hoe?","opts":["Direct op de snelweg laten uitstappen","De rit staken op een VEILIGE plek en de passagier laten uitstappen; de vervoerder hoeft geen schade te vergoeden","Doorrijden naar de bestemming, wat er ook gebeurt"],"ok":1,"why":"KNV 4.1–4.2: de vervoerder mag de rit staken en de reiziger laten uitstappen, zonder schadevergoeding. CBR 8.3: risico's inschatten – kies een veilige plek.","wrong":["Onveilig; uitstappen op een autosnelweg is gevaarlijk.","","Dat hoeft niet bij zulke hinder."],"bron":"KNV Algemene Voorwaarden art. 4 lid 1–2 · CBR ET 8.3"},{"id":"s1-t7-r05","tak":7,"niveau":"rennen","et":"ET 8.3","type":"multi","q":"Welke elementen noemt het CBR bij het voorkomen van conflicten en agressie? Kies ALLE juiste.","opts":["Juiste beroepshouding","Goede representatie","Herkennen van conflicten en agressie","Juiste inschatting van risico's","Hulp inroepen","Correcte communicatie","Harder rijden om de rit snel af te maken"],"ok":[0,1,2,3,4,5],"why":"CBR 8.3 noemt deze zes elementen.","wrong":["","","","","","","Haast is juist een risico (CBR 4.1)."],"bron":"CBR exameneisen TVT 8.3"},{"id":"s1-t7-r06","tak":7,"niveau":"rennen","et":"ET 8.1","type":"mc","q":"Na de rit zegt een passagier: 'Je bent omgereden, ik betaal niet.' Wat doe je?","opts":["Ruzie maken tot hij betaalt","Rustig de meterstand en de route uitleggen (snelste of voordeligste weg), geen discussie, en wijzen op de klachtenprocedure","Hem gratis laten gaan om van het gedoe af te zijn"],"ok":1,"why":"KNV 7.2: gunstigste weg. CBR 6.1: geen discussie. CBR 10.1: klachtenprocedure van het bedrijf.","wrong":["Escaleert.","","Hij is de ritprijs verschuldigd (KNV 5.3)."],"bron":"KNV art. 7 lid 2 · CBR ET 6.1 en 10.1"},{"id":"s1-t7-r07","tak":7,"niveau":"rennen","et":"ET 8.3","type":"mc","q":"Nacht, 02:30. Een passagier achterin wordt steeds agressiever. Wat is de beste aanpak?","opts":["Op een donkere, rustige plek stoppen en hem eruit zetten","Kalm blijven, discreet de centrale alarmeren en op een goed verlichte, drukke en veilige plek stoppen","Hard remmen om hem te laten schrikken"],"ok":1,"why":"CBR 8.3: risico's inschatten en hulp inroepen. Kies een veilige plek met mensen en licht.","wrong":["Donker en rustig is riskant voor jou.","","Gevaarlijk voor iedereen."],"bron":"CBR exameneisen TVT 8.3"},{"id":"s1-t7-r08","tak":7,"niveau":"rennen","et":"ET 7.3","type":"mc","q":"Een passagier met een andere culturele achtergrond spreekt slecht Nederlands en lijkt geïrriteerd. Wat doe je?","opts":["Harder en sneller praten","Rustig, duidelijk en eenvoudig communiceren, geduldig blijven en controleren of je elkaar begrijpt","Hem negeren tot het adres"],"ok":1,"why":"CBR 7.3: rekening houden met culturele achtergrond en taal. CBR 8.1: aandacht, luisteren, meedenken.","wrong":["Harder praten helpt niet en lijkt boos.","","Negeren is geen goede communicatie."],"bron":"CBR exameneisen TVT 7.3 en 8.1"},{"id":"s1-t7-r09","tak":7,"niveau":"rennen","et":"ET 8.3","type":"multi","q":"Een passagier valt je lastig en wordt handtastelijk. Welke uitspraken kloppen? Kies ALLE juiste.","opts":["Agressie en handtastelijkheden zijn volgens de KNV-voorwaarden verboden voor de reiziger","Je schat het risico in en roept hulp in","Je slaat terug om jezelf te verdedigen, dat is altijd het beste","Je zoekt een veilige plek om te stoppen"],"ok":[0,1,3],"why":"KNV 5.2e: de reiziger onthoudt zich van agressie en handtastelijkheden. CBR 8.3: risico inschatten, hulp inroepen.","wrong":["","","Escaleert; de-escaleren en hulp inroepen is de lijn uit CBR 8.3.",""],"bron":"CBR ET 8.3 · KNV art. 5 lid 2e"}]}]}</script>
<script>
"use strict";
const LS='tvtKrijger2',DAY=864e5,GAPS=[1,3,7,14];
const LV={kruipen:{n:'Kruipen',e:'🐢',d:'Alle hulp: hint, simpeler zin, kernwoorden, geheugenbeeld, uitleg.'},lopen:{n:'Lopen',e:'🚶',d:'De basis: kernfeiten uit alle 7 takken, met uitleg.'},rennen:{n:'Rennen',e:'🏃',d:'Zwaarst: casussen met tijden en data, precieze getallen, meerdere goed, volgorde, invul. Timer aan.'}};
let S=Object.assign({seen:{},box:{},tak:{},et:{},hist:[],examDate:'',recall:true,bankOp:null,lvl:'lopen',takSel:0,size:10},JSON.parse(localStorage.getItem(LS)||'{}'));
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let D=null,QS=[],BY={},T={},TAB='oefen',R=null,TM=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const now=()=>Date.now();
function init(d){D=d;T=d.takken||{};QS=[];(d.sets||[]).forEach(s=>(s.vragen||[]).forEach(q=>{if(!BY[q.id]){q.set=s.id;QS.push(q);BY[q.id]=q}}));nav();go(TAB)}
function load(){fetch('questions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(init).catch(()=>{try{init(JSON.parse($('#qdata').textContent))}catch(e){$('#app').innerHTML='<p>Vragen konden niet laden.</p>'}})}
// ---------- leren van fouten ----------
function rate(o){o=o||{g:0,f:0};return (o.f+1)/(o.g+o.f+2)}
function weight(q){return .4+3*rate(S.tak[q.tak])+2*rate(S.et[q.et])+(S.box[q.id]?1.5:0)}
function wsample(arr,n){arr=arr.slice();const out=[];while(out.length<n&&arr.length){let tot=arr.reduce((s,q)=>s+weight(q),0),r=Math.random()*tot,i=0;for(;i<arr.length;i++){r-=weight(arr[i]);if(r<=0)break}if(i>=arr.length)i=arr.length-1;out.push(arr.splice(i,1)[0])}return out}
function nextGap(l){if(l<4)return now()+GAPS[l]*DAY;if(S.examDate){const e=new Date(S.examDate+'T08:00').getTime()-DAY;if(e>now())return e}return now()+30*DAY}
function due(){return QS.filter(q=>S.box[q.id]&&S.box[q.id].n<=now())}
function inBox(){return QS.filter(q=>S.box[q.id])}
function record(q,ok){const t=S.tak[q.tak]=S.tak[q.tak]||{g:0,f:0},e=S.et[q.et]=S.et[q.et]||{g:0,f:0};ok?(t.g++,e.g++):(t.f++,e.f++);
 const b=S.box[q.id];if(!ok){S.box[q.id]={l:0,n:nextGap(0),k:(b?b.k:0)+1}}else if(b&&b.n<=now()){b.l++;if(b.l>=5)delete S.box[q.id];else b.n=nextGap(b.l)}save()}
// ---------- navigatie ----------
function nav(){const it=[['oefen','🎯','Oefenen'],['leren','📚','Leren'],['examen','⏱️','Examen'],['stats','📈','Voortgang']];$('#nav').innerHTML=it.map(([k,e,n])=>`<button class="${TAB==k?'on':''}" onclick="go('${k}')"><span>${e}</span>${n}</button>`).join('')}
function go(t){stopT();TAB=t;nav();R=null;({oefen:home,leren:leren,examen:examHome,stats:stats})[t]();scrollTo(0,0)}
function stopT(){if(TM){clearInterval(TM);TM=null}}
function pool(l,t){return QS.filter(q=>q.niveau==l&&(!t||q.tak==t))}
function seenKey(l){return S.seen[l]=S.seen[l]||[]}
function home(){const l=S.lvl,t=S.takSel,p=pool(l,t),sn=seenKey(l),un=p.filter(q=>!sn.includes(q.id)).length,dn=due().length,bx=inBox().length;
 let h=`<h1>TVT · Krijger</h1><div class="mu">${QS.length} vragen · ${dn} fouten nu aan de beurt · ${bx} in foutenbak</div>`;
 if(S.bankOp)h+=`<div class="banner"><b>Bank op → nieuwe set wordt gemaakt</b><div class="sm">Laatst: ${esc(LV[S.bankOp.niveau].n)}${S.bankOp.tak?' · tak '+S.bankOp.tak:''} (${esc(S.bankOp.datum)}). Nieuwe vragen verschijnen hier vanzelf zodra de set is toegevoegd.</div></div>`;
 h+=`<h2>1 · Niveau</h2>`+Object.keys(LV).map(k=>`<button class="card lvl" style="border-left-color:${k==l?'var(--ac)':'#333'};${k==l?'outline:2px solid var(--ac)':''}" onclick="S.lvl='${k}';save();home()"><b>${LV[k].e} ${LV[k].n}</b> <span class="mu">(${pool(k,0).length})</span><div class="mu">${LV[k].d}</div></button>`).join('');
 h+=`<h2>2 · Tak</h2><div>`+[0,1,2,3,4,5,6,7].map(i=>`<span class="chip ${t==i?'on':''}" onclick="S.takSel=${i};save();home()">${i?i+' '+esc(T[i].kort):'Alle 7'}</span>`).join('')+`</div>`;
 h+=`<h2>3 · Ronde</h2><div>`+[10,20].map(n=>`<span class="chip ${S.size==n?'on':''}" onclick="S.size=${n};save();home()">${n} vragen</span>`).join('')+`<span class="chip ${S.recall?'on':''}" onclick="S.recall=!S.recall;save();home()">✍️ Eerst zelf antwoorden: ${S.recall?'aan':'uit'}</span></div>`;
 h+=`<div class="mu" style="margin-top:6px">Nog ${un} van ${p.length} nieuw in deze selectie. Zwakke takken krijgen vanzelf meer vragen.</div>`;
 h+=`<button class="big" onclick="startRound()">▶ Start ronde</button><button onclick="startFouten()">🔁 Foutenronde (${dn} nu · ${bx} totaal)</button><button onclick="go('examen')">⏱️ Examen: 40 vragen · 60 min · 32 goed</button>`;
 $('#app').innerHTML=h}
function bankOp(l,t){S.bankOp={niveau:l,tak:t,datum:new Date().toLocaleDateString('nl-NL')};save();
 $('#app').innerHTML=`<div class="banner"><h2 style="margin-top:0">Bank op → nieuwe set wordt gemaakt</h2><p>Krijger, je hebt alle ${pool(l,t).length} vragen van <b>${LV[l].n}${t?' · tak '+t+' '+esc(T[t].naam):''}</b> gehad. Er wordt een nieuwe set gemaakt; die komt hier vanzelf bij.</p></div><button class="big" onclick="startFouten()">🔁 Eerst je foutenbak (${inBox().length})</button><button onclick="S.seen['${l}']=seenKey('${l}').filter(id=>!pool('${l}',${t}).some(q=>q.id==id));S.bankOp=null;save();startRound()">↺ Opnieuw door deze bank</button><button onclick="go('leren')">📚 Naar Leren</button>`}
function startRound(){const l=S.lvl,t=S.takSel,p=pool(l,t),sn=seenKey(l),un=p.filter(q=>!sn.includes(q.id));if(!un.length)return bankOp(l,t);
 const d=shuf(p.filter(q=>S.box[q.id]&&S.box[q.id].n<=now())).slice(0,Math.floor(S.size/2)),rest=wsample(un.filter(q=>!d.includes(q)),S.size-d.length);
 R={mode:'ronde',lvl:l,tak:t,list:shuf(d.concat(rest)),i:0,g:0,f:0,ans:[]};show()}
function startFouten(){let d=shuf(due());if(!d.length)d=shuf(inBox());if(!d.length){$('#app').innerHTML='<div class="card"><h2>Foutenbak is leeg 🎉</h2><p>Geen fouten om te herhalen. Doe een ronde Rennen of een examen.</p></div><button class="big" onclick="go(\'oefen\')">Terug</button>';return}
 R={mode:'fouten',lvl:null,list:d.slice(0,20),i:0,g:0,f:0,ans:[]};show()}
function startList(list,mode){R={mode:mode||'casus',lvl:null,list:list,i:0,g:0,f:0,ans:[]};TAB='oefen';nav();show()}
// ---------- vraag ----------
function hl(text,kern){let s=esc(text);(kern||[]).forEach(k=>{const e=esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>')});return s}
function lvlOf(q){return R.lvl||q.niveau}
function show(){stopT();const q=R.list[R.i];if(!q)return endRound();const L=lvlOf(q),ex=R.mode=='examen',tk=T[q.tak]||{};
 R.view=(q.type=='mc'||q.type=='multi')?shuf(q.opts.map((_,i)=>i)):null;R.sel=[];R.ordAns=[];R.done=false;R.recallTxt='';
 let h=`<div class="top"><span><span class="tag" style="background:${tk.kleur};color:#fff">Tak ${q.tak}</span>${ex?'Examen':esc(LV[L].e+' '+LV[L].n)}${R.mode=='fouten'?' · fouten':''}</span><span>${R.i+1}/${R.list.length}${ex?'':' · ✔'+R.g+' ✘'+R.f}</span><span class="timer" id="tm"></span></div>`;
 h+=`<div class="q">${L=='kruipen'?hl(q.q,q.kern):esc(q.q)}</div>`;
 if(q.type=='multi')h+=`<div class="mu">Meerdere antwoorden goed. Kies ALLE juiste en tik op Controleer.</div>`;
 if(q.type=='order')h+=`<div class="mu">Tik de onderdelen in de goede volgorde.</div>`;
 if(L=='kruipen'&&!ex){h+=`<div class="row"><button onclick="tog('ah')">💡 Hint</button><button onclick="tog('as')">🔤 Simpeler</button><button onclick="tog('am')">🧠 Beeld</button></div>
 <div id="ah" class="fb hide">💡 ${esc(q.hint||('Denk aan: '+q.et+' · '+(tk.ezel||'')))}</div><div id="as" class="fb hide">🔤 ${esc(q.simpel||q.q)}</div><div id="am" class="station hide">${stationHtml(q.tak)}</div>`}
 const recall=S.recall&&!ex&&q.type!='num'&&L!='kruipen'?1:(S.recall&&!ex&&q.type!='num'&&L=='kruipen'?1:0);
 if(recall)h+=`<div id="rc" class="card"><div class="mu">✍️ Eerst uit je hoofd: wat is het antwoord? (actief ophalen)</div><textarea id="rct" placeholder="Typ of zeg het hardop…"></textarea><button class="big" onclick="R.recallTxt=$('#rct').value;$('#rc').remove();$('#opts').classList.remove('hide')">Toon de opties</button></div>`;
 h+=`<div id="opts" class="${recall?'hide':''}">${optsHtml(q)}</div><div id="fb"></div>`;
 $('#app').innerHTML=h;scrollTo(0,0);
 if(ex)examTick();else if(L=='rennen'){R.left=q.type=='mc'?75:100;tick();TM=setInterval(tick,1000)}}
function tog(id){$('#'+id).classList.toggle('hide')}
function optsHtml(q){if(q.type=='mc')return R.view.map((oi,k)=>`<button class="opt" id="o${oi}" onclick="pick(${oi})"><b>${'ABCDEFG'[k]})</b> ${esc(q.opts[oi])}</button>`).join('');
 if(q.type=='multi')return R.view.map((oi,k)=>`<button class="opt" id="o${oi}" onclick="msel(${oi})">☐ ${esc(q.opts[oi])}</button>`).join('')+`<button class="big" id="chk" onclick="mcheck()">Controleer</button>`;
 if(q.type=='num')return `<input type="number" inputmode="decimal" id="num" placeholder="getal"> <span class="mu">${esc(q.unit||'')}</span><button class="big" id="chk" onclick="ncheck()">Controleer</button>`;
 if(q.type=='order'){R.ordShuf=shuf(q.opts.map((_,i)=>i));return `<div class="mu">Jouw volgorde:</div><ol id="oa" class="ans"></ol><div class="ord" id="op">${R.ordShuf.map(i=>`<button id="r${i}" onclick="oadd(${i})">${esc(q.opts[i])}</button>`).join('')}</div><div class="row"><button onclick="oreset()">↺ Opnieuw</button><button class="big" id="chk" onclick="ocheck()">Controleer</button></div>`}return''}
function tick(){const el=$('#tm');if(!el)return stopT();el.textContent='⏱ '+R.left+'s';el.classList.toggle('warn',R.left<=15);if(R.left--<=0){stopT();timeout()}}
function timeout(){const q=R.list[R.i];if(R.done)return;finish(q,false,'⏱ tijd op')}
function pick(oi){const q=R.list[R.i];if(R.done)return;if(R.mode=='examen'){R.sel=[oi];document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));$('#o'+oi).classList.add('sel');examNextBtn();return}finish(q,oi===q.ok,q.opts[oi],[oi])}
function msel(oi){if(R.done)return;const i=R.sel.indexOf(oi);i<0?R.sel.push(oi):R.sel.splice(i,1);const b=$('#o'+oi);b.classList.toggle('sel');b.innerHTML=(i<0?'☑ ':'☐ ')+esc(R.list[R.i].opts[oi]);if(R.mode=='examen')examNextBtn()}
function mcheck(){const q=R.list[R.i];const a=R.sel.slice().sort().join(),b=q.ok.slice().sort().join();finish(q,a===b,R.sel.map(i=>q.opts[i]).join(' + ')||'(niets)',R.sel)}
function ncheck(){const q=R.list[R.i];const v=parseFloat(String($('#num').value).replace(',','.'));finish(q,v===q.ok,isNaN(v)?'(leeg)':String(v))}
function oadd(i){if(R.done||R.ordAns.includes(i))return;R.ordAns.push(i);$('#r'+i).disabled=true;$('#r'+i).style.opacity=.35;$('#oa').innerHTML=R.ordAns.map(j=>`<li>${esc(R.list[R.i].opts[j])}</li>`).join('');if(R.mode=='examen')examNextBtn()}
function oreset(){if(R.done)return;R.ordAns=[];document.querySelectorAll('#op button').forEach(b=>{b.disabled=false;b.style.opacity=1});$('#oa').innerHTML=''}
function ocheck(){const q=R.list[R.i];finish(q,R.ordAns.length==q.opts.length&&R.ordAns.every((v,k)=>v===k),R.ordAns.map(i=>q.opts[i]).join(' → '))}
function finish(q,ok,given,sel){stopT();R.done=true;ok?R.g++:R.f++;R.ans.push({id:q.id,ok:ok,given:given});record(q,ok);
 if(R.mode=='ronde'){const sn=seenKey(q.niveau);if(!sn.includes(q.id))sn.push(q.id);save()}
 document.querySelectorAll('#opts button').forEach(b=>b.disabled=true);
 if(q.type=='mc'||q.type=='multi'){const okSet=q.type=='mc'?[q.ok]:q.ok;q.opts.forEach((_,i)=>{const b=$('#o'+i);if(!b)return;if(okSet.includes(i))b.classList.add('ok');else if((sel||[]).includes(i))b.classList.add('no')})}
 $('#fb').innerHTML=fbHtml(q,ok,given)+`<button class="big" onclick="R.i++;show()">Volgende ›</button>`;$('#fb').scrollIntoView({behavior:'smooth',block:'start'})}
function correctTxt(q){if(q.type=='mc')return q.opts[q.ok];if(q.type=='multi')return q.ok.map(i=>q.opts[i]).join(' + ');if(q.type=='order')return q.opts.join(' → ');return q.ok+' '+(q.unit||'')}
function fbHtml(q,ok,given,noStation){let h=`<div class="fb"><div class="res ${ok?'ok':'no'}">${ok?'✔ JUIST':'✘ ONJUIST'}</div>`;
 if(!ok)h+=`<div class="sm">Jij: ${esc(given)}</div><div><b>Goed:</b> ${esc(correctTxt(q))}</div>`;
 if(R&&R.recallTxt)h+=`<div class="sm mu">Je eigen antwoord vooraf: “${esc(R.recallTxt)}” – klopte dat?</div>`;
 h+=`<p>${esc(q.why)}</p><div><span class="tag">📎 ${esc(q.bron)}</span><span class="tag">${esc(q.et)}</span></div>`;
 if(q.wrong&&(q.type=='mc'||q.type=='multi')){const okSet=q.type=='mc'?[q.ok]:q.ok;h+=`<h3>Eliminatie-check</h3>`+q.opts.map((o,i)=>`<div class="el">${okSet.includes(i)?'<b style="color:#4ade80">✔</b>':'<b style="color:#f87171">✘</b>'}${esc(o)}${!okSet.includes(i)&&q.wrong[i]?'<div class="mu">→ '+esc(q.wrong[i])+'</div>':''}</div>`).join('')}
 if(!ok&&!noStation)h+=`<details><summary>🧠 Geheugenbeeld voor deze tak</summary>${stationHtml(q.tak)}</details>`;
 return h+`</div>`}
function stationHtml(t){const s=(T[t]||{}).station||{};return `<div><b>Station ${s.nr} · ${esc(s.plek)}</b> – „${esc(s.zin)}”</div><p><em>${esc(s.beeld)}</em></p><div class="sm"><b>Kern:</b> ${esc(s.kern)}</div>`}
function endRound(){stopT();const n=R.list.length,pct=Math.round(100*R.g/n);let h=`<div class="card"><h2>Klaar: ${R.g} goed / ${R.f} fout (${pct}%)</h2><div class="mu">${pct>=80?'Op examenniveau (≥ 80%). Sterk, Krijger.':'Onder de 80%: je fouten staan in de foutenbak en komen terug op +1 · +3 · +7 · +14 dagen · vlak voor het examen.'}</div></div>`;
 const wr=R.ans.filter(a=>!a.ok).map(a=>BY[a.id]);if(wr.length)h+=`<h3>Foutenbak deze ronde</h3>`+wr.map(q=>`<div class="el"><span class="tag" style="background:${T[q.tak].kleur};color:#fff">T${q.tak}</span>${esc(q.q)}<div class="mu">→ ${esc(correctTxt(q))} · ${esc(q.bron)}</div></div>`).join('');
 const tk=wr.length?wr[0].tak:(R.list[0]||{}).tak;if(tk)h+=`<div class="card"><b>Vrij ophalen:</b> ${esc(T[tk].recall)}<textarea placeholder="Uit je hoofd…"></textarea></div>`;
 if(R.mode=='ronde'){const p=pool(R.lvl,R.tak),sn=seenKey(R.lvl);if(!p.some(q=>!sn.includes(q.id))){S.bankOp={niveau:R.lvl,tak:R.tak,datum:new Date().toLocaleDateString('nl-NL')};save();h+=`<div class="banner"><b>Bank op → nieuwe set wordt gemaakt</b><div class="sm">Alle vragen van deze selectie gehad.</div></div>`}}
 h+=`<button class="big" onclick="${R.mode=='fouten'?'startFouten()':'startRound()'}">Nog een ronde</button><button onclick="go('oefen')">Menu</button>`;$('#app').innerHTML=h}
// ---------- examen ----------
function examHome(){const hs=S.hist.slice(-5).reverse();$('#app').innerHTML=`<h1>Proefexamen TVT</h1><div class="card">40 vragen · 60 minuten · geslaagd bij 32 goed (80%). Geen uitleg tijdens het examen; daarna alles met Eliminatie-check. Vragen uit Lopen + Rennen, verdeeld over alle 7 takken. <div class="mu">Bron: CBR TVT + exameneisen vanaf 1-9-2025 · uitslag 1 jaar geldig.</div></div><button class="big" onclick="startExam()">▶ Start examen</button>${hs.length?'<h3>Laatste examens</h3>'+hs.map(x=>`<div class="el">${esc(x.d)} · <b>${x.s}/40</b> ${x.s>=32?'✔ geslaagd':'✘ gezakt'}</div>`).join(''):''}`}
function startExam(){const V=(D.examen||{}).verdeling||{1:5,2:9,3:7,4:6,5:4,6:5,7:4};let list=[];Object.keys(V).forEach(t=>{let p=QS.filter(q=>q.tak==t&&q.niveau!='kruipen');if(p.length<V[t])p=QS.filter(q=>q.tak==t);list=list.concat(wsample(p,V[t]))});
 while(list.length<40){const r=QS.filter(q=>!list.includes(q));if(!r.length)break;list.push(r[Math.floor(Math.random()*r.length)])}
 R={mode:'examen',lvl:null,list:shuf(list).slice(0,40),i:0,g:0,f:0,ans:[],end:now()+60*60*1000,resp:{}};show()}
function examTick(){stopT();const f=()=>{const el=$('#tm'),l=Math.max(0,R.end-now());if(el){const m=Math.floor(l/60000),s=Math.floor(l/1000)%60;el.textContent='⏱ '+m+':'+String(s).padStart(2,'0');el.classList.toggle('warn',l<5*60000)}if(l<=0){stopT();examEnd()}};f();TM=setInterval(f,1000);
 const q=R.list[R.i];document.querySelectorAll('#chk').forEach(b=>b.remove());if(q.type=='num')$('#num').oninput=examNextBtn;examNextBtn()}
function examNextBtn(){let b=$('#exn');if(!b){$('#fb').innerHTML=`<button class="big" id="exn" onclick="examSave()">${R.i+1<R.list.length?'Volgende ›':'Inleveren'}</button><button onclick="if(confirm('Examen nu inleveren?')){examSave(true)}">Inleveren</button>`}}
function examSave(stop){const q=R.list[R.i];let ok=false,given='(leeg)';
 if(q.type=='mc'){ok=R.sel[0]===q.ok;given=R.sel.length?q.opts[R.sel[0]]:given}
 else if(q.type=='multi'){ok=R.sel.slice().sort().join()===q.ok.slice().sort().join();given=R.sel.map(i=>q.opts[i]).join(' + ')||given}
 else if(q.type=='num'){const v=parseFloat(String(($('#num')||{}).value||'').replace(',','.'));ok=v===q.ok;given=isNaN(v)?given:String(v)}
 else if(q.type=='order'){ok=R.ordAns.length==q.opts.length&&R.ordAns.every((v,k)=>v===k);given=R.ordAns.map(i=>q.opts[i]).join(' → ')||given}
 R.resp[q.id]={ok,given};R.i++;if(stop||R.i>=R.list.length)examEnd();else show()}
function examEnd(){stopT();if(R.ended)return;R.ended=true;let g=0;R.list.forEach(q=>{const a=R.resp[q.id]||{ok:false,given:'(niet beantwoord)'};if(a.ok)g++;record(q,a.ok)});
 S.hist.push({d:new Date().toLocaleString('nl-NL',{dateStyle:'short',timeStyle:'short'}),s:g});save();
 const per={};R.list.forEach(q=>{per[q.tak]=per[q.tak]||[0,0];per[q.tak][1]++;if((R.resp[q.id]||{}).ok)per[q.tak][0]++});
 let h=`<div class="card"><h2>${g>=32?'✔ GESLAAGD':'✘ GEZAKT'} · ${g}/40</h2><div class="mu">Nodig: 32. Fouten gaan naar de foutenbak.</div>${Object.keys(per).map(t=>`<div class="sm">Tak ${t} ${esc(T[t].kort)}: ${per[t][0]}/${per[t][1]}</div>`).join('')}</div><h3>Nakijken</h3>`;
 R.recallTxt='';h+=R.list.map((q,i)=>{const a=R.resp[q.id]||{ok:false,given:'(niet beantwoord)'};return `<details ${a.ok?'':'open'}><summary>${a.ok?'✔':'✘'} ${i+1}. ${esc(q.q)}</summary>${fbHtml(q,a.ok,a.given,true)}</details>`}).join('');
 h+=`<button class="big" onclick="startFouten()">🔁 Foutenronde</button><button onclick="go('examen')">Terug</button>`;$('#app').innerHTML=h;scrollTo(0,0)}
// ---------- leren ----------
let LT=1,LS2='spiek',FC=null;
function leren(){const t=T[LT];const subs=[['spiek','Spiekbrief'],['brok','7 brokken'],['mind','Mindmap'],['reis','Reisstation'],['flash','Flashcards'],['teach','Uitleggen'],['casus','Casussen'],['ezel','Ezelsbrug']];
 let h=`<h1>Leren</h1><div>`+[1,2,3,4,5,6,7].map(i=>`<span class="chip ${LT==i?'on':''}" onclick="LT=${i};FC=null;leren()">${i} ${esc(T[i].kort)}</span>`).join('')+`</div><div class="card" style="border-top:5px solid ${t.kleur}"><b>Tak ${LT} · ${esc(t.naam)}</b> <span class="mu">${esc(t.et)}</span></div><div>`+subs.map(([k,n])=>`<span class="chip ${LS2==k?'on':''}" onclick="LS2='${k}';leren()">${n}</span>`).join('')+`</div><div id="lc"></div>`;
 $('#app').innerHTML=h;$('#lc').innerHTML=({spiek:lSpiek,brok:lBrok,mind:lMind,reis:lReis,flash:lFlash,teach:lTeach,casus:lCasus,ezel:lEzel})[LS2](t)}
function shade(c,i){return `linear-gradient(135deg,${c},${c}cc)`}
function lSpiek(t){return `<div class="cheat">`+t.cheat.map((c,i)=>`<div style="background:${shade(t.kleur,i)}"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`).join('')+`</div><p class="mu sm">Elk getal komt uit de bron die bij de vragen staat. Maak er een screenshot van voor onderweg (alleen bij stilstand lezen).</p>`}
function lBrok(t){return `<div class="card"><b>Eerst vrij ophalen:</b> ${esc(t.recall)}<textarea placeholder="Uit je hoofd…"></textarea><button class="big" onclick="$('#bk').classList.remove('hide');this.remove()">Toon de 7 brokken</button></div><div id="bk" class="hide">`+t.chunks.map((c,i)=>`<div class="chunk"><i style="background:${t.kleur};color:#fff">${i+1}</i><div>${esc(c)}</div></div>`).join('')+`</div>`}
function lMind(t){const n=t.mind.length;let h=`<div class="mm"><div class="c" style="background:${t.kleur};color:#fff">${esc(t.kort)}</div>`;t.mind.forEach((m,i)=>{const a=(-90+i*360/n)*Math.PI/180,x=50+38*Math.cos(a),y=50+38*Math.sin(a);h+=`<div class="l" style="width:38%;background:${t.kleur};transform:rotate(${-90+i*360/n}deg)"></div><div class="b" style="left:${x}%;top:${y}%;border-color:${t.kleur}">${esc(m)}</div>`});return h+`</div><p class="mu sm">Teken hem zelf na: eerst het midden, dan met de klok mee. Eén woord per tak.</p>`}
function lReis(t){return `<div class="station">${stationHtml(LT)}</div><p class="mu sm">O'Brien: Verbeelding + Associatie + Locatie = Geheugen. Leg dit station op je eigen vaste rit en zeg het hardop als je erlangs rijdt.</p><div class="card"><b>Hele reis in één adem:</b> <em>Papieren vliegen, de handschoen wint van rood, de koekoek roept vijftien, de borden praten, de pan zegt PAMAN, de vlinder fluistert handsfree, het ijsblok wijst twee deuren.</em></div>`}
function lEzel(t){return `<div class="card" style="font-size:19px">${esc(t.ezel)}</div>`}
function fcDeck(){const qs=QS.filter(q=>q.tak==LT&&q.type!='order').map(q=>({f:q.q,b:correctTxt(q)+'\n📎 '+q.bron,id:q.id}));const ch=T[LT].cheat.map(c=>({f:'Wat hoort bij: '+c[0]+' ?',b:c[1]}));return shuf(ch.concat(qs))}
function lFlash(){if(!FC)FC={deck:fcDeck(),i:0,k:0,n:0};const c=FC.deck[FC.i%FC.deck.length];return `<div class="mu">Kaart ${FC.i+1} · wist ik ${FC.k} · nog niet ${FC.n}</div><div class="flip" id="fl" onclick="this.classList.toggle('f')"><div class="in"><div class="fa">${esc(c.f)}</div><div class="ba" style="white-space:pre-line">${esc(c.b)}</div></div></div><div class="mu sm">Tik op de kaart om te draaien. Eerst hardop antwoorden!</div><div class="row"><button onclick="fcN(1)">✔ Wist ik</button><button onclick="fcN(0)">✘ Nog niet</button></div>`}
function fcN(k){const c=FC.deck[FC.i%FC.deck.length];if(k)FC.k++;else{FC.n++;if(c.id){const q=BY[c.id];S.box[q.id]={l:0,n:nextGap(0),k:((S.box[q.id]||{}).k||0)+1};save()}}FC.i++;$('#lc').innerHTML=lFlash()}
function lTeach(t){return `<div class="card"><b>Leg het uit (teach-back):</b> ${esc(t.teach)}<textarea placeholder="Schrijf of spreek je uitleg in (spraakknop op je toetsenbord)…" style="min-height:130px"></textarea></div><div class="card"><b>Check daarna: heb je dit genoemd?</b>`+t.check.map(c=>`<label style="display:block;margin:6px 0"><input type="checkbox"> ${esc(c)}</label>`).join('')+`</div>`}
function lCasus(t){const cs=QS.filter(q=>q.tak==LT&&q.niveau=='rennen');window._cs=cs;return `<button class="big" onclick="startList(shuf(window._cs),'casus')">▶ Oefen alle ${cs.length} casussen van deze tak</button>`+cs.map((q,i)=>`<div class="el"><b>${i+1}.</b> ${esc(q.q)} <span class="tag">${esc(q.bron)}</span></div>`).join('')}
// ---------- voortgang ----------
function stats(){const ets=Object.keys(S.et).map(k=>[k,S.et[k],rate(S.et[k])]).filter(x=>x[1].g+x[1].f>=2).sort((a,b)=>b[2]-a[2]).slice(0,5);
 let h=`<h1>Voortgang</h1><div class="card"><b>Per tak</b>`+[1,2,3,4,5,6,7].map(i=>{const o=S.tak[i]||{g:0,f:0},n=o.g+o.f,p=n?Math.round(100*o.g/n):0;return `<div style="margin:8px 0"><div class="sm">${i} ${esc(T[i].naam)} · ${n?p+'% ('+o.g+'/'+n+')':'nog niet geoefend'}</div><div class="bar"><i style="width:${p}%;background:${T[i].kleur}"></i></div></div>`}).join('')+`</div>`;
 h+=`<div class="card"><b>Zwakste onderwerpen</b> <span class="mu">(krijgen vanzelf meer vragen)</span>${ets.length?ets.map(x=>`<div class="sm">${esc(x[0])}: ${x[1].g} goed / ${x[1].f} fout</div>`).join(''):'<div class="mu sm">Nog te weinig data.</div>'}</div>`;
 h+=`<div class="card"><b>Foutenbak</b>: ${inBox().length} vragen · ${due().length} nu aan de beurt<div class="mu sm">Ritme: +1 · +3 · +7 · +14 dagen · vlak voor het examen (examendatum hieronder). Na de 5e goede herhaling gaat een vraag eruit.</div><label class="sm">Examendatum TVT: <input type="date" value="${esc(S.examDate)}" onchange="S.examDate=this.value;save()"></label></div>`;
 const c={};QS.forEach(q=>{c[q.niveau]=(c[q.niveau]||0)+1});h+=`<div class="card sm"><b>Vragenbank</b>: ${QS.length} vragen in ${(D.sets||[]).length} set(s) · Kruipen ${c.kruipen||0} · Lopen ${c.lopen||0} · Rennen ${c.rennen||0}<br>Bijgewerkt: ${esc(D.bijgewerkt||'')}</div>`;
 h+=`<button onclick="if(confirm('Alle voortgang wissen?')){localStorage.removeItem(LS);location.reload()}">🗑 Voortgang wissen</button>`;$('#app').innerHTML=h}
load();
</script></body></html>
