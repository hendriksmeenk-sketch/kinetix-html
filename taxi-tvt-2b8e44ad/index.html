"s2-t1-r07","tak":1,"niveau":"rennen","et":"ET 1.3","type":"mc","q":"Krijger werkt als chauffeur in loondienst. Zijn werkgever informeert hem over het uitlezen van de chauffeurskaart en het bewaren van de BCT/CDT-gegevens. Wat zijn de wettelijke termijnen voor het downloaden van de kaart en het bewaren van deze gegevens door de ondernemer?","opts":["De kaart moet minimaal elke 12 weken worden uitgelezen, en de ondernemer bewaart de gegevens 1 jaar.","De kaart moet minimaal elke 5 weken worden uitgelezen, en de ondernemer bewaart de gegevens 2 jaar.","De kaart moet minimaal elke week worden uitgelezen, en de ondernemer bewaart de gegevens 5 jaar.","De kaart hoeft pas te worden uitgelezen als de kaart verloopt na 5 jaar, en bewaren is niet verplicht."],"ok":1,"why":"De chauffeurskaart moet minimaal elke 5 weken worden gedownload (uitgelezen). De taxiondernemer is wettelijk verplicht de BCT/CDT-gegevens minimaal 2 jaar te bewaren voor controle door instanties zoals de ILT.","wrong":["Elke 12 weken is te laat; het moet elke 5 weken. Bewaren 1 jaar is te kort; het moet 2 jaar.","","Elke week uitlezen is niet verplicht, en 5 jaar bewaren is niet de wettelijke termijn; het is 2 jaar.","De kaart moet elke 5 weken worden uitgelezen, niet pas na 5 jaar. Bewaren is verplicht, minimaal 2 jaar."],"bron":"CBR ET 1.3 / ILT BCT/CDT"},{"id":"s2-t1-r09","tak":1,"niveau":"rennen","et":"ET 1.3","type":"mc","q":"Een taxibedrijf bereidt zich voor op de overgang van de BCT naar de CDT (Centrale Database Taxivervoer). Welke regel geldt er voor de keuze tussen het gebruik van de BCT en de CDT tijdens de overgangsperiode tot 1 januari 2028?","opts":["Een chauffeur mag tijdens een lopende rit willekeurig wisselen tussen de BCT en de CDT.","Tot 1 januari 2028 is de CDT verboden en mag uitsluitend de oude BCT worden gebruikt.","Vanaf 1 september 2025 is de BCT reeds volledig afgeschaft en is alleen CDT nog toegestaan.","Een chauffeur kan per dag kiezen om via de BCT of via een CDT-middel te registreren; wisselen tijdens dezelfde dag is niet toegestaan."],"ok":3,"why":"Tot 1 januari 2028 geldt een overgangsperiode. In die periode mag de chauffeur per dag een ander registratiemiddel gebruiken (BCT of CDT-middel). Vanaf 1 januari 2028 is alleen een CDT-middel toegestaan. De optie 'wisselen tijdens een lopende rit' is onjuist.","wrong":["Wisselen tijdens een lopende rit is niet toegestaan; je kiest per dag.","De CDT is niet verboden; tot 2028 mag je per dag kiezen.","De BCT is niet afgeschaft vanaf 1 september 2025; de overgangsperiode loopt tot 1 januari 2028.",""],"bron":"ILT registreren taxi / CBR ET 1"},{"id":"s2-t1-r10","tak":1,"niveau":"rennen","et":"ET 1.3","type":"mc","q":"Krijger neemt om 15:00 het voertuig over van een collega. De collega is gehaast uitgestapt en heeft zijn chauffeurskaart in de BCT/CDT laten zitten. Krijger moet direct vertrekken naar zijn eerste klant. Wat moet Krijger doen?","opts":["Krijger mag de eerste 2 uur op de kaart van zijn collega rijden, mits hij achteraf handmatig zijn eigen naam invult.","Krijger moet de kaart van de collega verwijderen en altijd inloggen met zijn eigen persoonlijke chauffeurskaart voor hij gaat rijden.","Krijger rijdt zonder kaart en voert alleen zijn personeelsnummer in op het scherm van de BCT/CDT.","Krijger plaatst zijn eigen kaart in sleuf 2 van de BCT, terwijl de kaart van de collega in sleuf 1 blijft zitten."],"ok":1,"why":"Een chauffeur dient ALTIJD met zijn eigen persoonlijke chauffeurskaart in te loggen op het systeem. Rijden op de kaart van een ander of zonder kaart is een ernstige overtreding.","wrong":["Rijden op de kaart van een collega is een ernstige overtreding, ook voor 2 uur.","","Rijden zonder kaart is een ernstige overtreding; hij moet zijn eigen kaart gebruiken.","De kaart van de collega moet eerst verwijderd worden; je gebruikt alleen je eigen kaart."],"bron":"CBR ET 1 / Bp2000"},{"id":"s2-t2-k01","tak":2,"niveau":"kruipen","et":"ET 2.2","type":"mc","q":"Op de N-weg staat een vast wit bord maximumsnelheid 80 km/h. Daarboven hangt een tijdelijk geel bord 50 km/h vanwege wegwerkzaamheden. Welke snelheid geldt voor Krijger?","opts":["50 km/h","80 km/h","100 km/h","130 km/h"],"ok":0,"why":"Een tijdelijk geel verkeersbord gaat boven een vast wit bord. Daarom geldt hier 50 km/h. 80 km/h is de vaste snelheid, maar die is tijdelijk verlaagd.","wrong":["","80 km/h geldt alleen zonder het tijdelijke bord; nu is 50 km/h de maximumsnelheid.","100 km/h is niet van toepassing; het tijdelijke bord verlaagt naar 50 km/h.","130 km/h is niet van toepassing; het tijdelijke bord verlaagt naar 50 km/h."],"bron":"RVV 1990 art. 63a en 84","hint":"Gele borden winnen van vaste.","simpel":"Er is een vast bord 80. Er is ook een tijdelijk bord 50. Welke snelheid geldt?","kern":["tijdelijk bord","50 km/h"]},{"id":"s2-t2-k02","tak":2,"niveau":"kruipen","et":"ET 2.1","type":"mc","q":"Krijger ergert zich aan een fietser en snijdt hem af, waardoor de fietser moet uitwijken. Welk artikel van de Wegenverkeerswet 1994 overtreedt hij?","opts":["Artikel 7","Artikel 8","Artikel 6","Artikel 5"],"ok":3,"why":"Artikel 5 verbiedt gevaarlijk of hinderlijk weggedrag. Artikel 6 gaat over schuld aan een ongeval, artikel 7 over doorrijden na een ongeval en artikel 8 over alcohol en drugs.","wrong":["Artikel 7 gaat over doorrijden na een ongeval, niet over hinderlijk gedrag.","Artikel 8 gaat over alcohol en drugs, niet over hinderlijk gedrag.","Artikel 6 gaat over schuld aan een ongeval, niet over hinderlijk gedrag.",""],"bron":"WVW 1994 art. 5","hint":"Artikel 5: veiligheidsbeginsel.","simpel":"Krijger snijdt een fietser af. Welk artikel van de Wegenverkeerswet overtreedt hij?","kern":["afsnijden","artikel 5"]},{"id":"s2-t2-k03","tak":2,"niveau":"kruipen","et":"ET 2.1","type":"mc","q":"Krijger rijdt op een parkeerplaats tegen een geparkeerde auto. Er is niemand in de buurt. Wat moet hij volgens de Wegenverkeerswet doen?","opts":["Hij moet stoppen en zijn gegevens achterlaten","Hij mag doorrijden als er niemand is","Hij mag doorrijden als de schade klein is","Hij moet altijd op de politie wachten"],"ok":0,"why":"Artikel 7 verbiedt doorrijden na een ongeval met schade. Krijger moet stoppen en zijn identiteit kenbaar maken. Doorrijden is strafbaar, ook bij kleine schade.","wrong":["","Doorrijden na een ongeval is strafbaar, ook als er niemand is.","Doorrijden mag niet, ook niet bij kleine schade.","Hij hoeft niet altijd op de politie te wachten; gegevens achterlaten mag ook."],"bron":"WVW 1994 art. 7","hint":"Artikel 7: niet doorrijden na een ongeval.","simpel":"Krijger rijdt tegen een geparkeerde auto. Er is niemand. Wat moet hij doen?","kern":["ongeval","stoppen","gegevens achterlaten"]},{"id":"s2-t2-k04","tak":2,"niveau":"kruipen","et":"ET 2.1","type":"mc","q":"Krijger wil met een kater gaan rijden. Wanneer is hij strafbaar op grond van artikel 8 WVW 1994?","opts":["Alleen als hij een ongeluk veroorzaakt","Als hij onder invloed van alcohol of drugs een voertuig bestuurt","Alleen als de politie hem staande houdt","Als hij meer dan twee glazen heeft gedronken"],"ok":1,"why":"Artikel 8 verbiedt het besturen van een voertuig onder invloed van alcohol of drugs. Een ongeluk is niet nodig; de strafbaarheid ontstaat al door het besturen. De hoeveelheid glazen is niet bepalend.","wrong":["Een ongeluk is niet nodig; het besturen is al strafbaar.","","De politie hoeft hem niet staande te houden; het besturen is al strafbaar.","Het aantal glazen is niet bepalend."],"bron":"WVW 1994 art. 8","hint":"Artikel 8: niets drinken en rijden.","simpel":"Krijger heeft een kater. Hij wil rijden. Wanneer is hij strafbaar volgens artikel 8 WVW 1994?","kern":["artikel 8 WVW","kater","strafbaar"]},{"id":"s2-t2-k06","tak":2,"niveau":"kruipen","et":"ET 2.2","type":"mc","q":"Krijger rijdt op een weg waar wegwerkzaamheden bezig zijn. Er staat een vast bord 'Voorrangsweg', maar er is ook een tijdelijk geel bord geplaatst dat verplicht om voorrang te verlenen. Wat moet Krijger doen?","opts":["Krijger moet voorrang verlenen, want het tijdelijke gele bord gaat boven het vaste bord.","Krijger heeft voorrang, want een vast bord geldt altijd boven een tijdelijk geel bord.","Krijger moet stoppen en wachten op een verkeersregelaar.","Krijger mag de regel van rechts voorrang toepassen."],"ok":0,"why":"Tijdelijke verkeerstekens (zoals gele borden bij werkzaamheden) gaan boven vaste verkeerstekens op het wegdek of langs de weg. Krijger moet dus het tijdelijke gele bord opvolgen.","wrong":["","Een vast bord geldt niet altijd boven een tijdelijk bord; het tijdelijke gele bord gaat juist boven.","Er is geen verkeersregelaar genoemd; hij moet het bord volgen en voorrang verlenen.","De regel rechts voorrang geldt niet als er borden zijn; het tijdelijke bord verplicht voorrang verlenen."],"bron":"RVV 63a","hint":"Tijdelijke (gele) borden winnen het altijd van vaste borden.","simpel":"Krijger ziet een vast bord 'Voorrangsweg' en een tijdelijk geel bord 'voorrang verlenen'. Wat moet hij doen?","kern":["tijdelijk bord","voorrang verlenen"]},{"id":"s2-t2-k07","tak":2,"niveau":"kruipen","et":"ET 7.1","type":"mc","q":"Een passagier van 9 jaar oud met een lengte van 1,28 meter stapt in bij Krijger. Er is geen kinderzitje aanwezig in de taxi. Hoe moet Krijger dit kind vervoeren?","opts":["Het kind mag voorin zitten, mits de autogordel goed vastzit.","Het kind moet achterin zitten met de autogordel om.","Het kind mag absoluut niet mee in de taxi zonder kinderzitje.","Het kind moet achterin op schoot zitten bij een volwassene."],"ok":1,"why":"In een taxi mogen kinderen jonger dan 18 jaar en korter dan 1,35 meter zonder kinderbeveiligingsmiddel alleen achterin worden vervoerd met de gordel om. Voorin mag het kind zonder kinderzitje niet zitten.","wrong":["Voorin mag een kind korter dan 1,35 meter zonder kinderzitje niet zitten.","","Het kind mag achterin met de gordel om worden vervoerd, ook zonder kinderzitje.","Op schoot zitten is geen toegestane manier om een kind zonder kinderzitje te vervoeren."],"bron":"RVV 59 lid 5","hint":"Kinderen korter dan 1,35 m zonder zitje mogen in een taxi nooit voorin.","simpel":"Een kind van 9 jaar en 1,28 meter stapt in. Er is geen kinderzitje. Waar moet het kind zitten?","kern":["kind zonder kinderzitje","1,28 meter","vervoeren"]},{"id":"s2-t2-k08","tak":2,"niveau":"kruipen","et":"ET 2.2","type":"mc","q":"Krijger rijdt op een weg met twee rijstroken in dezelfde richting. Op de linkerrijstrook ontstaat een langzaamrijdende file. Krijger rijdt op de rechterrijstrook. Mag Krijger de auto's aan de linkerkant rechts inhalen?","opts":["Nee, rechts inhalen is op wegen met meerdere rijstroken altijd streng verboden.","Ja, bestuurders die zich in een file bevinden mogen rechts worden ingehaald.","Ja, maar alleen als Krijger zijn waarschuwingslichten aanzet.","Nee, Krijger moet op gelijke hoogte blijven rijden tot de file oplost."],"ok":1,"why":"In een file situatie is het toegestaan om voertuigen die zich in die file bevinden aan de rechterkant in te halen. Dit is een wettelijke uitzondering op de hoofdregel dat je links moet inhalen.","wrong":["In een file mag rechts inhalen wel.","","Waarschuwingslichten zijn geen voorwaarde voor rechts inhalen in een file.","Krijger hoeft niet op gelijke hoogte te blijven; hij mag in een file rechts inhalen."],"bron":"RVV art. 13 lid 2","hint":"Denk aan de ezelbrug FRUIT+: bij een File mag je rechts inhalen.","simpel":"Krijger rijdt op de rechterstrook. Links staat een file. Mag hij de auto's rechts inhalen?","kern":["file","rechts inhalen"]},{"id":"s2-t2-k10","tak":2,"niveau":"kruipen","et":"ET 2.2","type":"mc","q":"Krijger brengt een passagier naar een woning die binnen een erf ligt. Welke maximumsnelheid geldt voor Krijger binnen dit erf?","opts":["15 kilometer per uur","30 kilometer per uur","50 kilometer per uur","Stapvoets, wat wettelijk precies 5 kilometer per uur betekent"],"ok":0,"why":"Binnen een erf geldt een wettelijke maximumsnelheid van 15 kilometer per uur voor alle bestuurders.","wrong":["","Binnen een erf is de maximumsnelheid geen 30 kilometer per uur.","Binnen een erf is de maximumsnelheid geen 50 kilometer per uur.","Stapvoets is niet de maximumsnelheid; binnen een erf geldt 15 kilometer per uur."],"bron":"RVV 45","hint":"Onthoud het ritme-anker voor snelheden: erf 15.","simpel":"Krijger rijdt binnen een erf. Hoe hard mag hij maximaal rijden?","kern":["erf","maximumsnelheid"]},{"id":"s2-t2-k11","tak":2,"niveau":"kruipen","et":"ET 2.2","type":"mc","q":"Krijger moet een passagier laten uitstappen op een plek waar een parkeerverbod geldt. Wat is het verschil tussen stilstaan en parkeren bij het laten uitstappen van een passagier?","opts":["Het onmiddellijk laten uitstappen van passagiers geldt als stilstaan en mag op plekken waar parkeren verboden is.","Passagiers laten uitstappen geldt altijd als parkeren, ongeacht de tijdsduur.","Stilstaan mag alleen als de motor van het voertuig wordt uitgeschakeld.","Het laten uitstappen van passagiers geldt pas als stilstaan nadat de auto langer dan 5 minuten stilstaat."],"ok":0,"why":"Het onmiddellijk in- of uitstappen van passagiers valt onder 'stilstaan'. Daarom mag dit wel op locaties met een parkeerverbod, zolang er geen stopverbod geldt en geen gevaar of hinder ontstaat.","wrong":["","Passagiers onmiddellijk laten uitstappen is stilstaan, niet parkeren.","Stilstaan mag ook met draaiende motor; de motor uitschakelen is geen vereiste.","Laten uitstappen geldt onmiddellijk als stilstaan, niet pas na 5 minuten."],"bron":"RVV art. 1 (definities stilstaan/parkeren); vgl. RVV 23/24 (stop-/parkeerverbod)","hint":"Onmiddellijk in- of uitstappen is stilstaan, niet parkeren.","simpel":"Krijger laat een passagier uitstappen op een plek met parkeerverbod. Is dat stilstaan of parkeren?","kern":["stilstaan","parkeren","uitstappen"]},{"id":"s2-t2-k12","tak":2,"niveau":"kruipen","et":"ET 6.2","type":"mc","q":"Krijger rijdt op de weg. Zijn telefoon zit vastgeklikt in een houder op het dashboard. Tijdens het rijden tikt Krijger kort op het scherm van de telefoon om de navigatie-route te bevestigen. Is dit volgens de verkeersregels toegestaan?","opts":["Ja, want de telefoon wordt niet vastgehouden in de hand.","Nee, het aanraken van een scherm is voor een taxichauffeur tijdens het rijden altijd verboden.","Nee, telefoons moeten tijdens de rit uitgeschakeld in het dashboardkastje liggen.","Ja, maar alleen als de auto stilstaat voor een rood verkeerslicht."],"ok":0,"why":"Artikel 61a RVV verbiedt het vasthouden van een mobiel elektronisch apparaat tijdens het rijden. Omdat de telefoon in een houder zit en niet wordt vastgehouden, is het bedienen van het scherm niet in strijd met dit specifieke artikel.","wrong":["","Het aanraken van een scherm is niet altijd verboden; alleen vasthouden is verboden.","Telefoons hoeven niet uitgeschakeld in het dashboardkastje te liggen; in een houder is toegestaan.","Ook rijdend is het toegestaan zolang de telefoon niet wordt vastgehouden."],"bron":"RVV 61a","hint":"Het verbod van RVV 61a gaat over het vasthouden van de telefoon.","simpel":"De telefoon van Krijger zit in een houder. Hij tikt op het scherm tijdens het rijden. Mag dat?","kern":["telefoon in houder","tijdens rijden","bedienen"]},{"id":"s2-t2-l01","tak":2,"niveau":"lopen","et":"ET 2.1","type":"mc","q":"Krijger rijdt veel te dicht achter een fietser en remt daardoor hard. Hierdoor ontstaat bijna een aanrijding. Welk artikel van de Wegenverkeerswet overtreedt hij?","opts":["Artikel 6 WVW","Artikel 5 WVW","Artikel 8 WVW","Artikel 9 WVW"],"ok":1,"why":"Artikel 5 WVW verbiedt gevaar of hinder in het verkeer. Artikel 6 gaat over een ongeval met letsel of schade, artikel 8 over alcohol en artikel 9 over een rijontzegging.","wrong":["Artikel 6 gaat over een ongeval met letsel of schade.","","Artikel 8 gaat over alcohol en drugs.","Artikel 9 gaat over een rijontzegging."],"bron":"WVW art 5"},{"id":"s2-t2-l05","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Krijger rijdt op een autoweg buiten de bebouwde kom. Er geldt geen andere maximumsnelheid. Hoe hard mag hij maximaal?","opts":["130 km/u","80 km/u","100 km/u","50 km/u"],"ok":2,"why":"Een autoweg heeft een maximumsnelheid van 100 km/u. Alleen op een autosnelweg is 130 km/u toegestaan; op andere wegen buiten de kom 80 km/u.","wrong":["130 km/u mag alleen op een autosnelweg.","80 km/u geldt op andere wegen buiten de bebouwde kom.","","50 km/u geldt binnen de bebouwde kom."],"bron":"RVV 21"},{"id":"s2-t2-l07","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Krijger nadert een kruising waar een vast verkeersbord 'verleen voorrang aan bestuurders op de kruisende weg' staat. Vanwege wegwerkzaamheden is er ook een tijdelijk geel bord geplaatst dat hem juist voorrang verleent op het verkeer van de zijstraat. Er staan geen verkeerslichten of verkeersregelaars. Welk bord moet Krijger opvolgen?","opts":["Het tijdelijke gele bord, want tijdelijke verkeerstekens gaan boven vaste verkeerstekens.","Het vaste verkeersbord, want vaste borden hebben altijd voorrang op tijdelijke borden.","De algemene voorrangsregel (bestuurders van rechts gaan voor), omdat de borden elkaar tegenspreken.","Het vaste verkeersbord, tenzij er ook een tijdelijke gele streep op het wegdek staat."],"ok":0,"why":"Volgens artikel 63a RVV 1990 gaan tijdelijke verkeerstekens (zoals gele borden bij werkzaamheden) boven vaste verkeerstekens als ze elkaar tegenspreken. Krijger moet daarom het tijdelijke gele bord opvolgen. Vaste borden of algemene verkeersregels wijken in dit geval voor de tijdelijke bebording.","wrong":["","Vaste borden hebben niet altijd voorrang; tijdelijke borden gaan boven vaste borden.","Bij tegenspraak tussen borden gelden niet de algemene voorrangsregels, maar het tijdelijke bord.","Een tijdelijke gele streep is niet nodig; het tijdelijke bord geldt al."],"bron":"RVV 63a"},{"id":"s2-t2-l08","tak":2,"niveau":"lopen","et":"ET 7.1","type":"mc","q":"Krijger vervoert twee kinderen in de taxi. Het ene kind is 10 jaar oud en 1,25 meter lang; het andere kind is 12 jaar oud en 1,40 meter lang. Er is geen kinderzitje in de taxi aanwezig. Welke regels gelden er voor de zitplaats van deze kinderen?","opts":["Beide kinderen moeten verplicht achterin zitten omdat er geen kinderzitje aanwezig is.","Beide kinderen mogen voorin zitten met de veiligheidsgordel om, mits de airbag is uitgeschakeld.","Het kind van 1,25 m mag niet worden vervoerd zonder kinderzitje; het kind van 1,40 m wel.","Het kind van 1,25 m mag uitsluitend achterin met de gordel om; het kind van 1,40 m mag ook voorin met de gordel om."],"ok":3,"why":"Volgens artikel 59 lid 5 RVV 1990 mogen kinderen jonger dan 18 jaar en korter dan 1,35 meter in een taxi zonder kinderzitje uitsluitend achterin met de gordel worden vervoerd. Het kind van 1,40 meter is langer dan 1,35 meter en mag daarom ook voorin met de gordel om zitten. Weigeren van het kind van 1,25 meter is niet nodig, zolang het achterin plaatsneemt.","wrong":["Niet beide kinderen hoeven verplicht achterin; het kind van 1,40 meter mag voorin met de gordel om.","Het kind van 1,25 meter mag niet voorin zonder kinderzitje, ook niet met airbag uit.","Het kind van 1,25 meter mag zonder kinderzitje achterin met de gordel om; het mag dus wel worden vervoerd.",""],"bron":"RVV 59 lid 5"},{"id":"s2-t2-l09","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Krijger rijdt op een weg met twee rijstroken in dezelfde richting vlak voor een kruispunt. Op de linkerstrook voorsorteert een personenauto die knipperlicht naar links geeft om af te slaan. Krijger rijdt op de rechterstrook voor rechtdoor. Mag Krijger deze personenauto aan de rechterkant inhalen?","opts":["Nee, rechts inhalen is binnen de bebouwde kom op geen enkele weg toegestaan.","Ja, bestuurders die links voorsorteren en te kennen geven dat zij linksaf willen slaan, mogen rechts worden ingehaald.","Ja, maar alleen als de auto op de linkerstrook al volledig stilstaat voor het rode licht.","Nee, Krijger moet wachten en achter de afslaande auto op dezelfde rijstrook invoegen."],"ok":1,"why":"Artikel 11 lid 2 RVV 1990 bepaalt dat bestuurders die links voorsorteren en te kennen geven dat zij linksaf willen slaan, rechts moeten of mogen worden ingehaald. Krijger mag deze auto dus aan de rechterkant voorbijrijden. Rechts inhalen is in deze specifieke situatie uitdrukkelijk toegestaan.","wrong":["Rechts inhalen van een links voorsorterende auto is wel toegestaan, ook binnen de bebouwde kom.","","De auto hoeft niet stil te staan; ook rijdende linksafzwaaiers mogen rechts worden ingehaald.","Krijger hoeft niet te wachten; hij mag de links voorsorterende auto rechts inhalen."],"bron":"RVV 11 lid 2"},{"id":"s2-t2-l11","tak":2,"niveau":"lopen","et":"ET 2.1","type":"mc","q":"Krijger raakt tijdens het achteruitrijden op een parkeerterrein een geparkeerde auto. Er ontstaat blikschade aan de andere auto. De eigenaar is niet aanwezig. Krijger heeft haast voor een vervolgrit en rijdt snel weg zonder gegevens achter te laten. Welke uitspraak over dit handelen is juist?","opts":["Dit is strafbaar; Krijger mag de plaats van het ongeval niet verlaten zonder zijn identiteit en die van zijn voertuig bekend te maken.","Dit is alleen strafbaar als er sprake is van letsel of gewonden bij de aanrijding.","Krijger heeft altijd 72 uur de tijd om zich bij de politie te melden zonder strafbaar te zijn.","Krijger hoeft pas gegevens achter te laten als de geschatte schade meer dan € 500,- bedraagt."],"ok":0,"why":"Artikel 7 WVW 1994 verbiedt het verlaten van de plaats van een ongeval als daarbij schade of letsel is veroorzaakt, zonder de eigen gegevens bekend te maken. Dit geldt ook bij blikschade aan een onbeheerd voertuig. De hoogte van het schadebedrag of het ontbreken van letsel verandert niets aan de strafbaarheid.","wrong":["","Ook bij blikschade is verlaten zonder gegevens strafbaar; letsel is niet nodig.","De wet kent geen 72 uur om zich te melden; direct gegevens achterlaten is verplicht.","Er geldt geen drempelbedrag; ook bij kleine schade moet hij gegevens achterlaten."],"bron":"WVW 1994 art. 7"},{"id":"s2-t2-l12","tak":2,"niveau":"lopen","et":"ET 2.1","type":"mc","q":"Krijger zet zijn taxi stil op de rijbaan om een passagier uit te laten stappen. Hij zet de auto dwars over de weg en blokkeert daardoor volledig het fietspad en de rijbaan, waardoor een tegemoetkomende fietser plotseling krachtig moet remmen om een botsing te voorkomen. Welk wetsartikel overtreedt Krijger hiermee direct?","opts":["Artikel 6 WVW 1994, omdat hij schuld heeft aan een verkeersongeval met letsel.","Artikel 5 WVW 1994, omdat hij gedrag vertoont waardoor gevaar of hinder op de weg wordt of kan worden veroorzaakt.","Artikel 8 WVW 1994, omdat hij roekeloos rijgedrag vertoont onder invloed van vermoeidheid.","Artikel 9 WVW 1994, omdat hij rijdt terwijl zijn rijbewijs is ingevorderd."],"ok":1,"why":"Artikel 5 WVW 1994 is het kapstokartikel dat het iedereen verbiedt zich zo te gedragen dat gevaar op de weg wordt veroorzaakt of dat het verkeer wordt gehinderd. Door de weg en het fietspad volledig te blokkeren veroorzaakt Krijger gevaar en hinder. Artikel 6 gaat over een ongeval met dood of ernstig letsel door schuld en is hier niet aan de orde.","wrong":["Artikel 6 geldt alleen bij een ongeval met dood of ernstig letsel; dat is hier niet gebeurd.","","Artikel 8 gaat over rijden onder invloed, niet over gevaarlijk stilstaan.","Artikel 9 gaat over rijden zonder geldig rijbewijs, niet over het blokkeren van de weg."],"bron":"WVW 1994 art. 5"},{"id":"s2-t2-l13","tak":2,"niveau":"lopen","et":"ET 2.2","type":"mc","q":"Krijger vervoert een volwassen passagier van 25 jaar. Tijdens de rit weigert de passagier de veiligheidsgordel om te doen, ondanks dat Krijger hem hierop heeft geattendeerd. Bij een verkeerscontrole wordt dit geconstateerd. Wie krijgt volgens de wet de boete voor het niet dragen van de gordel?","opts":["Altijd alleen de taxichauffeur, omdat deze verantwoordelijk is voor alle inzittenden.","De werkgever van Krijger, omdat deze verantwoordelijk is voor de veiligheid in de taxi.","De passagier zelf, mits deze 12 jaar of ouder is.","Zowel Krijger als de passagier krijgen verplicht ieder een eigen boete."],"ok":2,"why":"In Nederland geldt volgens artikel 59 RVV 1990 dat inzittenden van 12 jaar en ouder zelf verantwoordelijk zijn voor het dragen van de veiligheidsgordel. Bij een overtreding krijgt de passagier zelf de boete. De chauffeursverantwoordelijkheid voor het dragen van de gordel geldt uitsluitend voor kinderen jonger dan 12 jaar.","wrong":["De chauffeur is alleen verantwoordelijk voor kinderen jonger dan 12 jaar.","De boete gaat naar de passagier, niet naar de werkgever.","","Niet beiden krijgen een boete; alleen de passagier is verantwoordelijk."],"bron":"RVV 59"},{"id":"s2-t2-r01","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Krijger rijdt op een weg met werkzaamheden. Er staat een tijdelijk geel bord met maximumsnelheid 30, maar ook een vast wit bord met 50. Welke maximumsnelheid geldt hier?","opts":["30 km/h","50 km/h","80 km/h","100 km/h"],"ok":0,"why":"Tijdelijke (gele) borden gaan boven vaste borden. Daarom geldt hier 30 km/h. Bron: RVV 63a.","wrong":["","Het tijdelijke gele bord gaat boven het vaste witte bord.","80 km/h is hier niet aangegeven.","100 km/h is hier niet aangegeven."],"bron":"RVV 63a"},{"id":"s2-t2-r03","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Een passagier wil midden op een drukke rijbaan uitstappen, omdat het voor zijn huis is. Wat moet Krijger volgens de RVV doen?","opts":["De passagier laten uitstappen, want de passagier beslist","Alleen stoppen als er geen verkeer aankomt","Niet laten uitstappen als daardoor gevaar of hinder kan ontstaan","De passagier op de rijbaan laten uitstappen met de deur naar het trottoir"],"ok":2,"why":"Artikel 52 verbiedt het laten in- of uitstappen als dat gevaar of hinder oplevert. De bestuurder blijft verantwoordelijk. Stoppen mag alleen als het veilig kan.","wrong":["De bestuurder blijft verantwoordelijk; de passagier beslist niet.","Er mag geen gevaar of hinder zijn; alleen geen verkeer is niet genoeg.","","Uitstappen op de rijbaan mag niet als dat gevaar of hinder geeft."],"bron":"RVV 52"},{"id":"s2-t2-r04","tak":2,"niveau":"rennen","et":"ET 2.1","type":"mc","q":"Krijger gebruikt medicijnen waarvan de bijsluiter waarschuwt dat ze de rijvaardigheid kunnen beïnvloeden. Hij voelt zich helder. Mag hij rijden?","opts":["Nee, want artikel 8 WVW verbiedt rijden onder invloed van middelen die de rijvaardigheid beïnvloeden","Ja, want hij voelt zich helder","Ja, als hij een half uur wacht na inname","Alleen als de arts schriftelijk toestemming geeft"],"ok":0,"why":"Artikel 8 verbiedt rijden onder invloed van alcohol, drugs of medicijnen die de rijvaardigheid kunnen beïnvloeden. Het gevoel van de bestuurder is niet bepalend. Zonder toestemming van de arts blijft het verbod.","wrong":["","Het gevoel van de bestuurder is niet bepalend.","Een half uur wachten is niet genoeg.","Alleen toestemming van de arts is niet genoeg; artikel 8 verbiedt het."],"bron":"WVW 8"},{"id":"s2-t2-r07","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Krijger rijdt met zijn taxi op een voorrangsweg. Bij een kruispunt staat het verkeerslicht op rood. Een verkeersregelaar staat midden op het kruispunt en geeft Krijger met de hand een teken dat hij door moet rijden. Wat moet Krijger doen?","opts":["Wachten voor het rode verkeerslicht, want een verkeerslicht gaat boven de aanwijzingen van een verkeersregelaar.","Doorrijden, want aanwijzingen van bevoegde personen gaan boven verkeerslichten, verkeerstekens en verkeersregels.","Wachten, want het bord voorrangsweg vervalt bij een rood verkeerslicht en dat geldt ook voor de verkeersregelaar.","Doorrijden, maar alleen omdat het voorrangsbord boven het rode verkeerslicht gaat."],"ok":1,"why":"Volgens artikel 84 RVV 1990 gaan aanwijzingen van bevoegde personen (zoals verkeersregelaars) boven verkeerslichten, verkeerstekens en verkeersregels. Krijger moet de aanwijzing opvolgen en dus doorrijden. De opvatting dat lichten of borden boven een verkeersregelaar gaan, is onjuist.","wrong":["Aanwijzingen van een verkeersregelaar gaan juist boven het verkeerslicht.","","Het bord voorrangsweg verandert niets; de aanwijzing van de regelaar geldt.","Het voorrangsbord gaat niet boven een rood licht; doorrijden mag vanwege de regelaar."],"bron":"RVV 84"},{"id":"s2-t2-r08","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Krijger haalt een gezin op. Een jongen van 7 jaar is 1,25 meter lang. Er is geen kinderzitje aanwezig in de taxi. De vader vraagt of de jongen voorin mag zitten. Waar mag Krijger deze jongen wettelijk vervoeren?","opts":["Voorin, mits hij de heup- en schoudergordel omheeft.","Voorin of achterin, mits de vader hiertoe mondeling toestemming geeft.","Alleen op de achterbank, met de aanwezige autogordel om.","In deze taxi mag de jongen helemaal niet vervoerd worden zonder kinderzitje."],"ok":2,"why":"Artikel 59 lid 5 RVV 1990 bepaalt dat in taxi’s zonder kinderzitje passagiers jonger dan 18 jaar en korter dan 1,35 meter op een andere zitplaats dan een voorste zitplaats moeten worden vervoerd. De jongen is 7 jaar en 1,25 m, dus alleen achterin, met de autogordel om. Voorin zonder kinderzitje is niet toegestaan; hij mag wel achterin met de gordel.","wrong":["Voorin is zonder kinderzitje niet toegestaan voor deze jongen.","Mondelinge toestemming verandert de wettelijke regel niet; alleen achterin is toegestaan.","","De jongen mag wel achterin met de autogordel om."],"bron":"RVV 59 lid 5"},{"id":"s2-t2-r09","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Krijger rijdt op de autosnelweg op de rechterrijstrook. Aan zijn linkerkant rijdt op de middelste rijstrook een lange, aaneengesloten rij auto's (file) met een snelheid van 70 km/u. Mag Krijger deze voertuigen aan de rechterkant voorbijrijden?","opts":["Nee, rechts inhalen is op de autosnelweg onder alle omstandigheden verboden.","Ja, want bestuurders in een file mogen naburig verkeer rechts voorbijrijden.","Nee, dit mag alleen als er sprake is van een blokmarkering op het wegdek.","Ja, maar alleen als hij maximaal 50 km/u rijdt."],"ok":1,"why":"Volgens artikel 13 lid 2 RVV 1990 mogen files aan de rechterzijde worden ingehaald. Artikel 13 lid 1 RVV 1990 bepaalt daarnaast dat bij fileverkeer niet de meest rechts gelegen rijstrook hoeft te worden gevolgd. Er geldt bij het rechts inhalen in een file geen specifieke maximumsnelheid van 50 km/u.","wrong":["Bij file mag rechts inhalen wel.","","Een blokmarkering is niet nodig voor rechts inhalen in een file.","Er geldt geen maximumsnelheid van 50 km/u voor rechts inhalen in een file."],"bron":"RVV 1990 art. 13 lid 2"},{"id":"s2-t2-r10","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Krijger rijdt met een passagier een woonwijk binnen die is aangeduid met het bord 'Erf'. Wat is de wettelijke maximumsnelheid binnen dit erf?","opts":["15 km/u","20 km/u","30 km/u","Stapvoets (5 km/u)"],"ok":0,"why":"Artikel 45 RVV 1990 bepaalt dat bestuurders binnen een erf niet sneller mogen rijden dan 15 km/u. Vroeger gold de term 'stapvoets', maar de wet noemt nu expliciet 15 km/u als limiet. 30 km/u geldt voor een 30-zone, niet voor een erf.","wrong":["","Binnen een erf is de maximumsnelheid 15 km/u, niet 20 km/u.","30 km/u geldt voor een 30-zone, niet voor een erf.","De wet noemt 15 km/u, niet stapvoets of 5 km/u."],"bron":"RVV 45"},{"id":"s2-t2-r11","tak":2,"niveau":"rennen","et":"ET 2.1","type":"mc","q":"Krijger laat een passagier uitstappen op een smalle straat vlak voor een onoverzichtelijke bocht. Achteropkomende auto's moeten hierdoor uitwijken naar de strook voor tegemoetkomend verkeer zonder dat zij zicht hebben op tegenliggers. Welk artikel van de Wegenverkeerswet 1994 overtreedt Krijger hiermee?","opts":["Artikel 6 WVW 1994 (veroorzaken van een verkeersongeval)","Artikel 7 WVW 1994 (verlaten van de plaats van een ongeval)","Artikel 5 WVW 1994 (veroorzaken van gevaar of hinder)","Artikel 8 WVW 1994 (rijden onder invloed)"],"ok":2,"why":"Artikel 5 WVW 1994 is het algemene veiligheidsbeginsel: het is verboden zich zo te gedragen dat gevaar op de weg wordt veroorzaakt of het verkeer wordt gehinderd. Omdat er nog geen ongeval is gebeurd, is artikel 6 niet van toepassing.","wrong":["Artikel 6 geldt pas bij een ongeval; dat is hier niet gebeurd.","Artikel 7 gaat over het verlaten van een ongeval; dat is hier niet aan de orde.","","Artikel 8 gaat over rijden onder invloed, niet over hinderlijk stilstaan."],"bron":"WVW 1994 art. 5"},{"id":"s2-t2-r12","tak":2,"niveau":"rennen","et":"ET 2.8","type":"mc","q":"Krijger veroorzaakt tijdens het achteruitrijden lichte blikschade aan een geparkeerde auto op een standplaats. Er is niemand aanwezig. Krijger heeft een dringende rit en rijdt door zonder zijn gegevens achter te laten. Binnen welke termijn kan hij strafvervolging op grond van artikel 7 WVW 1994 voorkomen door alsnog vrijwillig de politie in te lichten?","opts":["Binnen 24 uur na het ongeval.","Binnen 12 uur na het ongeval.","Binnen 48 uur na het ongeval.","Binnen 6 uur na het ongeval."],"ok":1,"why":"Artikel 184 WVW 1994 bepaalt dat bij overtreding van artikel 7 lid 1 onder a en b WVW 1994 strafvervolging is uitgesloten als de overtreder binnen 12 uur na het verkeersongeval en voordat hij als verdachte is aangehouden of verhoord, vrijwillig kennisgeeft aan een opsporingsambtenaar en daarbij zijn identiteit en de identiteit van het motorrijtuig bekendmaakt. Artikel 7 lid 2 WVW 1994 ziet op het ter plaatse achterlaten van gegevens.","wrong":["De wet geeft geen 24 uur; de termijn is 12 uur.","","48 uur is te lang; de wet noemt 12 uur.","6 uur is te kort; de wet noemt 12 uur."],"bron":"WVW 1994 art. 184 jo art. 7 lid 1"},{"id":"s2-t2-r13","tak":2,"niveau":"rennen","et":"ET 2.2","type":"mc","q":"Krijger moet een slecht ter been zijnde passagier ophalen. Vóór het woningadres ligt een verplicht fietspad langs de rijbaan. Er is geen parkeervak. Waar moet Krijger stilstaan om de passagier in te laten stappen?","opts":["Op het fietspad, mits hij de alarmlichten inschakelt.","Op het trottoir, zolang er voldoende ruimte blijft voor voetgangers.","Op de rijbaan naast het fietspad.","Hij mag hier helemaal niet stilstaan en moet doorrijden naar de dichtstbijzijnde parkeerplaats."],"ok":2,"why":"Artikel 10 RVV 1990 verbiedt het stilstaan op een fietspad en op een trottoir. Voor het onmiddellijk in- of uitstappen van passagiers mag Krijger stilstaan op de rijbaan naast het fietspad, mits hij daarbij geen gevaar of hinder veroorzaakt. Alarmlichten geven geen recht om op een fietspad te staan.","wrong":["Stilstaan op een fietspad is verboden; alarmlichten geven geen toestemming.","Stilstaan op het trottoir is verboden.","","Hij mag wel stilstaan op de rijbaan naast het fietspad om passagiers te laten in- of uitstappen."],"bron":"RVV 1990 art. 10"},{"id":"s2-t3-k01","tak":3,"niveau":"kruipen","et":"ET 2.3","type":"mc","q":"Krijger wil als chauffeur taxivervoer verrichten. Wat is volgens de Wet personenvervoer 2000 nodig?","opts":["Hij heeft alleen een geldig rijbewijs B nodig.","De ondernemer heeft een taxivergunning en Krijger een geldige chauffeurskaart.","Hij heeft alleen een Verklaring Omtrent het Gedrag nodig.","Het taxibedrijf heeft alleen een APK nodig."],"ok":1,"why":"De Wp2000 verbiedt taxivervoer zonder vergunning; de chauffeur moet een geldige chauffeurskaart hebben. Een rijbewijs B of VOG alleen is niet genoeg.","wrong":["Alleen een rijbewijs B is niet voldoende.","","Alleen een Verklaring Omtrent het Gedrag is niet voldoende.","Alleen een APK is niet voldoende."],"bron":"Wp2000 art. 4 / CBR ET 2.3","hint":"Vergunning voor de baas, kaart voor de chauffeur.","simpel":"Krijger wil taxichauffeur worden. Wat is nodig volgens de Wet personenvervoer 2000?","kern":["taxivervoer","Wet personenvervoer 2000","nodig"]},{"id":"s2-t3-k03","tak":3,"niveau":"kruipen","et":"ET 2.5","type":"mc","q":"Krijger werkt onder cao. Vrijdag stopt hij om 23:00 uur, zaterdag begint hij om 07:00 uur. Is dit toegestaan?","opts":["Nee, de dagrust moet altijd 10 uur zijn.","Ja, maximaal 1 keer per 7×24 uur mag de dagrust 8 uur zijn.","Ja, maximaal 2 keer per 14×24 uur mag de dagrust worden ingekort tot 8 uur.","Nee, de dagrust moet altijd 11 uur zijn."],"ok":2,"why":"Onder cao is de dagrust 10 uur; die mag 2 keer per 14×24 uur worden verkort tot 8 uur. Dit is precies zo'n toegestane verkorting; 11 uur geldt niet voor taxi.","wrong":["De dagrust mag soms 8 uur zijn; niet altijd 10 uur.","Verkorting mag 2 keer per 14×24 uur, niet 1 keer per 7×24 uur.","","Voor taxi is de dagrust 10 uur, niet 11 uur."],"bron":"ATB-V 2.5:1 lid 4, 6","hint":"Tien, twee keer acht, in veertien dagen.","simpel":"Krijger werkt onder cao. Hij stopt vrijdag om 23:00 uur. Zaterdag begint hij om 07:00 uur. Mag dat?","kern":["cao","23:00","07:00"]},{"id":"s2-t3-k04","tak":3,"niveau":"kruipen","et":"ET 2.5","type":"mc","q":"Krijger werkt onder cao. Hoeveel weekrust moet hij in elke periode van 14×24 uur krijgen?","opts":["36 uur per 7×24 uur","90 uur per 14×24 uur, op te splitsen in blokken van 8 uur","48 uur per 7×24 uur","72 uur per 14×24 uur, in delen van minimaal 24 uur"],"ok":3,"why":"Met cao is de weekrust 72 uur per 14×24 uur, in delen van minimaal 24 uur. 36 uur per 7×24 uur is de oude/zonder-cao norm, maar het examen vraagt met cao.","wrong":["36 uur per 7×24 uur is de oude norm zonder cao; met cao geldt 72 uur per 14 dagen.","De cao-weekrust is 72 uur, niet 90 uur, en blokken moeten minimaal 24 uur duren.","De weekrust is bij cao 72 uur per 14 dagen, niet 48 uur per week.",""],"bron":"ATB-V 2.5:1 lid 4, 6","hint":"Tweeënzeventig in veertien dagen; elk blok minstens één dag.","simpel":"Krijger werkt onder de cao. Hoeveel weekrust moet hij in elke 14 dagen krijgen?","kern":["weekrust","14 dagen","cao"]},{"id":"s2-t3-k05","tak":3,"niveau":"kruipen","et":"ET 2.5","type":"mc","q":"Krijger werkt onder de cao. De werkgever wil een dienst van 12,5 uur inplannen. Mag dat?","opts":["Ja, de maximale arbeidstijd per dienst is 13 uur.","Ja, de maximale arbeidstijd per dienst is 15 uur.","Nee, de maximale arbeidstijd per dienst is 12 uur.","Ja, als er maar 45 minuten pauze tussen zit."],"ok":2,"why":"Een dienst mag maximaal 12 uur arbeid bevatten, dus 12,5 uur kan niet. De 60 uur per week en gemiddeld 48 uur per week zijn andere grenzen.","wrong":["De maximale arbeidstijd per dienst is 12 uur, niet 13 uur.","De maximale arbeidstijd per dienst is 12 uur, niet 15 uur.","","Een dienst mag nooit meer dan 12 uur arbeid bevatten; pauze verandert dat niet."],"bron":"ATB-V 2.5:7","hint":"Twaalf is het plafond per dienst.","simpel":"Krijger werkt onder de cao. Mag een dienst 12,5 uur duren?","kern":["maximale arbeidstijd","12,5 uur"]},{"id":"s2-t3-k06","tak":3,"niveau":"kruipen","et":"ET 2.5","type":"mc","q":"Krijger werkt van 22:00 tot 04:00. Tussen 00:00 en 04:00 werkt hij 4 uur. Is dit een nachtdienst?","opts":["Nee, want hij werkt minder dan 6 uur in de nacht.","Ja, want hij werkt meer dan 1 uur tussen 00:00 en 06:00.","Nee, want een nachtdienst begint pas na 01:00.","Ja, want elke dienst na 22:00 is een nachtdienst."],"ok":1,"why":"Een nachtdienst is een dienst waarin meer dan 1 uur arbeid wordt verricht tussen 00:00 en 06:00. 4 uur is dus zeker een nachtdienst; het tijdstip 22:00 maakt nog geen nachtdienst.","wrong":["Een nachtdienst is al bij meer dan 1 uur tussen 00:00 en 06:00, niet pas bij 6 uur.","","Een nachtdienst begint niet pas na 01:00; het gaat om meer dan 1 uur tussen 00:00 en 06:00.","Niet elke dienst na 22:00 is een nachtdienst; het gaat om arbeid tussen 00:00 en 06:00."],"bron":"ATW 1:7 / ATB-V 2.5:4","hint":"Meer dan één uur tussen twaalf en zes.","simpel":"Krijger werkt van 22:00 tot 04:00. Hij werkt 4 uur tussen 00:00 en 04:00. Is dit een nachtdienst?","kern":["nachtdienst","00:00-06:00","meer dan 1 uur"]},{"id":"s2-t3-k11","tak":3,"niveau":"kruipen","et":"ET 2.5","type":"mc","q":"Krijger heeft de afgelopen maanden veel gewerkt. Hij wil controleren of hij het maximale gemiddelde aantal werkuren per week niet overschrijdt. Welke norm geldt met cao?","opts":["Gemiddeld maximaal 40 uur per week over een periode van 16 weken.","Gemiddeld maximaal 48 uur per week over een periode van 16 weken.","Gemiddeld maximaal 48 uur per week over een periode van 26 weken.","Gemiddeld maximaal 60 uur per week over een periode van 52 weken."],"ok":2,"why":"De maximale arbeidstijd is gemiddeld 48 uur per week. Met cao wordt dit berekend over een periode van 26 weken (zonder cao is dat 16 weken).","wrong":["40 uur is te laag; de norm is gemiddeld 48 uur per week.","48 uur is juist, maar zonder cao geldt 16 weken; met cao is de periode 26 weken.","","60 uur is te hoog; de norm is gemiddeld 48 uur per week."],"bron":"ATB-V 2.5:7 lid 6","hint":"Twaalf, zestig, achtenveertig – de cao rekt de gemiddelde periode uit naar zesentwintig weken.","simpel":"Krijger werkt veel. Hoeveel uur mag hij gemiddeld per week werken met cao?","kern":["maximale gemiddelde werkuren","week","cao"]},{"id":"s2-t3-k13","tak":3,"niveau":"kruipen","et":"ET 2.6","type":"mc","q":"Krijger wordt onderweg gecontroleerd op het gebruik van de BCT/CDT en het naleven van zijn arbeids- en rusttijden. Welke overheidsinstantie voert deze controle uit?","opts":["Inspectie Leefomgeving en Transport (ILT)","Centraal Bureau Rijvaardigheidsbewijzen (CBR)","Kiwa Register","Sociaal Fonds Mobiliteit (SFM)"],"ok":0,"why":"De ILT controleert in de taxibranche op de naleving van de Wet personenvervoer 2000, de BCT/CDT en de Arbeidstijdenwet. Het CBR gaat over examens en Kiwa over het afgeven van de chauffeurskaart.","wrong":["","Het CBR gaat over examens, niet over controle op BCT/arbeidstijden.","Kiwa Register geeft de chauffeurskaart af, maar controleert niet.","Sociaal Fonds Mobiliteit controleert niet de BCT/arbeidstijden; dat doet de ILT."],"bron":"CBR ET 2.3 / Wet personenvervoer 2000","hint":"Denk aan de rijksinspectie die toeziet op transport en boordcomputers.","simpel":"Krijger wordt gecontroleerd op BCT/CDT en werk- en rusttijden. Welke instantie controleert?","kern":["controle","BCT/CDT","arbeids- en rusttijden"]},{"id":"s2-t3-l01","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Krijger werkt vandaag van 07:00 tot 13:00. Volgens de cao heeft hij recht op minimaal 15 minuten pauze. Mag hij die pauze splitsen in drie blokjes van 5 minuten?","opts":["Ja, als het totaal maar 15 minuten is","Nee, een pauze moet minimaal 15 minuten aaneengesloten zijn","Ja, dat is bij de cao toegestaan","Nee, de pauze moet minimaal 30 minuten duren"],"ok":1,"why":"Een pauze telt alleen als die minimaal 15 minuten achter elkaar duurt. Drie keer 5 minuten is dus geen pauze. Dit geldt ook met de cao.","wrong":["Een pauze moet minimaal 15 minuten aaneengesloten zijn; drie keer 5 minuten telt niet.","","De cao staat geen kortere pauzes toe; een pauze is minimaal 15 minuten aaneengesloten.","De pauze hoeft niet 30 minuten te duren; 15 minuten is voldoende."],"bron":"ATW 1:7"},{"id":"s2-t3-l03","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Krijger heeft met de cao recht op 72 uur weekrust per 14 dagen. In welke delen moet hij die rust opnemen?","opts":["In delen van minimaal 8 uur","In delen van minimaal 12 uur","In delen van minimaal 24 uur","In één aaneengesloten blok van 72 uur"],"ok":2,"why":"De weekrust van 72 uur per 14 dagen mag in delen worden opgenomen, maar elk deel moet minstens 24 uur duren. Kortere blokken tellen niet als weekrust.","wrong":["Weekrustdelen moeten minimaal 24 uur duren, niet 8 uur.","Weekrustdelen moeten minimaal 24 uur duren, niet 12 uur.","","De 72 uur hoeft niet in één blok; delen mogen, maar elk deel minstens 24 uur."],"bron":"ATB-V 2.5:1"},{"id":"s2-t3-l04","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Krijger werkt veel overuren. Over welke periode mag zijn gemiddelde arbeidstijd volgens de cao maximaal 48 uur per week zijn?","opts":["13 weken","16 weken","52 weken","26 weken"],"ok":3,"why":"Met de cao wordt het gemiddelde van 48 uur per week berekend over 26 weken. Zonder cao is dat 16 weken. 52 weken is voor een andere limiet.","wrong":["Met cao is de periode 26 weken, niet 13 weken.","16 weken is de periode zonder cao; met cao is het 26 weken.","52 weken is voor een andere limiet; voor gemiddeld 48 uur is het 26 weken.",""],"bron":"ATB-V 2.5:7"},{"id":"s2-t3-l05","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Krijger rijdt een avonddienst. Wanneer is er officieel sprake van een nachtdienst?","opts":["Als hij meer dan 1 uur tussen 00:00 en 06:00 werkt","Als hij minstens 1 uur tussen 00:00 en 06:00 werkt","Als zijn hele dienst tussen 00:00 en 06:00 valt","Als hij tussen 22:00 en 06:00 werkt"],"ok":0,"why":"Een nachtdienst is een dienst waarin meer dan 1 uur arbeid wordt verricht tussen 00:00 en 06:00. Precies 1 uur of alleen avondwerk valt er niet onder.","wrong":["","Precies 1 uur is niet genoeg; het moet meer dan 1 uur zijn.","De hele dienst hoeft niet in die uren te vallen; meer dan 1 uur is voldoende.","Werken tussen 22:00 en 06:00 maakt het nog geen nachtdienst; het gaat om meer dan 1 uur tussen 00:00 en 06:00."],"bron":"ATW 1:7"},{"id":"s2-t3-l06","tak":3,"niveau":"lopen","et":"ET 2.5","type":"mc","q":"Krijger draait veel nachtdiensten. Hoeveel nachtdiensten mag hij maximaal in 16 weken maken?","opts":["26","38","140","52"],"ok":3,"why":"Het maximum is 52 nachtdiensten per 16 weken (en 140 per 52 weken). 38 is het alternatief als je kijkt naar uren tussen 00:00 en 06:00 per 2 weken.","wrong":["Het maximum is 52 nachtdiensten per 16 weken, niet 26.","38 is geen maximum per 16 weken; het maximum is 52.","140 is het maximum per 52 weken, niet per 16 weken.",""],"bron":"ATB-V 2.5:4"},{"id":"s2-t3-l07","tak":3,"niveau":"lopen","et":"ET 2.7","type":"mc","q":"Krijger werkt zowel op maandag voor bedrijf A als op dinsdag voor bedrijf B. Wat moet hij doen met zijn arbeids- en rusttijden?","opts":["Niets, de werkgevers wisselen onderling uit","Uit zichzelf aan elke werkgever melden","Alleen aan zijn hoofdwerkgever melden","Alleen aan de ILT melden"],"ok":1,"why":"Bij meerdere werkgevers moet de chauffeur zelf zijn uren aan elke werkgever doorgeven. De werkgevers zijn daar niet zelf verantwoordelijk voor, en het is geen melding aan de ILT.","wrong":["De werkgevers hoeven dit niet onderling te regelen.","","Alleen aan de hoofdwerkgever melden is niet genoeg.","Dit is geen melding aan de ILT."],"bron":"ATW 5:15 lid 6"},{"id":"s2-t3-r01","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Krijger werkt volgens de cao. Zijn dienst duurt van 07:00 tot 16:45 (9 uur en 45 minuten). Wat is de minimale pauze die hij wettelijk moet krijgen?","opts":["30 minuten","15 minuten","45 minuten","Geen pauze nodig"],"ok":1,"why":"Bij arbeid van meer dan 5,5 uur is met cao minimaal 15 minuten aaneengesloten pauze verplicht (ATW 5:4 lid 3). 30 en 45 minuten zijn de normen zonder cao; geen pauze mag nooit.","wrong":["30 minuten is de norm zonder cao.","","45 minuten is de norm zonder cao.","Pauze is verplicht bij meer dan 5,5 uur arbeid."],"bron":"ATW 5:4 lid 3"},{"id":"s2-t3-r04","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Krijger rijdt veel nachtdiensten. Welke combinatie van maxima is correct volgens de ATB-V?","opts":["52 nachtdiensten per 16 weken óf 140 per 52 weken","140 nachtdiensten per 16 weken én 52 per 52 weken","52 nachtdiensten per 16 weken én 140 per 52 weken, óf maximaal 38 uur arbeid tussen 00:00 en 06:00 per 2 weken","Maximaal 38 nachtdiensten per 2 weken"],"ok":2,"why":"ATB-V 2.5:4 lid 3-4 stelt beide maxima: 52 per 16 weken én 140 per 52 weken, of als alternatief maximaal 38 uur tussen 00:00 en 06:00 per 2 weken. 'Of' zonder 'en' is onjuist, en 38 gaat over uren, niet diensten.","wrong":["Dit klopt niet: de maxima zijn met 'en' verbonden, niet met 'of'.","De aantallen zijn omgedraaid: 52 per 16 weken en 140 per 52 weken.","","38 is een maximum aantal uren, niet aantal nachtdiensten."],"bron":"ATB-V 2.5:4 lid 3-4"},{"id":"s2-t3-r06","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Krijger werkt voor een taxibedrijf waar de cao geldt. Hij werkt op maandag van 04:30 uur tot 12:00 uur. Is deze dienst volgens de wet een nachtdienst?","opts":["Nee, want hij werkt minder dan 5 uur tussen 00:00 en 06:00 uur.","Ja, want hij werkt meer dan 1 uur tussen 00:00 en 06:00 uur.","Nee, want hij werkt voor 06:00 uur maar minder dan 2 uur.","Ja, want elke dienst die voor 07:00 uur begint is een nachtdienst."],"ok":1,"why":"Een nachtdienst is elke dienst waarin meer dan 1 uur wordt gewerkt tussen 00:00 en 06:00 uur. Krijger werkt van 04:30 tot 06:00 uur, wat precies 1,5 uur is. De grens van 1 uur is hierbij bepalend volgens de Arbeidstijdenwet.","wrong":["De grens is niet 5 uur, maar meer dan 1 uur tussen 00:00 en 06:00.","","De grens is niet 2 uur; meer dan 1 uur is al voldoende.","Niet elke dienst die voor 07:00 begint is nachtdienst; het gaat om meer dan 1 uur tussen 00:00 en 06:00."],"bron":"ATW 1:7"},{"id":"s2-t3-r07","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Krijger heeft een drukke periode bij zijn taxibedrijf (met cao). Hij kijkt naar zijn wekelijkse rusttijd over een periode van 14 dagen (14x24 uur). Hoeveel rust moet hij minimaal hebben?","opts":["Minimaal 36 uur aaneengesloten rust per periode van 7 dagen.","Minimaal 72 uur rust, verdeeld in blokken van minimaal 24 uur.","Minimaal 96 uur rust, waarvan één blok van 48 uur.","Minimaal 72 uur rust, die hij in blokken van minimaal 15 minuten mag splitsen."],"ok":1,"why":"Volgens het ATB-V (met cao) is de weekrust 72 uur per 14 dagen, op te delen in perioden van minimaal 24 uur. De optie van 36 uur geldt alleen voor de situatie zonder cao.","wrong":["36 uur per 7 dagen geldt zonder cao; met cao is het 72 uur per 14 dagen.","","96 uur is te hoog; met cao is de weekrust 72 uur per 14 dagen.","72 uur is juist, maar splitsen mag alleen in blokken van minimaal 24 uur, niet 15 minuten."],"bron":"ATB-V 2.5:1"},{"id":"s2-t3-r08","tak":3,"niveau":"rennen","et":"ET 2.7","type":"mc","q":"Krijger wil extra verdienen. Hij werkt doordeweeks bij taxibedrijf A en in het weekend bij taxibedrijf B. Wat is zijn wettelijke plicht wat betreft zijn gewerkte uren?","opts":["Hij moet alleen de uren van bedrijf A registreren in zijn BCT.","Hij moet de uren van bedrijf B alleen melden als bedrijf A erom vraagt.","Hij moet uit zichzelf zijn uren van beide bedrijven aan beide werkgevers melden.","Hij hoeft niets te melden, de Inspectie (ILT) koppelt deze gegevens automatisch."],"ok":2,"why":"De chauffeur heeft een actieve meldplicht volgens de Arbeidstijdenwet. Hij moet alle gewerkte uren uit zichzelf doorgeven aan elke werkgever om overschrijding van de maximale arbeidstijd te voorkomen.","wrong":["Hij moet ook de uren van bedrijf B registreren, niet alleen van bedrijf A.","Hij moet de uren uit zichzelf melden, niet pas als erom wordt gevraagd.","","De ILT koppelt dit niet automatisch; de chauffeur moet zelf melden."],"bron":"ATW 5:15 lid 6"},{"id":"s2-t3-r09","tak":3,"niveau":"rennen","et":"ET 2.5","type":"mc","q":"Krijger heeft in 14 dagen tijd twee keer zijn dagelijkse rust ingekort naar 8 uur. Hij wil dit in dezelfde periode van 14 dagen nog een derde keer doen. Mag dit volgens de cao-regels?","opts":["Ja, zolang hij de weekrust van 72 uur maar haalt.","Nee, hij mag de dagrust van 10 uur maximaal 2 keer per 14 dagen inkorten naar 8 uur.","Ja, hij mag de rust elke dag inkorten naar 8 uur, mits hij dit compenseert in het weekend.","Nee, inkorten naar 8 uur mag alleen als hij minder dan 5 uur heeft gereden."],"ok":1,"why":"De standaard dagrust in de taxi is 10 uur per 24 uur. Met een cao mag dit maximaal 2 keer per periode van 14x24 uur worden ingekort naar minimaal 8 uur.","wrong":["Hij mag niet vaker inkorten; de weekrust verandert de grens van 2 keer per 14 dagen niet.","","Elke dag inkorten is niet toegestaan; maximaal 2 keer per 14 dagen.","De grens hangt niet af van het aantal rij-uren; het mag maximaal 2 keer per 14 dagen."],"bron":"ATB-V 2.5:1 lid 6"},{"id":"s2-t3-r10","tak":3,"niveau":"rennen","et":"ET 1.3","type":"mc","q":"Krijger werkt bij een ondernemer die alle ritten registreert via de BCT en CDT. Hoe lang moet de ondernemer deze gegevens wettelijk bewaren voor controle?","opts":["De gegevens moeten 1 jaar bewaard worden, net als de uitslag van het TVT-examen.","De gegevens moeten 2 jaar bewaard worden.","De gegevens moeten 5 jaar bewaard worden, gelijk aan de geldigheid van de chauffeurskaart.","De gegevens moeten 7 jaar bewaard worden voor de belastingdienst."],"ok":1,"why":"De ondernemer is verplicht om de gegevens uit de boordcomputer (BCT) of de centrale database (CDT) gedurende 2 jaar te bewaren voor inspectiedoeleinden door de ILT.","wrong":["De wet zegt 2 jaar bewaren, niet 1 jaar.","","De chauffeurskaart is 5 jaar geldig, maar de BCT-gegevens moeten 2 jaar bewaard worden.","De ILT-controle vraagt 2 jaar, niet 7 jaar."],"bron":"Besluit personenvervoer 2000 / ILT"},{"id":"s2-t4-k02","tak":4,"niveau":"kruipen","et":"ET 3.2","type":"mc","q":"Een taxichauffeur wil in een grote stad passagiers oppikken die op straat een taxi aanhouden. Welke toelating is vereist?","opts":["Toegelaten Taxi Organisatie (TTO)","Alleen een APK-keuringsrapport","Alleen een NS-vervoerbewijs","Een speciale provinciale ontheffing"],"ok":0,"why":"Voor straattaxivervoer in bepaalde grote steden is een TTO-toelating nodig. Contractvervoer kent die eis niet.","wrong":["","Een APK-keuring is niet voldoende voor straattaxivervoer.","Een NS-vervoerbewijs is voor de trein, niet voor de taxi.","Voor straattaxivervoer is een TTO nodig, geen provinciale ontheffing."],"bron":"CBR ET 4","hint":"TTO staat voor Toegelaten Taxi Organisatie; die hoort bij straattaxi in grote steden.","simpel":"Een taxichauffeur wil in een grote stad passagiers op straat laten instappen. Welke toelating heeft hij nodig?","kern":["taxi","grote stad","toelating"]},{"id":"s2-t4-k03","tak":4,"niveau":"kruipen","et":"ET 4.1","type":"mc","q":"Bij de controle vóór de rit ziet Krijger dat een ruitenwisser is gescheurd. Wat moet hij doen?","opts":["Toch rijden zolang het niet regent","Een briefje op het dashboard plakken","De ruitenwisser vervangen of repareren voordat de rit start","Alleen 's nachts rijden"],"ok":2,"why":"Een defecte ruitenwisser is een veiligheidsrisico, vooral bij regen. De chauffeur is verantwoordelijk voor een veilig voertuig en moet het gebrek eerst verhelpen.","wrong":["Ook zonder regen is een kapotte ruitenwisser onveilig.","Een briefje herstelt het defect niet.","","Ook 's nachts kan de ruitenwisser nodig zijn."],"bron":"CBR ET 4","hint":"Een gebrek aan het voertuig kan de veiligheid in gevaar brengen; niet starten totdat het is opgelost.","simpel":"Voor de rit ziet Krijger dat een ruitenwisser kapot is. Wat moet hij doen?","kern":["ruitenwisser","defect","vervangen"]},{"id":"s2-t4-k04","tak":4,"niveau":"kruipen","et":"ET 4.2","type":"mc","q":"Krijger heeft een hoestdrank ingenomen waarop staat 'kan slaperigheid veroorzaken'. Wat moet hij doen voordat hij gaat rijden?","opts":["Toch rijden met het raam open","Een dubbele dosis koffie drinken","Alleen korte ritten doen","Niet rijden en overleggen met de werkgever of arts"],"ok":3,"why":"Medicijnen met een waarschuwing voor slaperigheid kunnen de rijvaardigheid verminderen. Niet rijden is de enige veilige keuze; koffie helpt niet tegen dat effect.","wrong":["Het raam open helpt niet tegen slaperigheid.","Koffie helpt niet tegen het effect van het medicijn.","Ook korte ritten zijn onveilig met dit medicijn.",""],"bron":"CBR ET 4","hint":"Waarschuwing 'kan rijvaardigheid beïnvloeden' is een rode vlag; geen medicijnen achter het stuur die slaperig maken.","simpel":"Krijger heeft hoestdrank gebruikt waar hij slaperig van kan worden. Wat moet hij doen voor het rijden?","kern":["hoestdrank","slaperig","niet rijden"]},{"id":"s2-t4-k05","tak":4,"niveau":"kruipen","et":"ET 4.3","type":"mc","q":"Bij het afslaan naar rechts op een kruispunt ziet Krijger een fietser naast zijn taxi. Wat is de juiste manier om af te slaan?","opts":["Gas geven en vóór de fietser langs","De fietser voor laten gaan en daarna afslaan","Toeteren en doorrijden","De fietser rechts inhalen"],"ok":1,"why":"Bij afslaan moet de bestuurder rechtdoorgaand verkeer op dezelfde weg voor laten gaan. Fietsers zijn kwetsbaar en kunnen zich in de dode hoek bevinden.","wrong":["Dan snijd je de fietser af en ontstaat gevaar.","","Toeteren geeft de fietser geen veilige ruimte.","Rechts inhalen is gevaarlijk en mag hier niet."],"bron":"RVV 18","hint":"Fietsers zijn kwetsbaar en zitten vaak in de dode hoek; eerst laten passeren.","simpel":"Krijger slaat rechtsaf. Naast zijn taxi fietst iemand. Wat moet hij doen?","kern":["afslaan","fietser","voor laten gaan"]},{"id":"s2-t4-k06","tak":4,"niveau":"kruipen","et":"ET 4.4","type":"mc","q":"Wat is een voorbeeld van zuinig en comfortabel rijden in de taxi?","opts":["Vroeg opschakelen en een gelijkmatige snelheid aanhouden","Zo snel mogelijk optrekken en hard remmen","Stationair de motor warm laten draaien","In een lage versnelling met hoge toeren rijden"],"ok":0,"why":"Vroeg opschakelen en een constante snelheid besparen brandstof/energie en verminderen slijtage. Hard optrekken en bruusk remmen zijn oncomfortabel en onzuinig.","wrong":["","Dat is onzuinig en oncomfortabel.","Stationair draaien kost brandstof zonder te rijden.","In een lage versnelling met hoge toeren rijden verbruikt meer en maakt lawaai."],"bron":"CBR ET 4","hint":"Gelijkmatig rijden zonder bruusk remmen of gas geven bespaart energie en is prettig voor de passagier.","simpel":"Wat is zuinig en comfortabel rijden in de taxi?","kern":["zuinig","comfortabel","rijden"]},{"id":"s2-t4-k07","tak":4,"niveau":"kruipen","et":"ET 11.3","type":"mc","q":"Krijger rijdt op de A28 van Utrecht naar Groningen. De navigatie valt uit. Wat is de beste reactie?","opts":["Bij het eerstvolgende tankstation stoppen en een papieren kaart kopen","Stoppen op de vluchtstrook om op de telefoon te kijken","De NBd-bewegwijzering blijven volgen en letten op de aanduiding 'Groningen'","De eerste afslag nemen en daar een willekeurige route zoeken"],"ok":2,"why":"De NBd-bewegwijzering is speciaal voor doorgaand verkeer en blijft bruikbaar zonder navigatie. Stoppen op de vluchtstrook is alleen voor noodgevallen en gevaarlijk.","wrong":["De NBd-bewegwijzering blijft bruikbaar; een papieren kaart kopen is niet nodig.","Stoppen op de vluchtstrook is alleen voor noodgevallen en gevaarlijk.","","De NBd-borden zijn betrouwbaarder dan willekeurig een route zoeken."],"bron":"CBR ET 4","hint":"De borden van de NBd wijzen de weg; vluchtstrook is alleen voor noodgevallen.","simpel":"De navigatie valt uit op de snelweg. Wat moet Krijger doen?","kern":["navigatie valt uit","A28","Groningen"]},{"id":"s2-t4-k09","tak":4,"niveau":"kruipen","et":"ET 11.2","type":"mc","q":"Krijger rijdt op de autosnelweg A12 van Utrecht richting het oosten. De navigatie gaat plotseling uit. Welke grote stad zal hij op deze route tegenkomen op de blauwe NBd-borden?","opts":["Amsterdam","Rotterdam","Arnhem","Groningen"],"ok":2,"why":"De A12 loopt van Den Haag via Utrecht naar Arnhem en de Duitse grens. Groningen ligt aan de A28 en Amsterdam aan de A2.","wrong":["Amsterdam ligt aan de A2, niet aan de A12.","Rotterdam ligt niet aan de A12; de A12 loopt van Den Haag naar de Duitse grens.","","Groningen ligt aan de A28, niet aan de A12."],"bron":"CBR ET 11.2","hint":"De A12 gaat van de Randstad naar de Duitse grens.","simpel":"Krijger rijdt op de A12 van Utrecht naar het oosten. De navigatie valt uit. Welke grote stad ziet hij op de blauwe borden?","kern":["A12","oosten","NBd-borden"]},{"id":"s2-t4-k10","tak":4,"niveau":"kruipen","et":"ET 4.4","type":"mc","q":"Krijger wil zuinig en comfortabel rijden voor zijn passagier. Wat is de beste techniek bij het naderen van een rood verkeerslicht?","opts":["Tot het laatste moment gas geven en dan hard remmen.","De auto in de vrij zetten en uit laten rollen.","Ver vooruitkijken en de auto tijdig in de versnelling laten uitrollen.","Snel terugschakelen naar de eerste versnelling om af te remmen op de motor."],"ok":2,"why":"Door te anticiperen en uit te rollen in de versnelling verbruikt de auto geen brandstof en is de rit rustiger voor de passagier. De auto in de vrij zetten is minder veilig en minder zuinig.","wrong":["Hard remmen is niet comfortabel en kost extra brandstof.","In de vrij rollen is minder veilig en minder zuinig.","","Snel terugschakelen naar de eerste versnelling geeft een schok en is niet comfortabel."],"bron":"CBR ET 4.3","hint":"Kijk ver vooruit en laat het gas op tijd los.","simpel":"Krijger wil zuinig en rustig rijden. Hij nadert een rood verkeerslicht. Wat is de beste manier?","kern":["zuinig","comfortabel","rood verkeerslicht"]},{"id":"s2-t4-k11","tak":4,"niveau":"kruipen","et":"ET 4.3","type":"mc","q":"Krijger rijdt in een woonwijk (erf). Hij ziet plotseling een bal de straat op rollen. Waar moet hij direct rekening mee houden?","opts":["Dat er een kind achter de bal aan kan rennen.","Dat de bal zijn autoband kan beschadigen.","Dat hij een boete krijgt als hij stopt op een erf.","Dat de bal tegen de ruit van een geparkeerde auto stoot."],"ok":0,"why":"Kinderen zijn kwetsbare weggebruikers en reageren vaak impulsief; ze rennen vaak zonder te kijken achter hun speelgoed aan. Op een erf moet je extra alert zijn op spelende kinderen.","wrong":["","Een bal beschadigt de band niet; een kind kan achter de bal aan rennen.","Op een erf mag je stoppen voor gevaar; dat is geen overtreding.","Schade aan een geparkeerde auto is minder erg dan een aanrijding met een kind."],"bron":"CBR ET 4.2","hint":"Waar een bal rolt, volgt vaak een kind.","simpel":"Krijger rijdt in een woonwijk. Een bal rolt de straat op. Wat kan er direct gebeuren?","kern":["erf","bal","direct"]},{"id":"s2-t4-k12","tak":4,"niveau":"kruipen","et":"ET 4.1","type":"mc","q":"Het regent erg hard. Krijger doet zijn dagelijkse controle aan de buitenkant van de taxi. Welk punt is nu het belangrijkst voor de veiligheid?","opts":["De kleur van het kentekenbewijs.","De aanwezigheid van de tariefkaart op de ruit.","De profieldiepte van de banden en de ruitensproeiervloeistof.","Het keuringszegel op de taxameter."],"ok":2,"why":"Goede profieldiepte voorkomt aquaplaning bij zware regen, en ruitensproeiervloeistof is nodig voor goed zicht. De andere punten zijn administratief en niet direct voor de veiligheid in de regen.","wrong":["De kleur van het kentekenbewijs is administratief en niet belangrijk voor de veiligheid in de regen.","De tariefkaart is belangrijk voor de passagier, maar niet voor de rijveiligheid in de regen.","","Het keuringszegel gaat over de taxameter, niet over grip of zicht in de regen."],"bron":"CBR ET 4.1","hint":"Goed zicht en grip op de weg zijn het belangrijkst bij regen.","simpel":"Het regent hard. Krijger controleert de buitenkant van de taxi. Wat is nu het belangrijkst voor de veiligheid?","kern":["regen","controle buitenkant","veiligheid"]},{"id":"s2-t4-k13","tak":4,"niveau":"kruipen","et":"ET 4.2","type":"mc","q":"Krijger heeft een erg lange dag gehad en voelt dat hij moe wordt. Hij moet nog één korte rit doen. Wat is de meest professionele keuze?","opts":["Een blikje energiedrank drinken en snel de rit afmaken.","Met het raam open rijden voor frisse lucht tegen de slaap.","De auto op een veilige plek parkeren en kort rusten of de rit weigeren.","Hardere muziek aanzetten om wakker te blijven."],"ok":2,"why":"Vermoeidheid is een groot risico voor de verkeersveiligheid; alleen rust helpt echt. Energiedrank of frisse lucht maskeren de vermoeidheid slechts heel even.","wrong":["Energiedrank helpt maar heel even en lost vermoeidheid niet op.","Frisse lucht maskeert vermoeidheid maar heel kort; het is niet veilig.","","Hardere muziek helpt niet tegen echte vermoeidheid."],"bron":"CBR ET 4.2","hint":"Alleen rust helpt echt tegen slaap.","simpel":"Krijger is moe na een lange dag. Hij moet nog een korte rit doen. Wat kiest hij als professional?","kern":["lange dag","moe","professionele keuze"]},{"id":"s2-t4-l01","tak":4,"niveau":"lopen","et":"ET 3.1","type":"mc","q":"Een passagier belt de centrale voor een rit van het station naar een hotel. Er is geen vooraf bestaand contract. Hoe heet dit vervoer?","opts":["Contractvervoer","Opstapvervoer","Straattaxi","Keurmerkvervoer"],"ok":2,"why":"Een rit zonder vooraf vastgelegd contract is straattaxi. Contractvervoer is vervoer op basis van een overeenkomst, bijvoorbeeld met een gemeente of instelling. Bron: CBR ET 4.","wrong":["Contractvervoer is vervoer op basis van een vooraf vastgelegd contract.","Opstapvervoer is hier niet de juiste term, want er is geen vooraf bestaand contract.","","Keurmerkvervoer is vervoer onder een keurmerk, niet van toepassing op deze losse rit."],"bron":"CBR ET 4"},{"id":"s2-t4-l02","tak":4,"niveau":"lopen","et":"ET 4.2","type":"mc","q":"Krijger heeft een nieuw allergiemedicijn gekregen. Op de bijsluiter staat dat het de rijvaardigheid kan beïnvloeden. Wat moet Krijger doen?","opts":["Toch rijden, want hij voelt zich prima","Niet rijden en eerst met een arts of apotheker overleggen","Alleen korte ritten rijden","Extra koffie drinken en gewoon rijden"],"ok":1,"why":"Bij medicijnen die de rijvaardigheid kunnen beïnvloeden, mag Krijger niet rijden. Hij moet eerst advies vragen aan een arts of apotheker. Sufheid door medicijnen is een risico voor de verkeersveiligheid. Bron: CBR ET 4.","wrong":["Medicijnen kunnen de rijvaardigheid beïnvloeden, ook als Krijger zich prima voelt.","","Ook korte ritten zijn onveilig met medicijnen die de rijvaardigheid beïnvloeden.","Koffie helpt niet tegen de effecten van medicijnen op de rijvaardigheid."],"bron":"CBR ET 4"},{"id":"s2-t4-l04","tak":4,"niveau":"lopen","et":"ET 4.3","type":"mc","q":"Krijger rijdt door een woonwijk. Op de stoep spelen kinderen. Wat verwacht de exameneis van een professionele chauffeur?","opts":["Snelheid verhogen om snel voorbij te zijn","Toeteren om de kinderen te waarschuwen","Gewoon doorrijden, kinderen letten zelf op","Snelheid verlagen en extra alert zijn op onverwachte bewegingen"],"ok":3,"why":"Kinderen zijn kwetsbare weggebruikers en kunnen plotseling oversteken. De chauffeur moet snelheid verlagen en extra opletten. Dat past bij veilig rijden volgens CBR ET 4.","wrong":["Snelheid verhogen vergroot het risico voor kinderen.","Toeteren is niet de professionele reactie; snelheid verlagen en alert zijn is vereist.","Kinderen kunnen onverwacht oversteken; je moet extra opletten.",""],"bron":"CBR ET 4"},{"id":"s2-t4-l05","tak":4,"niveau":"lopen","et":"ET 11.3","type":"mc","q":"Tijdens een lange rit valt de navigatie uit. Krijger kent de omgeving slecht. Wat is de beste aanpak?","opts":["Stoppen op de vluchtstrook en wachten tot de navigatie weer werkt","Terugrijden naar het beginpunt","Zelf op de borden letten, rustig blijven en de passagier informeren","De passagier vragen de hele route te bepalen en zelf niets te doen"],"ok":2,"why":"Bij uitval van de navigatie moet Krijger rustig blijven, de bewegwijzering volgen en de passagier informeren. Stoppen op de vluchtstrook of terugrijden is onveilig of onjuist. Bron: CBR ET 4.","wrong":["Stoppen op de vluchtstrook is alleen voor noodgevallen en gevaarlijk.","Terugrijden naar het beginpunt is onveilig en onnodig.","","De chauffeur blijft verantwoordelijk voor de route en moet zelf op de borden letten."],"bron":"CBR ET 4"},{"id":"s2-t4-l06","tak":4,"niveau":"lopen","et":"ET 11.3","type":"mc","q":"Krijger rijdt op de autosnelweg A2 van Utrecht naar Maastricht. Opeens valt zijn navigatiesysteem uit. Welke borden boven de weg kan hij het beste volgen om de juiste steden te vinden?","opts":["De borden van de Nationale Bewegwijzeringsdienst (NBd).","De borden van de ANWB.","De borden voor lokale doelen.","De gele borden voor omleidingen."],"ok":0,"why":"De NBd verzorgt de bewegwijzering langs rijkswegen; deze borden geven de doorgaande richting en afritten aan. De ANWB is niet meer verantwoordelijk; lokale en gele tijdelijke borden zijn niet bedoeld voor langeafstandsnavigatie.","wrong":["","De ANWB is niet verantwoordelijk voor de borden; de NBd wel.","Lokale borden zijn niet bedoeld voor langeafstandsnavigatie.","Gele borden zijn tijdelijk en alleen voor omleidingen, niet voor de normale route."],"bron":"CBR ET 11.2"},{"id":"s2-t4-l07","tak":4,"niveau":"lopen","et":"ET 3.1","type":"mc","q":"Krijger werkt voor een bedrijf dat vaste ritten rijdt voor een zorgverzekeraar. Hij haalt elke dag dezelfde patiënten op voor hun nierdialyse. Hoe heet deze vorm van vervoer?","opts":["Straattaxi","Opstapvervoer","TTO-vervoer","Contractvervoer"],"ok":3,"why":"Vervoer dat op basis van een vooraf gemaakte afspraak (contract) voor een langere periode wordt uitgevoerd, heet contractvervoer. Straattaxi en opstapvervoer gaan over ritten die op de standplaats of op straat worden aangenomen.","wrong":["Straattaxi is voor ritten die op straat of standplaats worden aangenomen, niet voor vaste afspraken.","Opstapvervoer is voor ritten die op straat of standplaats worden aangenomen, niet voor contractritten.","TTO-vervoer is een keurmerk, geen vervoersvorm op basis van een contract.",""],"bron":"CBR ET 3.1"},{"id":"s2-t4-l08","tak":4,"niveau":"lopen","et":"ET 4.2","type":"mc","q":"Het is erg druk en Krijger heeft lichte hoofdpijn. Hij wil een paracetamol met codeïne innemen. Waar moet hij rekening mee houden?","opts":["Niets, een paracetamol mag je altijd gebruiken.","Medicijnen met een gele sticker kunnen de rijvaardigheid beïnvloeden.","Hij moet alleen oppassen als hij ook alcohol drinkt.","Hij mag alleen rijden als de passagier het goedvindt."],"ok":1,"why":"Medicijnen met een gele sticker (zoals die met codeïne) kunnen sufheid veroorzaken en de reactiesnelheid verlagen. Als chauffeur ben je verantwoordelijk om alleen te rijden als je daar fit genoeg voor bent.","wrong":["Paracetamol met codeïne kan suf maken; het is niet zonder risico.","","Het medicijn zelf kan al suf maken, ook zonder alcohol.","De chauffeur is zelf verantwoordelijk, niet de passagier."],"bron":"CBR ET 4.1"},{"id":"s2-t4-l09","tak":4,"niveau":"lopen","et":"ET 4.1","type":"mc","q":"Tijdens de dagelijkse voertuigcontrole controleert Krijger de banden van de taxi. Waarom is de juiste bandenspanning zo belangrijk?","opts":["De taxameter werkt dan nauwkeuriger.","Het zorgt voor een betere wegligging en een kortere remweg.","De auto wordt minder snel vies aan de buitenkant.","Het is verplicht voor de groene kaart."],"ok":1,"why":"Een juiste bandenspanning zorgt voor optimaal contact met de weg, wat essentieel is voor de veiligheid en het comfort van de passagier. Te zachte banden zorgen bovendien voor een hoger brandstofverbruik en meer slijtage.","wrong":["De bandenspanning heeft geen invloed op de taxameter.","","Bandenspanning heeft niets te maken met vuil op de auto.","De groene kaart is een verzekeringsdocument, geen bandencontrole."],"bron":"CBR ET 4.3"},{"id":"s2-t4-l10","tak":4,"niveau":"lopen","et":"ET 11.2","type":"mc","q":"Een passagier vraagt Krijger om van Utrecht naar de hoofdstad van de provincie Overijssel te rijden. Welke stad en welke rijksweg zijn de meest logische keuze?","opts":["Naar Zwolle via de A28.","Naar Deventer via de A1.","Naar Enschede via de A12.","Naar Assen via de A6."],"ok":0,"why":"Zwolle is de hoofdstad van Overijssel. De A28 is de directe rijksweg die Utrecht met Zwolle verbindt.","wrong":["","Deventer is niet de hoofdstad van Overijssel.","Enschede is niet de hoofdstad en de A12 gaat niet naar Enschede.","Assen ligt in Drenthe en de A6 gaat niet naar Assen."],"bron":"CBR ET 11.2"},{"id":"s2-t4-r01","tak":4,"niveau":"rennen","et":"ET 3.1","type":"mc","q":"Krijger staat met zijn taxi op een officiële taxistandplaats. Een passagier stapt zonder afspraak in en wil naar een winkelcentrum. Krijger rekent af volgens de taxameter. Welke vorm van taxivervoer is dit?","opts":["Contractvervoer","Openbaar vervoer","Straattaxi","Belbus"],"ok":2,"why":"Een vrije instap vanaf een standplaats met betaling volgens de taxameter is straattaxi. Contractvervoer is vooraf afgesproken vervoer tegen een vast contracttarief. Openbaar vervoer en belbus zijn geen taxivormen.","wrong":["Contractvervoer is vervoer op basis van een vooraf vastgelegd contract.","Openbaar vervoer is geen taxivorm; dit is straattaxi.","","Een belbus is vooraf te reserveren vervoer, geen vrije instap vanaf een standplaats."],"bron":"CBR ET 3.1"},{"id":"s2-t4-r02","tak":4,"niveau":"rennen","et":"ET 4.1","type":"mc","q":"Krijger vertrouwt op de APK-keuring en doet daarom 's ochtends geen voertuigcontrole. Is dat verantwoord?","opts":["Ja, de APK vervangt de dagelijkse controle","Nee, een dagelijkse controle is nodig om tussentijdse gebreken te ontdekken","Ja, alleen bij korte ritten is controle niet nodig","Nee, alleen de banden moeten dagelijks gecontroleerd worden"],"ok":1,"why":"Een APK is een periodieke keuring en geen vervanging van de dagelijkse rijklaarcontrole. Tussentijdse gebreken zoals lekkage, verlichting of bandenspanning kunnen de veiligheid direct in gevaar brengen.","wrong":["De APK is een periodieke keuring en vervangt de dagelijkse controle niet.","","Ook bij korte ritten kunnen gebreken ontstaan; controle is altijd nodig.","Niet alleen banden, ook verlichting, vloeistoffen en andere zaken moeten dagelijks gecontroleerd worden."],"bron":"CBR ET 3.2"},{"id":"s2-t4-r06","tak":4,"niveau":"rennen","et":"ET 11.3","type":"mc","q":"Tijdens een rit op een autoweg valt de navigatie uit. Krijger moet naar een provinciehoofdstad. Wat is de beste aanpak?","opts":["Op de vluchtstrook stoppen om de navigatie te resetten","Omkeren en terugrijden naar het laatste bekende punt","De borden van de NBd volgen","De passagier vragen de weg te lezen van een app"],"ok":2,"why":"De Nationale Bewegwijzeringsdienst (NBd) geeft route-informatie naar steden en regio's. Stoppen op de vluchtstrook mag alleen bij nood, en omkeren op een autoweg is gevaarlijk en verboden. De passagier is geen verkeersinformatiedienst.","wrong":["Stoppen op de vluchtstrook is alleen voor noodgevallen en gevaarlijk.","Omkeren op een autoweg is gevaarlijk en verboden.","","De passagier is geen betrouwbare verkeersinformatiedienst; de NBd-borden zijn geschikter."],"bron":"CBR ET 4.4"},{"id":"s2-t4-r07","tak":4,"niveau":"rennen","et":"ET 3.1","type":"mc","q":"Krijger rijdt een vaste groep ouderen naar een dagopvang. De ritten zijn vooraf besteld door de gemeente. Welke vorm van vervoer is dit?","opts":["Dit is straattaxi-vervoer.","Dit is opstapvervoer.","Dit is contractvervoer.","Dit is TTO-vervoer."],"ok":2,"why":"Contractvervoer wordt vooraf afgesproken en vaak door een derde partij, zoals een gemeente of verzekeraar, betaald. Bij straattaxi of opstapvervoer stapt de klant direct in of bestelt deze zelf een rit.","wrong":["Straattaxi is voor direct bestelde ritten op straat, niet vooraf door gemeente geregeld.","Opstapvervoer is voor direct instappen op een standplaats, niet vooraf besteld.","","TTO is een kwaliteitsregeling voor de opstapmarkt, geen vervoersvorm."],"bron":"CBR ET 3.1"},{"id":"s2-t4-r09","tak":4,"niveau":"rennen","et":"ET 4.2","type":"mc","q":"Krijger voelt zich tijdens een lange nachtrit erg moe worden. Wat is de enige veilige manier om weer fit te worden?","opts":["Een raam openzetten voor koude lucht.","De radio een stuk harder zetten.","Twee koppen sterke koffie drinken.","De taxi veilig parkeren en kort gaan slapen."],"ok":3,"why":"Alleen slaap herstelt de concentratie bij vermoeidheid. Hulpmiddelen zoals koffie, koude lucht of harde muziek werken slechts een paar minuten en zijn onveilig voor een professionele chauffeur.","wrong":["Koude lucht helpt maar even en lost vermoeidheid niet op.","Harde muziek leidt af en herstelt concentratie niet.","Koffie werkt tijdelijk en is geen oplossing voor echte vermoeidheid.",""],"bron":"CBR ET 4.1"},{"id":"s2-t4-r11","tak":4,"niveau":"rennen","et":"ET 4.3","type":"mc","q":"Krijger nadert een kruispunt. Een oudere man met een looprek wil oversteken op een plek waar geen zebrapad is. Wat moet Krijger doen?","opts":["Doorrijden, want de voetganger heeft geen voorrang zonder zebrapad.","Alleen stoppen als de man een witte stok met rode ringen vasthoudt.","De man altijd voor laten gaan omdat hij moeilijk ter been is.","Toeteren om te waarschuwen dat de man moet wachten."],"ok":2,"why":"Bestuurders moeten blinden met een witte stok met rode ringen en alle personen die zich moeilijk voortbewegen voor laten gaan. Een man met looprek valt daaronder; dit geldt ook buiten een zebrapad (RVV 49 lid 1).","wrong":["Personen die moeilijk lopen moeten altijd voor, ook zonder zebrapad.","Ook mensen met een looprek zijn kwetsbaar en moet je voor laten.","","Toeteren is niet de juiste reactie; je moet stoppen."],"bron":"RVV 49 lid 1"},{"id":"s2-t4-r12","tak":4,"niveau":"rennen","et":"ET 3.2","type":"mc","q":"Krijger wil op een standplaats in een grote stad gaan staan. Hij ziet dat er een Toegelaten Taxi Organisatie (TTO) actief is. Wat is een kenmerk van een TTO?","opts":["Een TTO is verplicht voor al het contractvervoer in Nederland.","Een TTO is een vakbond voor alle taxichauffeurs in loondienst.","Een TTO voert regels uit voor de opstapmarkt in een bepaalde gemeente.","Een TTO vervangt de verplichte boordcomputer in de taxi."],"ok":2,"why":"Gemeenten kunnen een TTO aanwijzen om de kwaliteit op de opstapmarkt (standplaatsen) te verbeteren. Chauffeurs moeten aan extra eisen voldoen om daar te mogen werken.","wrong":["TTO geldt voor de opstapmarkt, niet voor al het contractvervoer.","Een TTO is geen vakbond, maar een organisatie voor kwaliteit.","","De boordcomputer blijft verplicht; een TTO is iets anders."],"bron":"CBR ET 3.1"},{"id":"s2-t5-k01","tak":5,"niveau":"kruipen","et":"ET 5.1","type":"mc","q":"Krijger ziet op de autosnelweg een ongeval vlak voor hem. Er is nog geen hulp aanwezig. Wat doet Krijger eerst?","opts":["Hij zet zijn veiligheidshesje aan en gaat achter de vangrail staan.","Hij begint meteen met reanimeren.","Hij vult alvast het Europees schadeformulier in.","Hij belt eerst zijn taxibedrijf."],"ok":0,"why":"PAMAN begint met Persoonlijke veiligheid: eerst jezelf in veiligheid brengen. Reanimeren is pas later (Noodzakelijke hulp), niet eerst. Het schadeformulier is voor schade, niet voor hulpverlening.","wrong":["","Reanimeren is pas later bij noodzakelijke hulp.","Het schadeformulier is voor schade, niet voor hulpverlening.","Zijn taxibedrijf bellen is niet de eerste stap."],"bron":"CBR ET 5","hint":"Denk aan de eerste letter van PAMAN.","simpel":"Krijger ziet een ongeval op de snelweg. Er is nog geen hulp. Wat doet Krijger eerst?","kern":["ongeval","autosnelweg","eerste actie"]},{"id":"s2-t5-k02","tak":5,"niveau":"kruipen","et":"ET 5.2","type":"mc","q":"Krijger rijdt in de bebouwde kom en raakt een geparkeerde auto. Er is alleen blikschade. Welk document vullen beide bestuurders samen in?","opts":["Het keuringsbewijs van de taxameter","Het Europees schadeformulier","Het APK-keuringsrapport","De taxi-informatiekaart"],"ok":1,"why":"Bij materiële schade vul je het Europees schadeformulier in. Dat is het formulier voor een aanrijding, niet voor voertuigdocumenten. Taxameter en APK gaan over technische keuringen.","wrong":["Het keuringsbewijs is voor de taxameter, niet voor schade.","","Het APK-rapport is voor de technische keuring, niet voor schade.","De taxi-informatiekaart is een voertuigdocument, geen schadeformulier."],"bron":"CBR ET 5","hint":"Dit formulier is blauw en speciaal voor na een aanrijding.","simpel":"Krijger raakt een geparkeerde auto in de bebouwde kom. Alleen blikschade. Welk document vullen beide bestuurders in?","ke
