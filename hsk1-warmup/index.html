<style>:root{--bg:#0e0d0b;--sf:#171512;--sf2:#1f1c18;--fg:#f2ece3;--mu:#a39a8f;--bd:#2c2823;--ok:#6fae7f;--no:#d0705c;--ac:#e07a63}

function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>/zh/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}

function part(id,title,sub,groups,descs){const S=document.getElementById(id);
S.innerHTML='<h2>'+title+'</h2><p class="mu">'+sub+'</p><div class="row chips"></div><p class="mu desc"></p><p class="mu st"></p><button class="card"><span class="zh"></span><br><span class="mu">tik om te horen</span></button><div class="opts"></div><p class="fb" aria-live="polite"></p>';
const q=s=>S.querySelector(s),all=groups.flatMap(g=>g[1]);let items,ord,i,sc,first;
groups.forEach((g,gi)=>{const b=document.createElement('button');b.className='chip';b.textContent=g[0]+' ('+g[1].length+')';b.onclick=()=>{S.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');start(gi)};q('.chips').append(b)});
function start(gi){items=groups[gi][1];q('.desc').textContent=descs?descs[gi]||'':'';ord=sh(items.map((_,k)=>k));i=0;sc=0;next()}
function next(){const o=q('.opts');o.innerHTML='';q('.fb').textContent='';
if(i>=ord.length){q('.st').textContent=sc+' van '+items.length+' in één keer goed. '+G.slot;q('.zh').textContent='';const b=document.createElement('button');b.textContent='Nog een rondje';b.onclick=()=>{ord=sh(ord);i=0;sc=0;next()};o.append(b);return}

const pool=sh(all.filter(x=>x[mode]!==it[mode]&&x[0]!==it[0]));const same=pool.filter(x=>items.includes(x));const dis=[...new Set([...same,...pool].map(x=>x[mode]))].slice(0,3);
sh([it[mode],...dis]).forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(v===it[mode]){b.className='ok';q('.fb').textContent=pick(G.goed)+' '+it[0]+' · '+it[1]+' · '+it[2];if(first)sc++;i++;setTimeout(next,1300)}else{b.className='no';first=false;q('.fb').textContent=pick(G.bijna)}};o.append(b)})}
