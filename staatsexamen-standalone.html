<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staatsexamen Chinees · eigen oefenblad</title>
<style>
  :root {
    --papier: #F4EFE6;
    --inkt: #222222;
    --bij: #5C564F;
    --lijn: #d9d0c3;
    --rood: #D62828;
    --groen: #1A9E6E;
    --blauw: #1E6FD9;
    --vlak: #EDE6DA;
    --goed: #E5F4EC;
    --mis: #FDECEE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--papier); color: var(--inkt); }
  body {
    font: 18px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 72px 16px 48px;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px 12px; background: #E7E0D4; border-bottom: 1px solid var(--lijn);
  }
  nav button, button {
    font: 16px/1 "Segoe UI", sans-serif;
    min-height: 44px; padding: 0 14px;
    border: 1px solid #222; border-radius: 8px;
    background: var(--papier); color: var(--inkt); cursor: pointer;
  }
  nav button.aan, button.aan { background: var(--inkt); color: var(--papier); }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 22px; margin: 28px 0 8px; }
  p { margin: 0 0 12px; }
  .bij { color: var(--bij); font-size: 16px; }
  .kaart {
    background: var(--vlak); border: 1px solid var(--lijn);
    border-radius: 12px; padding: 16px; margin: 0 0 14px;
  }
  .hz { color: var(--rood); font-size: 32px; line-height: 1.35; font-weight: 600; }
  .py { color: var(--groen); font-size: 16px; margin-top: 2px; }
  .rij { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .keuze { text-align: left; }
  .keuze.goed { background: var(--goed); border-color: var(--groen); }
  .keuze.mis { background: var(--mis); border-color: var(--rood); }
  textarea {
    width: 100%; min-height: 160px; font: 28px/1.4 "Microsoft YaHei", sans-serif;
    color: var(--rood); background: #fffdf8; border: 1px solid var(--lijn);
    border-radius: 10px; padding: 12px;
  }
  .punt { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
  .vink { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bij); flex: none; margin-top: 2px; }
  .vink.aan { background: var(--groen); border-color: var(--groen); }
  .klok { font-size: 56px; letter-spacing: 1px; margin: 8px 0; }
  .fase { color: var(--blauw); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; }
  td { border-bottom: 1px solid var(--lijn); padding: 8px 4px; vertical-align: middle; }
  td.tijd { color: var(--blauw); font-weight: 700; width: 7em; }
  .tafel {
    width: 180px; height: 180px; margin: 8px auto; position: relative;
    border: 8px solid var(--inkt); border-radius: 50%; background: #fffdf8;
  }
  .wijzer {
    position: absolute; left: 50%; top: 50%; background: var(--inkt);
    transform-origin: bottom center;
  }
  .uur { width: 6px; height: 48px; margin-left: -3px; }
  .min { width: 3px; height: 68px; margin-left: -1px; background: var(--rood); }
  .kom { text-align: center; color: var(--rood); font-size: 40px; font-weight: 700; margin-top: 8px; }
  .verborgen .py, body.examen .py { display: none; }
  .score { font-variant-numeric: tabular-nums; }
  select, input.typ, input.zoek {
    font: 18px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--inkt); background: #fffdf8;
    border: 1px solid #222; border-radius: 8px;
    min-height: 44px; max-width: 100%;
  }
  input.typ { width: 100%; font-size: 32px; color: var(--rood); padding: 10px; }
  input.zoek { width: 100%; padding: 8px 12px; }
  .groot { font-size: 56px; line-height: 1.15; color: var(--rood); font-weight: 700; margin: 8px 0; }
  .vraag { font-size: 26px; margin: 8px 0; }
  .balk { height: 8px; background: #e7e0d4; border-radius: 4px; margin: 8px 0; }
  .balk div { height: 8px; background: var(--groen); border-radius: 4px; }
  .lijst { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--lijn); }
</style>
</head>
<body>
<nav>
  <button type="button" data-scherm="kruip" class="aan">Kruip</button>
  <button type="button" data-scherm="loop">Loop</button>
  <button type="button" data-scherm="ren">Ren</button>
  <button type="button" data-scherm="boek">Boek</button>
  <button type="button" data-scherm="examen">Examen</button>
  <button type="button" id="pinyin">Verberg pinyin</button>
</nav>
<main id="app"></main>
<script>
const SLEUTEL = "staatsexamen_a1_v1";
const stand = Object.assign({ goed: {}, pinyin: true }, JSON.parse(localStorage.getItem(SLEUTEL) || "{}"));
const NAMEN = ["leerling A", "leerling B", "leerling C"];
function leegWerk() {
  return {
    kruipGoed: {}, loopGoed: {}, renGoed: {}, loopAt: {}, paraAt: {},
    renOpen: {}, ch: "1", renDeel: "schrijf", gesprek: "", zoek: "",
    gehaald: {}, kaart: null, loopKaart: null, renSet: null,
    paraZien: null, paraTyp: "", agendaZin: ""
  };
}
if (!stand.per) {
  const sa = leegWerk();
  ["kruipGoed", "loopGoed", "renGoed", "loopAt", "paraAt", "renOpen"].forEach(k => {
    if (stand[k] && typeof stand[k] === "object") sa[k] = stand[k];
  });
  if (stand.ch) sa.ch = stand.ch;
  if (stand.renDeel) sa.renDeel = stand.renDeel;
  stand.per = { "leerling A": sa, "leerling B": leegWerk(), "leerling C": leegWerk() };
}
stand.wie = NAMEN.indexOf(stand.wie) >= 0 ? stand.wie : "leerling A";
NAMEN.forEach(n => { if (!stand.per[n]) stand.per[n] = leegWerk(); });
function nu() {
  if (!stand.per[stand.wie]) stand.per[stand.wie] = leegWerk();
  const p = stand.per[stand.wie];
  if (!p.gehaald) p.gehaald = {};
  return p;
}
function bewaar() { localStorage.setItem(SLEUTEL, JSON.stringify(stand)); }

const LEES = [

    ]

    ],

      ["Wat doen ze om tien uur?", ["thee drinken", "eten", "schrijven"], 0],
      ["Wat doen ze om twaalf uur?", ["eten", "thee drinken", "slapen"], 0]
    ]
  },

    titel: "Tekst 3 · wie ben ik",
    regels: [
      ["我叫安安。", "wǒ jiào Ān'ān"],
      ["我是学生。", "wǒ shì xuéshēng"],
      ["我住在荷兰。", "wǒ zhù zài Hélán"],

const HOOR = [
  {
    id: "klok",
    titel: "Kijk en hoor · de klok",
    kijk: "klok",
    zin: ["我们三点喝茶。", "wǒmen sān diǎn hē chá"],

  {

    titel: "Hoor · thuis",

const SCHRIJF = {

  punten: [

};

const PAPIER = {

  punten: [

  ],
  model: [

    ["我现在在图书馆。", "wǒ xiànzài zài túshūguǎn"],
    ["我在看书。", "wǒ zài kàn shū"],
    ["你五点有时间吗？", "nǐ wǔ diǎn yǒu shíjiān ma"],
    ["我等你。", "wǒ děng nǐ"]
  ]
};

const MOND = [
  {
    naam: "Presentatie",
    tot: 8 * 60,
    tekst: "Zeg hardop: je naam, dat je in Nederland woont, dat je Chinees leert, en één ding dat je lekker vindt.",
    stukken: [
      ["大家好。", "dàjiā hǎo"],
      ["我住在荷兰。", "wǒ zhù zài Hélán"],
      ["我学习中文。", "wǒ xuéxí Zhōngwén"],
      ["我喜欢茶。", "wǒ xǐhuan chá"]
    ]
  },
  {
    naam: "Gesprek",
    tot: 18 * 60,
    tekst: "Je hoort een vraag. Antwoord hardop. Daarna mag je een voorbeeld horen.",
    stukken: [
      ["你叫什么名字？", "nǐ jiào shénme míngzi"],
      ["你住在哪儿？", "nǐ zhù zài nǎr"],
      ["你喜欢什么？", "nǐ xǐhuan shénme"]
    ],
    voorbeelden: [
      ["我叫……", "wǒ jiào …"],
      ["我住在荷兰。", "wǒ zhù zài Hélán"],
      ["我喜欢茶。", "wǒ xǐhuan chá"]
    ]
  },
  {
    naam: "Cultuur",
    tot: 25 * 60,
    tekst: "Dit deel zeg je in het Nederlands. Geen boek, geen film, geen acteur.",
    kaarten: [
      ["Vier tonen", "Mandarijn heeft vier tonen. Dezelfde klank met een andere toon is een ander woord. Noem hardop dat de toon de betekenis verandert."],
      ["春节 Chūnjié", "Het Lentefestival is het Chinese nieuwjaar, op de eerste dag van de maankalender. Families eten dan samen. Zeg dat hardop."],
      ["Een karakter", "Een karakter is een teken met een betekenis. Een letter is alleen een klank. Zeg dat verschil hardop."]
    ]
  }
];

function zegKlankMis() {
  let m = document.getElementById("klankmis");
  if (!m) {
    m = document.createElement("p");
    m.id = "klankmis";
    m.className = "bij";
    document.getElementById("app").prepend(m);
  }
  m.hidden = false;
  m.textContent = "Spraak niet beschikbaar in deze browser.";
}
function hoor(hz, knop) {
  if (!("speechSynthesis" in window)) { zegKlankMis(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(hz);
  u.lang = "zh-CN"; u.rate = 0.8;
  const v = speechSynthesis.getVoices().find(x => /^zh[-_]CN/i.test(x.lang)) || speechSynthesis.getVoices().find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  if (knop) knop.disabled = true;
  u.onend = u.onerror = () => { if (knop) knop.disabled = false; };
  speechSynthesis.speak(u);
}

function markeer(id, juist) {
  stand.goed[id] = !!juist;
  bewaar();
}

function pyZicht() { return stand.pinyin ? "" : " verborgen"; }

function regelsHtml(regels) {
  return regels.map(([hz, py]) =>
    `<div class="rij"><div><div class="hz">${hz}</div><div class="py">${py}</div></div>` +
    (py ? `<button type="button" data-hoor="${hz.replace(/[，。？！]/g, "")}">Hoor</button>` : "") +
    `</div>`
  ).join("");
}

function vragenHtml(bron, vragen) {
  return vragen.map((v, i) => {
    const id = bron + "-" + i;
    const gekozen = stand.goed[id];
    const knoppen = v[1].map((k, n) => {
      let klas = "keuze";
      if (gekozen === true && n === v[2]) klas += " goed";
      if (gekozen === false && n === v[2]) klas += " goed";
      return `<button type="button" class="${klas}" data-keuze="${id}" data-n="${n}" data-goed="${v[2]}">${k}</button>`;
    }).join("");
    return `<div class="kaart"><p>${v[0]}</p><div class="rij">${knoppen}</div></div>`;
  }).join("");
}

function tekenPoort() {
  const n = Object.values(stand.goed).filter(Boolean).length;
  const tal = Object.keys(stand.goed).length;
  return `
    <h1>Staatsexamen Chinees</h1>
    <p>Eigen oefenblad. Elementair, vwo, niveau A1. Geen examen-pdf, geen scan, geen acteur.</p>
    <p class="bij">De echte opgaven, de officiële tijd en de beoordeling blijven bij DUO, vakinformatie staatsexamen vo, Chinese taal en cultuur elementair vwo. Dit blad kopieert die opgaven niet.</p>
    <div class="kaart">
      <p class="score">Bijgehouden: ${n} goed van ${tal} gekozen.</p>
      <p>A Lezen, op het schriftelijk deel.</p>
      <p>B Kijken en luisteren, op het mondeling.</p>
      <p>C Gesprek en spreken, op het mondeling.</p>
      <p>D Schrijven op een scherm en op papier, op het schriftelijk deel.</p>
      <p>E Cultuur, op het mondeling, in het Nederlands.</p>
      <p class="bij">Het mondeling duurt 25 minuten, zonder de voorbereiding van de casus. Schrijven wordt bekeken op inhoud, aantal woorden, grammatica, woordenschat, spelling en samenhang. Dit blad telt alleen of jouw punten in de tekst staan.</p>
    </div>
    <p class="bij">Pinyin zet je aan en uit in de balk.</p>`;
}

function tekenLees() {
  const blokken = LEES.map(t => {
    let lijf = "";
    if (t.rooster) {
      lijf = `<table>${t.rooster.map(r =>
        `<tr><td class="tijd"><div class="hz">${r[0]}</div><div class="py">${r[1]}</div></td>` +
        `<td><div class="hz">${r[2]}</div><div class="py">${r[3]}</div></td>` +
        `<td><button type="button" data-hoor="${r[0]}">Hoor</button> <button type="button" data-hoor="${r[2]}">Hoor</button></td></tr>`
      ).join("")}</table>`;
    } else lijf = regelsHtml(t.regels);
    return `<h2>${t.titel}</h2><div class="kaart${pyZicht()}">${lijf}</div>${vragenHtml(t.id, t.vragen)}`;
  }).join("");
  return `<h1>Lees</h1><p class="bij">Lees eerst. Kies daarna. Een miss toont het goede antwoord, je mag opnieuw.</p>${blokken}`;
}

function tekenHoor() {
  const blokken = HOOR.map(h => {
    const id = h.id;
    const gezien = stand.goed[id] !== undefined;
    const kijk = h.kijk === "klok" ? `<div class="tafel" aria-hidden="true"><div class="wijzer uur" style="transform:rotate(90deg)"></div><div class="wijzer min"></div></div><div class="kom">茶</div>` : "";
    const knoppen = h.keuzes.map((k, n) => {
      let klas = "keuze";
      if (gezien && n === h.goed) klas += " goed";
      return `<button type="button" class="${klas}" data-keuze="${id}" data-n="${n}" data-goed="${h.goed}">${k}</button>`;
    }).join("");
    const open = gezien ? `<div class="hz">${h.zin[0]}</div><div class="py">${h.zin[1]}</div>` : `<p class="bij">De zin blijft dicht tot je kiest.</p>`;
    const stukken = h.stukken.map(s => `<button type="button" data-hoor="${s}">Hoor</button>`).join(" ");
    return `<h2>${h.titel}</h2><div class="kaart${pyZicht()}">${kijk}<div class="rij">${stukken}</div>${open}<p>${h.vraag}</p><div class="rij">${knoppen}</div></div>`;
  }).join("");
  return `<h1>Hoor</h1><p id="klankmis" class="bij" hidden>Spraak niet beschikbaar in deze browser.</p><p class="bij">De stem is de bestaande klank van dit bord. Geen acteur, geen examenopname.</p>${blokken}`;
}

function puntStaat(tekst, groep) {
  return groep.some(w => tekst.includes(w));
}

function tekenSchrijf() {
  const tekst = stand.schrijf || "";
  const punten = SCHRIJF.punten.map(([zin, groep]) => {
    const aan = puntStaat(tekst, groep) ? " aan" : "";
    return `<div class="punt"><div class="vink${aan}"></div><div>${zin}</div></div>`;
  }).join("");
  const n = [...tekst].filter(ch => ch >= "\u3400" && ch <= "\u9fff").length;
  const model = stand.toonModel ? `<div class="kaart${pyZicht()}"><p class="bij">Eigen voorbeeld, geen examenantwoord.</p>${regelsHtml(SCHRIJF.model)}</div>` : "";
  return `<h1>Schrijf op het scherm</h1>
    <div class="kaart"><p>${SCHRIJF.situatie}</p>${punten}<p class="bij">Minstens vijftien tekens. De stip telt of het punt erin staat, niet de grammatica en niet de volgorde.</p></div>
    <textarea id="schrijf" placeholder="Typ hier in het Chinees."></textarea>
    <p class="bij score">${n} tekens</p>
    <p><button type="button" id="model">${stand.toonModel ? "Verberg voorbeeld" : "Toon eigen voorbeeld"}</button></p>
    ${model}`;
}

function tekenPapier() {
  const lijst = PAPIER.punten.map((p, i) => {
    const aan = stand.goed["papier-" + i] ? " aan" : "";
    return `<div class="punt"><button type="button" class="vink${aan}" data-papier="${i}" aria-label="punt ${i + 1}"></button><div>${i + 1}. ${p}</div></div>`;
  }).join("");
  const model = stand.toonPapier ? `<div class="kaart${pyZicht()}"><p class="bij">Eigen voorbeeld. Schrijf het zijne niet over tot je het jouwe af hebt.</p>${regelsHtml(PAPIER.model)}</div>` : "";
  return `<h1>Schrijf op papier</h1>
    <div class="kaart"><p>${PAPIER.situatie}</p><p>Pak papier en pen. Werk de vijf punten af, in deze volgorde.</p>${lijst}</div>
    <p><button type="button" id="papierklok">Start 15 minuten</button> <span id="papierrest" class="fase"></span></p>
    <p><button type="button" id="papiermodel">${stand.toonPapier ? "Verberg voorbeeld" : "Ik heb geschreven"}</button></p>
    ${model}`;
}

let mondTimer = null;
let mondRest = 25 * 60;
let papierTimer = null;

function faseNu(sec) {
  const voorbij = 25 * 60 - sec;
  if (voorbij < 8 * 60) return "Presentatie";
  if (voorbij < 18 * 60) return "Gesprek";
  return "Cultuur";
